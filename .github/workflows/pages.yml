# Publishes the course website to https://adavoudi.info/de-mastery on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packages the site needs (same pins as the `web` extra in pyproject.toml)
        run: pip install fastapi==0.115.6 jinja2==3.1.5 markdown-it-py==4.2.0 mdit-py-plugins==0.6.1 pygments==2.21.0 httpx==0.28.1 pyyaml
      - name: Export the static site
        run: PYTHONPATH=web:cli/src python -m de_web.export --out dist --base /de-mastery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
