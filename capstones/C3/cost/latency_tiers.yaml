# C3 / M7 — Latency-tier cost template.
# Compare the monthly cost of serving the SAME mart at three freshness tiers.
# Fill in the numbers for YOUR target scale (defaults are illustrative placeholders
# for the capstone's ~1 PB/year domain). The acceptance test checks that
# total_usd_month == compute + storage + ops for each tier (±20% tolerance),
# so the template is self-consistent, and that cost is monotonic with freshness
# (seconds >= minutes >= hours).
currency: USD
period: month
scale_note: "~1 PB/year; adjust to your run"

tiers:
  seconds:        # Flink + Fluss hot path, always-on
    freshness_sla: "< 5 s"
    compute_usd_month: 18000
    storage_usd_month: 4000
    ops_usd_month: 6000
    total_usd_month: 28000
  minutes:        # micro-batch Flink / Spark Structured Streaming, 1-5 min triggers
    freshness_sla: "1-5 min"
    compute_usd_month: 7000
    storage_usd_month: 3500
    ops_usd_month: 3000
    total_usd_month: 13500
  hours:          # batch lakehouse rebuild (reuses C1), hourly/daily
    freshness_sla: "1-24 h"
    compute_usd_month: 2000
    storage_usd_month: 3000
    ops_usd_month: 1500
    total_usd_month: 6500

# When NOT to buy seconds: if the business SLA is hourly, the batch tier is ~4x
# cheaper and simpler (STH philosophy: "if hourly freshness is fine, a batch
# lakehouse is simpler and cheaper").
