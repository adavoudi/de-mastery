  prompt: "In Flink, what does keyBy do before an aggregation?"
  options: {A: "Sorts the whole stream", B: "Partitions the stream by key so each key's records go to one subtask", C: "Buffers to disk", D: "Nothing"}
  answer: [B]
  explanation: "keyBy hash-partitions the stream so all records for a key are processed together."
