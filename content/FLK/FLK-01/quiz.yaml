- id: FLK-01-q1
  type: single
  prompt: "Which process schedules tasks, coordinates checkpoints and reacts to failures, but does NOT process record data itself?"
  options: {A: "TaskManager", B: "JobManager", C: "Task slot", D: "The Kafka broker"}
  answer: [B]
  explanation: "The JobManager builds the execution graph, schedules subtasks into slots, drives checkpoint barriers and restarts the job on failure. TaskManagers do the actual data processing and hold state."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q2
  type: single
  prompt: "A linear pipeline source → map → window → sink runs at parallelism 4 with default slot sharing. How many task slots does the job require?"
  options: {A: "16", B: "4", C: "1", D: "8"}
  answer: [B]
  explanation: "With default slot sharing, subtasks of different operators of the same job share a slot. One slot holds one parallel slice of the whole pipeline, so the job needs slots equal to its MAX operator parallelism (4), not the sum (16)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#task-slots-and-resources"

- id: FLK-01-q3
  type: single
  prompt: "What is a 'task slot' in Flink?"
  options: {A: "A thread that runs exactly one operator", B: "A unit of resource isolation within a TaskManager that can hold one slice of a job's pipeline", C: "A Kafka partition assignment", D: "A checkpoint storage location"}
  answer: [B]
  explanation: "A slot is a fixed share of a TaskManager's resources. A TM with N slots can run N parallel pipeline slices. Slot sharing lets subtasks of different operators of one job share a slot."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#task-slots-and-resources"

- id: FLK-01-q4
  type: single
  prompt: "What breaks an operator chain so two operators run as separate tasks connected by a data exchange?"
  options: {A: "A map after a filter", B: "A keyBy / rebalance (a redistribution of records)", C: "Setting a higher heap size", D: "Enabling checkpoints"}
  answer: [B]
  explanation: "Flink chains adjacent operators that don't need a network shuffle. A keyBy (or rebalance/rescale) hash-partitions records and breaks the chain — the streaming analogue of a Spark stage boundary at a shuffle."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#tasks-and-operator-chains"

- id: FLK-01-q5
  type: single
  prompt: "You submit a job whose max operator parallelism is 6 to a cluster with 2 TaskManagers of 2 slots each (4 slots total). What happens?"
  options: {A: "It runs at parallelism 6 by oversubscribing slots", B: "It cannot be scheduled and never reaches RUNNING (not enough slots)", C: "It silently drops to parallelism 1", D: "The JobManager spawns more TaskManagers automatically"}
  answer: [B]
  explanation: "A standalone session cluster has a fixed number of slots. If the job needs more slots than are available, scheduling fails and the job stays in SCHEDULED/CREATED (eventually failing), never RUNNING, until more slots exist."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/execution/parallel/"

- id: FLK-01-q6
  type: single
  prompt: "In Flink's model, how is a bounded dataset (e.g. a file) related to a stream?"
  options: {A: "Batch and streaming use completely separate engines", B: "A bounded dataset is a stream that happens to end; the same engine runs both", C: "Bounded data must be converted to Kafka first", D: "Flink cannot read bounded data"}
  answer: [B]
  explanation: "Flink treats streaming as the primitive and a bounded dataset as a stream that ends. A batch job is a special case of a streaming job on the same runtime."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q7
  type: multi
  prompt: "Which are legitimate reasons to NOT choose Flink for a workload? (select all)"
  options: {A: "A once-a-day refresh of a reporting mart", B: "Stateless reformat/route of messages on a topic", C: "A continuous fraud-scoring pipeline needing low latency and large state", D: "A team with no experience operating stateful streaming jobs"}
  answer: [A, B, D]
  explanation: "Daily batch (A) suits dbt/Spark; stateless routing (B) suits Connect SMTs; without streaming-ops maturity (D) a simpler tool wins. (C) is exactly where Flink's event-time + large managed state + exactly-once pay off."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q8
  type: single
  prompt: "A bounded Flink job completes all its sources. Which state transition occurs?"
  options: {A: "RUNNING → FINISHED", B: "RUNNING → CANCELED", C: "RUNNING → RESTARTING", D: "It stays RUNNING forever"}
  answer: [A]
  explanation: "When every source of a bounded job is exhausted, the job transitions RUNNING → FINISHED. An unbounded job stays RUNNING until cancelled or failed."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/glossary/"
