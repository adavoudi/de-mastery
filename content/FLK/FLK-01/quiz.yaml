- id: FLK-01-q1
  type: single
  prompt: "Which process schedules tasks, coordinates checkpoints and reacts to failures, but does NOT process record data?"
  options: {A: "TaskManager", B: "JobManager", C: "Task slot", D: "The Kafka broker"}
  answer: [B]
  explanation: "The JobManager builds the execution graph, schedules subtasks into slots, drives checkpoint barriers and restarts the job after a failure. The TaskManagers process the data and hold state."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q2
  type: single
  prompt: "A linear pipeline source → map → window → sink runs at parallelism 4 with default slot sharing. How many task slots does the job need?"
  options: {A: "16", B: "4", C: "1", D: "8"}
  answer: [B]
  explanation: "With default slot sharing, subtasks of different operators of the same job share a slot. One slot holds one parallel slice of the whole pipeline. So the job needs a number of slots equal to its MAX operator parallelism (4), not the sum (16)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#task-slots-and-resources"

- id: FLK-01-q3
  type: single
  prompt: "What is a 'task slot' in Flink?"
  options: {A: "A thread that runs exactly one operator", B: "A unit of resource isolation in a TaskManager that can hold one slice of the pipeline of a job", C: "A Kafka partition assignment", D: "A checkpoint storage location"}
  answer: [B]
  explanation: "A slot is a fixed share of the resources of a TaskManager. A TM with N slots can run N parallel pipeline slices. Slot sharing lets subtasks of different operators of one job share a slot."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#task-slots-and-resources"

- id: FLK-01-q4
  type: single
  prompt: "What breaks an operator chain, so that two operators run as separate tasks that a data exchange connects?"
  options: {A: "A map after a filter", B: "A keyBy / rebalance (a redistribution of records)", C: "Setting a higher heap size", D: "Enabling checkpoints"}
  answer: [B]
  explanation: "Flink chains adjacent operators that do not need a network shuffle. A keyBy (or rebalance/rescale) redistributes records and breaks the chain. A Spark stage boundary at a shuffle works in the same way."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/#tasks-and-operator-chains"

- id: FLK-01-q5
  type: single
  prompt: "You submit a job with a max operator parallelism of 6. The cluster has 2 TaskManagers with 2 slots each (4 slots in total). What happens?"
  options: {A: "It runs at parallelism 6 and uses more subtasks than slots", B: "It cannot be scheduled and never reaches RUNNING (not enough slots)", C: "It silently drops to parallelism 1", D: "The JobManager starts more TaskManagers automatically"}
  answer: [B]
  explanation: "A standalone session cluster has a fixed number of slots. Suppose the job needs more slots than the cluster has. Then scheduling fails. The job stays in SCHEDULED/CREATED (and eventually fails). It never reaches RUNNING until more slots exist."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/execution/parallel/"

- id: FLK-01-q6
  type: single
  prompt: "In the Flink model, how is a bounded dataset (for example a file) related to a stream?"
  options: {A: "Batch and streaming use completely separate engines", B: "A bounded dataset is a stream that ends. The same engine runs both", C: "Bounded data must be converted to Kafka first", D: "Flink cannot read bounded data"}
  answer: [B]
  explanation: "Flink treats streaming as the basic idea and a bounded dataset as a stream that ends. A batch job is a special case of a streaming job on the same runtime."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q7
  type: multi
  prompt: "Which are valid reasons to NOT choose Flink for a workload? (select all)"
  options: {A: "A once-a-day refresh of a reporting mart", B: "Stateless reformat or routing of messages on a topic", C: "A continuous fraud-scoring pipeline needing low latency and large state", D: "A team with no experience operating stateful streaming jobs"}
  answer: [A, B, D]
  explanation: "Daily batch (A) suits dbt/Spark. Stateless routing (B) suits Connect SMTs. Without streaming-ops maturity (D), a simpler tool is better. (C) is the case where the event time, large managed state and exactly-once of Flink pay off."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/flink-architecture/"

- id: FLK-01-q8
  type: single
  prompt: "All sources of a bounded Flink job finish. Which state transition occurs?"
  options: {A: "RUNNING → FINISHED", B: "RUNNING → CANCELED", C: "RUNNING → RESTARTING", D: "It stays RUNNING forever"}
  answer: [A]
  explanation: "When every source of a bounded job is exhausted, the job goes from RUNNING to FINISHED. An unbounded job stays RUNNING until it is cancelled or fails."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/glossary/"
