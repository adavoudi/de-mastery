- id: FLK-03-q1
  type: single
  prompt: "What does a watermark of T assert as it flows through the stream?"
  options: {A: "Exactly T events have been processed", B: "No event with a timestamp <= T is expected to arrive after this point", C: "The processing-time clock is now T", D: "The window of size T is full"}
  answer: [B]
  explanation: "A watermark of T claims completeness up to event time T. The system believes that no more events with timestamp <= T will arrive. So event-time windows that end at or before T can fire."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/time/"

- id: FLK-03-q2
  type: single
  prompt: "forBoundedOutOfOrderness(Duration.ofSeconds(5)) emits a watermark equal to:"
  options: {A: "the current processing time", B: "the maximum event timestamp seen minus 5 seconds", C: "the minimum event timestamp seen", D: "exactly 5 seconds"}
  answer: [B]
  explanation: "It tracks the max event timestamp that it has seen and emits (max - bound). A larger bound tolerates more out-of-order events, but it delays firing. A smaller bound fires sooner, but it drops more events as late."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/event-time/generating_watermarks/"

- id: FLK-03-q3
  type: single
  prompt: "An event arrives after the watermark has already passed the end of its window. No late-data handling is configured. What happens to the event?"
  options: {A: "It re-opens the window automatically", B: "It is silently dropped", C: "It is buffered forever", D: "The job fails"}
  answer: [B]
  explanation: "By default, Flink silently drops events that are later than the watermark for their window. allowedLateness keeps the window so that it can re-fire. sideOutputLateData routes the too-late events to a stream, so Flink does not lose them silently."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/windows/"

- id: FLK-03-q4
  type: single
  prompt: "What does sideOutputLateData(tag) do?"
  options: {A: "Delays all output by a fixed amount", B: "Routes events that arrive after end + allowedLateness to a side-output stream and does not drop them", C: "Fires the window early", D: "Enables processing-time windows"}
  answer: [B]
  explanation: "It captures events that are too late for their window (past end + allowedLateness) into a side-output stream. This stream is a dead-letter for late facts. You can audit or reconcile them, and Flink does not lose them silently."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/windows/#getting-late-data-as-a-side-output"

- id: FLK-03-q5
  type: single
  prompt: "The watermark of a keyed operator is the MINIMUM across its input partitions. One partition goes quiet (no events). Without idleness, what happens to windows on the busy partitions?"
  options: {A: "They keep firing normally", B: "They stop firing because the combined watermark freezes at the last value of the quiet partition", C: "They switch to processing time", D: "They fire twice as fast"}
  answer: [B]
  explanation: "The watermark cannot advance past a partition that might still produce older data. So a quiet partition holds the minimum, and every window stalls, even for busy partitions. This is the stuck-watermark trap."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/event-time/generating_watermarks/#dealing-with-idle-sources"

- id: FLK-03-q6
  type: single
  prompt: "withIdleness(Duration.ofSeconds(10)) does what?"
  options: {A: "Pauses the job for 10 seconds", B: "Marks a partition idle after 10s of no events. This excludes it from the watermark minimum, so windows fire on the active partitions", C: "Drops events older than 10 seconds", D: "Sets the window size to 10 seconds"}
  answer: [B]
  explanation: "Flink temporarily excludes an idle partition from the watermark computation. The combined watermark then advances on the active partitions, and windows fire again. The partition rejoins when it produces data."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/event-time/generating_watermarks/#dealing-with-idle-sources"

- id: FLK-03-q7
  type: single
  prompt: "Which window assigner closes a window only after a configurable gap of inactivity for a key?"
  options: {A: "Tumbling", B: "Sliding", C: "Session", D: "Global"}
  answer: [C]
  explanation: "Session windows group bursts of activity. They close after a gap of no events for the key. Tumbling windows are fixed and non-overlapping. Sliding windows are fixed and overlapping."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/windows/#session-windows"

- id: FLK-03-q8
  type: single
  prompt: "Why is bucketing hourly GMV by processing time (arrival) a problem?"
  options: {A: "It is slower", B: "A delayed event lands in the wrong hour, so the result is wrong and you cannot reproduce it on replay", C: "It uses more memory", D: "Processing time is unavailable in Flink"}
  answer: [B]
  explanation: "Processing-time buckets depend on when Flink saw the event. So network delays move events into the wrong hour, and a replay of the same events gives different answers. Event time sets the bucket to the time when the event happened."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/time/"
