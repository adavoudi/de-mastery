- id: FLK-04-q1
  type: single
  prompt: "What is the result of a Flink SQL query, conceptually?"
  options: {A: "A one-shot result set like a batch query", B: "A dynamic table that changes over time, represented by a changelog stream", C: "A Kafka topic", D: "A materialized view that never updates"}
  answer: [B]
  explanation: "A continuous Flink SQL query produces a dynamic table. This is a result that updates continuously. Its changes are a changelog stream of rows with a RowKind tag."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/dynamic_tables/"

- id: FLK-04-q2
  type: multi
  prompt: "Which RowKinds does an UNBOUNDED GROUP BY aggregation emit when new rows arrive for existing keys? (select all)"
  options: {A: "+I (INSERT)", B: "-U (UPDATE_BEFORE)", C: "+U (UPDATE_AFTER)", D: "It emits nothing until the stream ends"}
  answer: [A, B, C]
  explanation: "A key first appears as +I. When its aggregate changes, the query retracts the old value (-U) and emits the new value (+U). It is an updating query, not an append-only query."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/dynamic_tables/"

- id: FLK-04-q3
  type: single
  prompt: "Which query is APPEND-ONLY (emits only +I)?"
  options: {A: "SELECT k, COUNT(*) FROM t GROUP BY k (unbounded)", B: "A windowed aggregation over a TUMBLE window TVF", C: "SELECT k, LAST_VALUE(v) FROM t GROUP BY k", D: "A deduplication keeping the latest row per key"}
  answer: [B]
  explanation: "A window TVF aggregation emits each window once when it closes, so it is append-only. Unbounded GROUP BY and latest-per-key queries are updating. They retract and revise."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/window-tvf/"

- id: FLK-04-q4
  type: single
  prompt: "You have an updating query (a GROUP BY that produces -U/+U). Which sink keeps its semantics?"
  options: {A: "A plain append-only kafka connector", B: "upsert-kafka keyed by the GROUP BY key", C: "A filesystem CSV sink", D: "print()"}
  answer: [B]
  explanation: "upsert-kafka writes a compacted, keyed changelog (latest value per key, null value = delete). This materialises the dynamic table of the updating query. A plain append topic would duplicate every revision."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/connectors/table/upsert-kafka/"

- id: FLK-04-q5
  type: single
  prompt: "Flink consumed all input. How does the final materialized state of an updating streaming query relate to the batch answer over the same data?"
  options: {A: "They can differ", B: "The streaming final state equals the batch result", C: "The streaming state is always larger", D: "Only append-only queries match batch"}
  answer: [B]
  explanation: "The retractions in the changelog are intermediate. When Flink folds all input, the state of the dynamic table equals the batch answer over the same events. This is the streaming/batch agreement oracle (G6)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/dynamic_tables/"

- id: FLK-04-q6
  type: single
  prompt: "What does a -D (DELETE) RowKind in a changelog represent?"
  options: {A: "A duplicate row", B: "Removal of a row from the dynamic table", C: "A late event", D: "A watermark"}
  answer: [B]
  explanation: "-D removes a row from the result (for example, a key no longer qualifies). The changelog uses -D together with +I/-U/+U to express every change of the dynamic table."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/dynamic_tables/"

- id: FLK-04-q7
  type: single
  prompt: "In Flink 2.x SQL, how do you express a one-hour tumbling window over a table t that has the event-time column ts?"
  options: {A: "GROUP BY FLOOR(ts TO HOUR)", B: "TABLE(TUMBLE(TABLE t, DESCRIPTOR(ts), INTERVAL '1' HOUR)) then GROUP BY window_start, window_end", C: "WINDOW w AS (ORDER BY ts)", D: "PARTITION BY HOUR(ts)"}
  answer: [B]
  explanation: "Flink 2.x uses window table-valued functions. TUMBLE/HOP/CUMULATE produce window_start/window_end columns that you GROUP BY. The aggregation is append-only (one row per closed window)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/window-tvf/"

- id: FLK-04-q8
  type: single
  prompt: "Why grade a ported dbt model on its changelog output and not only on the final printed number?"
  options: {A: "The final number is always wrong", B: "To verify that the query is a correct updating query that converges (right RowKinds + right final state), and not a query that only prints the right value once", C: "Because changelogs are faster", D: "To check column order"}
  answer: [B]
  explanation: "A check of the RowKinds proves that the query updates correctly (it retracts and emits again). A check of the folded final state proves that it matches the batch oracle. Together, they catch queries that are wrong about append vs update, even if a single snapshot looks right."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/dynamic_tables/"
