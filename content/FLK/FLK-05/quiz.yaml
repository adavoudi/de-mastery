- id: FLK-05-q1
  type: single
  prompt: "An order placed on 2026-01-08 must be converted to USD. The business requires the FX rate that was in effect on 2026-01-08, even when the pipeline reprocesses the order weeks later. Which join is correct?"
  options:
    A: "A lookup join to a JDBC fx_rates table"
    B: "A temporal join: fx FOR SYSTEM_TIME AS OF o.order_ts"
    C: "A regular join on currency only"
    D: "An interval join within 1 hour of the order"
  answer: [B]
  explanation: "A temporal (versioned) join picks the dimension version that was effective at the event time of the fact. This is the as-of/SCD2 rule. A JDBC lookup reads the rate as it is now, which is wrong for reprocessing. A regular join on currency alone matches every version. An interval join restricts the result to matches that are local in time. It does not pick as-of versions."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: FLK-05-q2
  type: single
  prompt: "What bounds the state of an interval join?"
  options:
    A: "The number of distinct keys"
    B: "The time interval in the join condition (Flink evicts rows outside it)"
    C: "Nothing. Interval joins keep all rows"
    D: "The parallelism of the operator"
  answer: [B]
  explanation: "An interval join matches only rows whose timestamps are within the declared interval. So Flink can evict state that is older than the interval (relative to the watermark). This bounded state is the main reason to prefer it over a regular join for two unbounded streams."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/joins/"

- id: FLK-05-q3
  type: single
  prompt: "Which risk does a regular (standard) join between two unbounded streams have?"
  options:
    A: "It cannot emit any results"
    B: "Its state can grow without bound because both sides are retained to match future rows"
    C: "It silently drops late data"
    D: "It only works in batch mode"
  answer: [B]
  explanation: "A regular join retains both inputs, so a future row on either side can still find a match. It emits retractions when a match changes. Without a state TTL, that state grows without bound. This is the reason why it is unsafe for two large fact streams."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/joins/"

- id: FLK-05-q4
  type: single
  prompt: "In a Flink SQL temporal join, what must the versioned (right) table have?"
  options:
    A: "A PRIMARY KEY and an event-time attribute (so each key has versions ordered in time)"
    B: "A processing-time attribute only"
    C: "No key at all"
    D: "Exactly one row per key"
  answer: [A]
  explanation: "A versioned table needs a PRIMARY KEY (the version identity) and an event-time attribute/watermark. Then the planner can order the versions and answer FOR SYSTEM_TIME AS OF. Without a primary key, the planner rejects the temporal join."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: FLK-05-q5
  type: single
  prompt: "You build an as-of enrichment by hand with a KeyedCoProcessFunction. Why do you register an event-time timer at the timestamp of the fact before you emit?"
  options:
    A: "To rate-limit the output"
    B: "To wait until the watermark passes the time of the fact, so that every dimension version effective at or before that moment has arrived"
    C: "Because timers are required for any ProcessFunction"
    D: "To convert processing time to event time"
  answer: [B]
  explanation: "The as-of answer is final only when no dimension version with an earlier or equal timestamp can still arrive. An event-time timer at the timestamp of the fact fires when the watermark reaches that timestamp. Then the correct version is already in state. If you emit immediately, you risk picking a stale version."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/process_function/"

- id: FLK-05-q6
  type: single
  prompt: "A lookup join (for example JDBC) enriches orders with the address of the customer. You replay the pipeline to reprocess last quarter. What goes wrong?"
  options:
    A: "Nothing; lookup joins are always correct"
    B: "Each order gets the address as it is NOW, not the address that was effective at the date of the order"
    C: "The join produces duplicates"
    D: "The watermark stalls"
  answer: [B]
  explanation: "A lookup join reads the external row at processing time. This is the current value. If you reprocess old orders, the join stamps them with today's address. This is a point-in-time error. Historical restatement needs a temporal join over the change history of the address."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/joins/"

- id: FLK-05-q7
  type: multi
  prompt: "Which statements about the as-of (point-in-time) rule are correct? (choose all)"
  options:
    A: "Pick the dimension version with the greatest effective_from that is <= the event time of the fact"
    B: "A version with effective_from strictly greater than the fact time must not be chosen"
    C: "If no version is effective at or before the fact time, a LEFT temporal join yields NULLs for the dimension columns"
    D: "You should always pick the newest version regardless of the fact's time"
  answer: [A, B, C]
  explanation: "As-of means the latest version that is effective at or before the event time. A future version is not eligible. A LEFT join yields NULLs when no version qualifies. To always pick the newest version is the bug (converting at today's rate)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: FLK-05-q8
  type: single
  prompt: "Unbounded keyed state in a regular or temporal join can be a problem over months of data. Why, and what control limits it?"
  options:
    A: "It cannot be limited. You must restart the job"
    B: "A state TTL (time-to-live) evicts entries that nobody accessed within a configured duration"
    C: "Increasing parallelism removes state"
    D: "Checkpoints delete state"
  answer: [B]
  explanation: "State TTL expires entries that nobody read or wrote within the TTL. This bounds the memory for joins whose keys or versions accumulate. Parallelism and checkpoints do not shrink logical state. A restart loses the state (and correctness)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/state/"
