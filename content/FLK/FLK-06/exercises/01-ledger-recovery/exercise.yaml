id: FLK-06/01-ledger-recovery
title: Survive a TaskManager crash with exactly-once ledger invariants
entry: src/main/java/de/flk/LedgerJob.java
lab: none
timeout_s: 300
hints:
  - "Call env.enableCheckpointing(...) so operator state is snapshotted. The default checkpointing mode is EXACTLY_ONCE; a replayable bounded source (NumberSequenceSource) lets recovery rewind to the checkpointed position."
  - "Use a FileSink with OnCheckpointRollingPolicy so files are only committed when a checkpoint completes. Output written since the last complete checkpoint is rolled back on restart, which is what prevents duplicates after the crash."
  - "Write exactly one line per source id (its decimal string) so the grader can check no-loss / no-duplication over the committed output. Read the output directory from args[0]."
cert_objectives: [dse-flink:checkpoints]
