- id: FLK-06-q1
  type: single
  prompt: "A TaskManager is SIGKILLed mid-run. Which combination makes the final committed output contain every input exactly once?"
  options:
    A: "A replayable source + checkpointed state + a sink that commits on checkpoint"
    B: "A non-replayable source + checkpointing"
    C: "Checkpointing disabled + an idempotent sink"
    D: "A print sink + a high parallelism"
  answer: [A]
  explanation: "Exactly-once end to end needs all three: the source rewinds to the checkpointed offset (no loss), state is restored from the checkpoint, and the sink only makes data visible once the checkpoint is complete (no duplicates). Missing any one breaks the guarantee."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q2
  type: single
  prompt: "What is a checkpoint barrier?"
  options:
    A: "A lock that stops all processing while state is saved"
    B: "A marker injected into the streams that flows with records; an operator snapshots its state when it has received the barrier on all inputs"
    C: "A network buffer limit"
    D: "A savepoint taken by the user"
  answer: [B]
  explanation: "The barrier is a special record the JobManager injects at the sources. It flows with the data; when an operator has aligned the barrier across all its inputs it snapshots and forwards it. This asynchronous barrier snapshot avoids a global stop-the-world pause."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q3
  type: single
  prompt: "On recovery from the last completed checkpoint, what happens to the sources?"
  options:
    A: "They start from the very beginning of the stream"
    B: "They are rewound to the offsets recorded in that checkpoint, so processing resumes at the consistent cut"
    C: "They skip ahead to the latest offset"
    D: "They are unaffected; only state is restored"
  answer: [B]
  explanation: "A consistent checkpoint ties operator state to specific source offsets. On restart the sources rewind to those offsets so the restored state and the replayed input line up exactly — no gap, no overlap."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/checkpointing/"

- id: FLK-06-q4
  type: single
  prompt: "How does a commit-on-checkpoint (transactional/2PC) sink avoid duplicates after a crash?"
  options:
    A: "It deduplicates by scanning previous output"
    B: "It only makes data visible when the checkpoint that produced it is confirmed complete; output since the last complete checkpoint is rolled back on restart"
    C: "It writes every record twice and keeps one"
    D: "It disables retries"
  answer: [B]
  explanation: "A 2PC sink pre-commits on checkpoint and finalizes on checkpoint-complete. Data written after the last complete checkpoint is never finalized, so a restart that rewinds and reproduces it does not create a visible duplicate for a downstream reader."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/connectors/datastream/filesystem/"

- id: FLK-06-q5
  type: single
  prompt: "A savepoint differs from a checkpoint mainly because it is:"
  options:
    A: "Faster to take"
    B: "User-triggered, self-contained and portable — made for stop/upgrade/rescale, not automatic fault tolerance"
    C: "Stored only in memory"
    D: "Taken on every record"
  answer: [B]
  explanation: "Both use the same snapshot mechanism, but savepoints are explicit, self-contained and owned by the operator for lifecycle operations (upgrade, rescale, migrate). Checkpoints are automatic, interval-based and tuned for cheap recovery."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/state/savepoints/"

- id: FLK-06-q6
  type: single
  prompt: "Why must a source be 'replayable' for exactly-once?"
  options:
    A: "To increase throughput"
    B: "So on restart it can rewind to the offset recorded in the checkpoint; a non-rewindable source would lose or re-send the wrong records"
    C: "Because sinks require it"
    D: "Replayability is only needed in batch mode"
  answer: [B]
  explanation: "The checkpoint stores source positions. Recovery rewinds to them so restored state and replayed input align. A source that cannot rewind (e.g. a plain socket) cannot restore that alignment, so exactly-once is impossible."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/checkpointing/"

- id: FLK-06-q7
  type: multi
  prompt: "After a mid-run crash, which 'ledger invariants' should hold over the committed sink output? (choose all)"
  options:
    A: "Every source id appears at least once (no loss)"
    B: "No source id appears more than once (no duplication)"
    C: "The committed record count equals the number of source records (balanced)"
    D: "The job finished within a fixed wall-clock time"
  answer: [A, B, C]
  explanation: "Fault-tolerance correctness is asserted with invariants: no loss, no duplication, balanced totals. Wall-clock time is used only as a generous timeout, never as a correctness check (recovery timing varies)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q8
  type: single
  prompt: "Keyed state (e.g. a per-account running balance) during a checkpoint is:"
  options:
    A: "Discarded and rebuilt from scratch"
    B: "Included in the snapshot so it is restored on recovery, keeping the balance correct across the crash"
    C: "Only kept if parallelism is 1"
    D: "Stored in the JobManager heap only"
  answer: [B]
  explanation: "Keyed state is part of each operator's snapshot. On recovery the balances are restored to the values as of the consistent cut, so the ledger continues from the correct point rather than resetting."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/state/"
