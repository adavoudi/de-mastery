- id: FLK-06-q1
  type: single
  prompt: "A TaskManager gets SIGKILL in the middle of a run. Which combination makes the final committed output contain every input exactly once?"
  options:
    A: "A replayable source + checkpointed state + a sink that commits on checkpoint"
    B: "A non-replayable source + checkpointing"
    C: "Checkpointing disabled + an idempotent sink"
    D: "A print sink + a high parallelism"
  answer: [A]
  explanation: "Exactly-once end to end needs all three. The source rewinds to the checkpointed offset (no loss). Flink restores state from the checkpoint. The sink makes data visible only when the checkpoint is complete (no duplicates). If one is missing, the guarantee breaks."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q2
  type: single
  prompt: "What is a checkpoint barrier?"
  options:
    A: "A lock that stops all processing while state is saved"
    B: "A marker that Flink injects into the streams and that flows with the records. An operator snapshots its state when it has received the barrier on all inputs"
    C: "A network buffer limit"
    D: "A savepoint taken by the user"
  answer: [B]
  explanation: "The barrier is a special record that the JobManager injects at the sources. It flows with the data. When an operator has aligned the barrier across all its inputs, it snapshots its state and forwards the barrier. This asynchronous barrier snapshot avoids a global stop-the-world pause."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q3
  type: single
  prompt: "Flink recovers from the last completed checkpoint. What happens to the sources?"
  options:
    A: "They start from the very beginning of the stream"
    B: "Flink rewinds them to the offsets recorded in that checkpoint, so processing resumes at the consistent cut"
    C: "They move ahead to the latest offset"
    D: "They are unaffected; only state is restored"
  answer: [B]
  explanation: "A consistent checkpoint ties operator state to specific source offsets. On restart, the sources rewind to those offsets. Then the restored state and the replayed input line up exactly, with no gap and no overlap."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/checkpointing/"

- id: FLK-06-q4
  type: single
  prompt: "How does a commit-on-checkpoint (transactional/2PC) sink avoid duplicates after a crash?"
  options:
    A: "It deduplicates by scanning previous output"
    B: "It makes data visible only when Flink confirms that the checkpoint that produced it is complete. On restart, Flink rolls back the output since the last complete checkpoint"
    C: "It writes every record twice and keeps one"
    D: "It disables retries"
  answer: [B]
  explanation: "A 2PC sink pre-commits on checkpoint and finalizes when the checkpoint is complete. The sink never finalizes data that it wrote after the last complete checkpoint. A restart rewinds and produces this data again. A downstream reader does not see a duplicate."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/connectors/datastream/filesystem/"

- id: FLK-06-q5
  type: single
  prompt: "The main difference between a savepoint and a checkpoint is that a savepoint is:"
  options:
    A: "Faster to take"
    B: "User-triggered, self-contained and portable. It is made for stop/upgrade/rescale, not for automatic fault tolerance"
    C: "Stored only in memory"
    D: "Taken on every record"
  answer: [B]
  explanation: "Both use the same snapshot mechanism. Savepoints are explicit and self-contained. The operator owns them for lifecycle operations (upgrade, rescale, migrate). Checkpoints are automatic, interval-based and tuned for cheap recovery."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/state/savepoints/"

- id: FLK-06-q6
  type: single
  prompt: "Why must a source be 'replayable' for exactly-once?"
  options:
    A: "To increase throughput"
    B: "So on restart it can rewind to the offset recorded in the checkpoint. A source that cannot rewind would lose records or send the wrong records again"
    C: "Because sinks require it"
    D: "Replayability is only needed in batch mode"
  answer: [B]
  explanation: "The checkpoint stores source positions. Recovery rewinds to them, so the restored state and the replayed input align. A source that cannot rewind (for example a plain socket) cannot restore this alignment. Then exactly-once is impossible."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/checkpointing/"

- id: FLK-06-q7
  type: multi
  prompt: "A crash happens in the middle of a run. Which 'ledger invariants' must hold over the committed sink output? (choose all)"
  options:
    A: "Every source id appears at least once (no loss)"
    B: "No source id appears more than once (no duplication)"
    C: "The committed record count equals the number of source records (balanced)"
    D: "The job finished within a fixed wall-clock time"
  answer: [A, B, C]
  explanation: "You assert fault-tolerance correctness with invariants: no loss, no duplication, balanced totals. Wall-clock time is only a generous timeout. It is never a correctness check, because recovery timing varies."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/concepts/stateful-stream-processing/"

- id: FLK-06-q8
  type: single
  prompt: "What happens to keyed state (for example a running balance for each account) during a checkpoint?"
  options:
    A: "Flink discards it and rebuilds it from scratch"
    B: "Flink includes it in the snapshot, so it is restored on recovery. The balance stays correct across the crash"
    C: "Flink keeps it only if parallelism is 1"
    D: "Flink stores it only in the JobManager heap"
  answer: [B]
  explanation: "Keyed state is part of the snapshot of each operator. On recovery, Flink restores the balances to the values as of the consistent cut. The ledger continues from the correct point and does not reset."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/state/"
