- id: FLK-08-q1
  type: single
  prompt: "How does a Table API pipeline relate to the equivalent Flink SQL query?"
  options:
    A: "It is a different engine with different semantics"
    B: "It plans through the same optimizer and has the same changelog semantics, so results are identical"
    C: "It only runs in batch mode"
    D: "It cannot be mixed with SQL"
  answer: [B]
  explanation: "The Table API is a programmatic form of the same relational model. It shares the optimizer and the changelog semantics with SQL. You can mix it freely with SQL. So equivalent queries give identical results."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/tableapi/"

- id: FLK-08-q2
  type: single
  prompt: "You write a pipeline once in the Java Table API and once in the PyFlink Table API. Both run over the same data. What must be true?"
  options:
    A: "They may differ because Python rounds differently"
    B: "They produce the same result. PyFlink builds the same logical plan and runs on the same JVM engine"
    C: "Only the Java one is correct"
    D: "PyFlink runs a separate Python engine with different results"
  answer: [B]
  explanation: "PyFlink is a Python surface over the same Table API. It builds the same plan and runs on the same runtime. So the two are effectively the same job and must agree over the same input."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/python/table/intro_to_table_api/"

- id: FLK-08-q3
  type: single
  prompt: "In the analogy of this platform, which option maps best to a dbt Python model?"
  options:
    A: "A DataStream process function"
    B: "A PyFlink Table API pipeline: a relational model that you write in Python"
    C: "A broadcast state pattern"
    D: "A savepoint"
  answer: [B]
  explanation: "A dbt Python model is a relational transformation that you write in Python. The Table API of PyFlink is the streaming analogue. It has the same declarative model, a Python surface and JVM execution."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/python/table/intro_to_table_api/"

- id: FLK-08-q4
  type: single
  prompt: "A test grades the GMV pipeline. What does it assert?"
  options:
    A: "That you used the Table API and not SQL"
    B: "That the aggregated result equals an independent (DuckDB/Python) oracle, for any API that produced it"
    C: "That the Java and Python code look the same"
    D: "The wall-clock runtime"
  answer: [B]
  explanation: "Per docs/TESTING.md, tests assert behavior and data against an independent oracle. They do not assert which API was called, the code shape or the timing. Any surface (SQL, Table API, DataStream) that gives the correct result passes."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/tableapi/"

- id: FLK-08-q5
  type: single
  prompt: "How does a scalar UDF differ from a table UDF?"
  options:
    A: "A scalar UDF returns one value per row. A table UDF can return many rows for each input row (like explode/lateral)"
    B: "They are the same"
    C: "A table UDF returns one value. A scalar UDF returns many"
    D: "Only aggregate UDFs exist"
  answer: [A]
  explanation: "Scalar UDF: one row in → one value out. Table UDF: one row in → zero or more rows out (you use it with a lateral join). Aggregate UDF: many rows in → one value out."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/functions/udfs/"

- id: FLK-08-q6
  type: single
  prompt: "Why can a UDF-heavy PyFlink job be slower than the Java equivalent?"
  options:
    A: "Python is always slower for everything"
    B: "Each record crosses the Python/JVM boundary, and this is costly. If you keep the work in SQL/Table API (JVM) or use vectorized UDFs, you avoid per-row round-trips"
    C: "PyFlink does not use checkpoints"
    D: "PyFlink cannot aggregate"
  answer: [B]
  explanation: "Row-at-a-time Python UDFs serialize each record across the Python/JVM boundary. If you stay in relational Table API/SQL, the work stays in the JVM. Vectorized (pandas) UDFs batch the crossing. The relational parts run at JVM speed in any language."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/python/table/intro_to_table_api/"

- id: FLK-08-q7
  type: single
  prompt: "You need custom timers and keyed state for each record. Is the Table API the right tool?"
  options:
    A: "Yes, the Table API exposes timers directly"
    B: "No. The Table API is relational. Use the DataStream process functions for control of timers and state for each record"
    C: "Yes, via GROUP BY"
    D: "Only in PyFlink"
  answer: [B]
  explanation: "The Table API is declarative and relational. It does not give control of timers and state for each record. KeyedProcessFunction (DataStream, FLK-07) gives this control."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/tableapi/"

- id: FLK-08-q8
  type: multi
  prompt: "Which are valid ways to write the same per-currency GMV aggregation in Flink? (choose all)"
  options:
    A: "Flink SQL: SELECT ccy, SUM(amt) FROM orders GROUP BY ccy"
    B: "Java Table API: tbl.groupBy($(\"ccy\")).select($(\"ccy\"), $(\"amt\").sum())"
    C: "PyFlink Table API: tbl.group_by(col(\"ccy\")).select(col(\"ccy\"), col(\"amt\").sum)"
    D: "A DataStream keyBy(ccy).sum on the amount field"
  answer: [A, B, C, D]
  explanation: "All four express the same relational aggregation. Over the same bounded input, they give the same final per-currency totals. The grader accepts any of them if the result matches the oracle."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/tableapi/"
