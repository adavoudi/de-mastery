- id: FLK-10-q1
  type: single
  prompt: "How does a table declared with 'format'='debezium-json' map a Debezium update event (op=u) to Flink RowKinds?"
  options:
    A: "A single +I"
    B: "A -U for the before image, then a +U for the after image"
    C: "A -D then a +I"
    D: "Nothing. The format ignores updates"
  answer: [B]
  explanation: "The debezium-json format turns an update into a retract of the old row (-U) and an insert of the new row (+U). So downstream operators and sinks apply it correctly."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/connectors/table/formats/debezium/"

- id: FLK-10-q2
  type: single
  prompt: "Why must the target Iceberg table be format-version 2 with a PRIMARY KEY for a CDC upsert sink?"
  options:
    A: "v2 is faster for reads"
    B: "v2 supports row-level deletes (equality/position). The primary key tells Flink which row an update or delete targets. So Flink applies the changes and does not append them"
    C: "v1 cannot store strings"
    D: "It is only a style preference"
  answer: [B]
  explanation: "To apply -U/+U/-D, you need row-level deletes (Iceberg v2) with a primary key. v1 is append-only."
  source: "https://iceberg.apache.org/docs/latest/flink-writes/"

- id: FLK-10-q3
  type: single
  prompt: "When does the Iceberg sink of Flink make its changes visible in the table?"
  options:
    A: "After every record"
    B: "When a Flink checkpoint completes. It commits one Iceberg snapshot for each completed checkpoint"
    C: "Only when the job is cancelled"
    D: "On a fixed 10-minute timer"
  answer: [B]
  explanation: "The sink buffers writes. It commits an Iceberg snapshot when a checkpoint completes. This commit-on-checkpoint gives exactly-once. On recovery, the sink does not commit a snapshot twice and does not lose a snapshot."
  source: "https://iceberg.apache.org/docs/latest/flink-writes/"

- id: FLK-10-q4
  type: single
  prompt: "The source adds a new column 'region'. You run ALTER TABLE ... ADD (region STRING) on the Iceberg table. What happens to the rows that existed before the ALTER?"
  options:
    A: "They are rewritten with a default value"
    B: "They read back NULL for region. Schema evolution is metadata-only, and Iceberg does not rewrite any data"
    C: "They are deleted"
    D: "The ALTER fails because the table has data"
  answer: [B]
  explanation: "Iceberg schema evolution is a metadata operation. It does not change the existing data files. Old rows read NULL for the new column."
  source: "https://iceberg.apache.org/docs/latest/evolution/"

- id: FLK-10-q5
  type: single
  prompt: "After applying c(id=1), c(id=2), u(id=1), d(id=2) to an upsert Iceberg table, what is the final table state?"
  options:
    A: "Both id=1 and id=2 present"
    B: "Only id=1, with its updated values (id=2 was deleted)"
    C: "Empty"
    D: "Only id=2"
  answer: [B]
  explanation: "The upsert applies the changelog. id=1 gets its latest values and id=2 is deleted. The table shows the current source state."
  source: "https://iceberg.apache.org/docs/latest/flink-writes/"

- id: FLK-10-q6
  type: single
  prompt: "What is the correct way to feed a deterministic CDC changelog into Flink for testing, without Docker?"
  options:
    A: "A live Postgres with Debezium running in Docker"
    B: "A file (or Kafka topic on a native broker) of Debezium-JSON envelopes that the built-in debezium-json format reads"
    C: "A random data generator"
    D: "There is no way without Docker"
  answer: [B]
  explanation: "The debezium-json format reads Debezium envelopes from a file or Kafka topic with no containers. This gives a fully deterministic changelog that you can reconcile. The live Postgres→Debezium path is an optional lab layer."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/connectors/table/formats/debezium/"

- id: FLK-10-q7
  type: single
  prompt: "A Flink Iceberg CDC job crashes and recovers from its last checkpoint. Why does the job not commit rows twice to the table?"
  options:
    A: "The sink de-duplicates by scanning the whole table"
    B: "The sink commits idempotently for each checkpoint id. On recovery, it does not apply again a snapshot for a checkpoint that it already committed"
    C: "Iceberg forbids duplicate rows"
    D: "Flink disables checkpointing after a crash"
  answer: [B]
  explanation: "Commit-on-checkpoint plus an idempotent committer with the checkpoint id as key means that recovery replays only the work that is not committed. It does not duplicate snapshots that are already committed."
  source: "https://iceberg.apache.org/docs/latest/flink-writes/"

- id: FLK-10-q8
  type: multi
  prompt: "Which are good reasons to prefer a continuous Flink CDC → Iceberg job to a nightly batch MERGE? Select all that apply."
  options:
    A: "The target stays continuously current. It is not up to a day old"
    B: "Exactly-once commit-on-checkpoint gives a clean snapshot history"
    C: "It is always cheaper to operate than batch for tiny, rarely-changing tables"
    D: "It handles updates and deletes by primary key, and not only appends"
  answer: [A, B, D]
  explanation: "Continuous currency, exactly-once snapshots and key-based upserts favour streaming CDC. For tiny tables that rarely change, a periodic batch MERGE often costs less to operate, so C is false."
  source: "https://iceberg.apache.org/docs/latest/flink-writes/"
