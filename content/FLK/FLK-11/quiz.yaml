- id: FLK-11-q1
  type: single
  prompt: "What is backpressure in Flink?"
  options:
    A: "A crash caused by too much data"
    B: "Flow control: when an operator can't keep up, its buffers fill and the fullness propagates upstream, slowing the source to the rate of the slowest operator"
    C: "A way to drop late events"
    D: "A checkpoint failure"
  answer: [B]
  explanation: "Backpressure is Flink's built-in flow control; sustained backpressure points at the bottleneck operator."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/monitoring/back_pressure/"

- id: FLK-11-q2
  type: single
  prompt: "A heavy, NON-keyed map operator runs at parallelism 1 and backpressures the source while slots are free. What is the correct fix?"
  options:
    A: "Raise the map's parallelism and rebalance() records into it so the subtasks are evenly fed"
    B: "Add a keyBy on a constant"
    C: "Disable checkpointing"
    D: "Lower the source parallelism"
  answer: [A]
  explanation: "More subtasks plus a redistributing edge (rebalance) spreads the load evenly. keyBy on a constant would funnel everything to one subtask — the opposite of what you want."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/overview/"

- id: FLK-11-q3
  type: single
  prompt: "You raise a downstream operator's parallelism to 4 but leave the edge FORWARD. Why doesn't throughput improve?"
  options:
    A: "FORWARD is one-to-one at equal parallelism; it cannot feed 4 subtasks from 1, so work isn't redistributed"
    B: "FORWARD drops records"
    C: "Parallelism 4 is invalid"
    D: "It does improve"
  answer: [A]
  explanation: "FORWARD requires equal up/down parallelism and does no redistribution; to feed more subtasks you need a redistributing strategy (REBALANCE/RESCALE/HASH)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/overview/"

- id: FLK-11-q4
  type: single
  prompt: "When does raising parallelism NOT fix a bottleneck?"
  options:
    A: "When the bottleneck is a hot key under keyBy (skew) — that key still goes to one subtask"
    B: "Never; parallelism always helps"
    C: "Only on bounded sources"
    D: "Only when checkpointing is on"
  answer: [A]
  explanation: "keyBy routes a key to one subtask regardless of parallelism, so a hot key stays a bottleneck. The fix is changing the key (salting), not more subtasks."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/overview/"

- id: FLK-11-q5
  type: single
  prompt: "Which ship strategy gives round-robin, perfectly-even distribution to all downstream subtasks for a non-keyed operator?"
  options: {A: "FORWARD", B: "REBALANCE", C: "BROADCAST", D: "GLOBAL"}
  answer: [B]
  explanation: "REBALANCE round-robins records across all downstream subtasks, evening out a skew-free load."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/overview/"

- id: FLK-11-q6
  type: single
  prompt: "How can you prove a throughput fix from the job graph alone, without timing?"
  options:
    A: "You cannot; only wall-clock proves it"
    B: "The bottleneck operator's parallelism increased and the edge feeding it changed from FORWARD to a redistributing strategy (REBALANCE/RESCALE/HASH)"
    C: "The number of operators decreased"
    D: "The job name changed"
  answer: [B]
  explanation: "A real fix shows up structurally: higher parallelism on the bottleneck and a redistributing edge feeding it. That is deterministic and robust to machine load."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/execution/parallel/"

- id: FLK-11-q7
  type: single
  prompt: "Why is RESCALE sometimes preferred over REBALANCE?"
  options:
    A: "RESCALE drops duplicates"
    B: "RESCALE round-robins to a local subset of subtasks, so it avoids a full network shuffle when scaling by an integer factor"
    C: "RESCALE guarantees ordering"
    D: "They are identical"
  answer: [B]
  explanation: "RESCALE distributes to a subset of downstream subtasks (local where possible), cheaper than REBALANCE's all-to-all when the parallelism ratio is integral."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/operators/overview/"

- id: FLK-11-q8
  type: multi
  prompt: "Which are legitimate reasons raising parallelism may not help a backpressured job? Select all that apply."
  options:
    A: "The bottleneck is a hot key (skew), not under-parallelism"
    B: "A slow external sink is the real limit"
    C: "Higher parallelism multiplies state and checkpoint cost"
    D: "FORWARD always redistributes for you"
  answer: [A, B, C]
  explanation: "Skew, a slow sink, and state/checkpoint cost all limit the benefit of raw parallelism. FORWARD does NOT redistribute, so D is false."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/execution/parallel/"
