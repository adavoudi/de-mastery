<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="savepoint-upgrade-swimlane-t">
  <title id="savepoint-upgrade-swimlane-t">Upgrade cycle: old job stops with a savepoint, new jar restores state by operator UID</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}.dg-dot-ok{fill:#2c7a4b}.dg-dot-bad{fill:#b3372b}
  </style>
  <defs><marker id="savepoint-upgrade-swimlane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-box dg-dash" x="10" y="20" width="680" height="100" rx="8"/>
  <rect class="dg-box dg-dash" x="10" y="130" width="680" height="100" rx="8"/>
  <rect class="dg-box dg-dash" x="10" y="240" width="680" height="100" rx="8"/>
  <text class="dg-text dg-b" x="24" y="76">Old job (v1)</text>
  <text class="dg-text dg-b" x="24" y="186">Savepoint</text>
  <text class="dg-text dg-b" x="24" y="296">New job (v2)</text>

  <rect class="dg-accent" x="140" y="45" width="140" height="50" rx="10"/>
  <text class="dg-text dg-b" x="210" y="67" text-anchor="middle">v1 running</text>
  <text class="dg-muted" x="210" y="84" text-anchor="middle">count = 1,000,000</text>
  <path class="dg-line" d="M280 70H358" marker-end="url(#savepoint-upgrade-swimlane-arrow)"/>
  <text class="dg-muted dg-mono" x="319" y="60" text-anchor="middle">stop</text>
  <rect class="dg-bad" x="360" y="45" width="110" height="50" rx="10"/>
  <text class="dg-text dg-b" x="415" y="75" text-anchor="middle">v1 stopped</text>

  <path class="dg-line" d="M415 95V153" marker-end="url(#savepoint-upgrade-swimlane-arrow)"/>
  <text class="dg-muted" x="425" y="146">write state</text>
  <rect class="dg-ok" x="300" y="155" width="230" height="50" rx="10"/>
  <text class="dg-text dg-b dg-mono" x="415" y="176" text-anchor="middle">uid "counter"</text>
  <text class="dg-muted" x="415" y="194" text-anchor="middle">saved value = 1,000,000</text>

  <path class="dg-line" d="M480 205V263" marker-end="url(#savepoint-upgrade-swimlane-arrow)"/>
  <text class="dg-muted dg-mono" x="490" y="257">--fromSavepoint</text>
  <rect class="dg-ok" x="400" y="265" width="270" height="55" rx="10"/>
  <text class="dg-text dg-b" x="535" y="287" text-anchor="middle">v2 restores by same UID</text>
  <text class="dg-muted" x="535" y="306" text-anchor="middle">count = 1,000,000, keeps going</text>
</svg>
