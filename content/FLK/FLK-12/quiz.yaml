- id: FLK-12-q1
  type: single
  prompt: "What is the difference between a checkpoint and a savepoint in Flink?"
  options:
    A: "They are the same thing"
    B: "Checkpoints are automatic, system-owned snapshots for crash recovery. Savepoints are manual, user-owned snapshots for upgrades and migrations. Flink does not expire them automatically"
    C: "Savepoints are only for batch jobs"
    D: "Checkpoints cannot restore state"
  answer: [B]
  explanation: "Checkpoints are periodic and Flink owns them for fault tolerance. You trigger savepoints for planned upgrades and rescales. They persist until you delete them."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/state/savepoints/"

- id: FLK-12-q2
  type: single
  prompt: "A job keeps a counter in a transient instance field (transient long n) and not in ValueState. What happens after you restore the job from a savepoint?"
  options:
    A: "The count is restored correctly"
    B: "The count resets to zero. Instance fields are not part of the managed state of Flink and Flink does not snapshot them"
    C: "The job fails to start"
    D: "The field is restored but the ValueState is lost"
  answer: [B]
  explanation: "Flink snapshots only Flink-managed state (keyed/operator state). On restore, Flink initializes a plain field again, so the accumulated value is lost."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/state/"

- id: FLK-12-q3
  type: single
  prompt: "Why should you assign an explicit .uid() to stateful operators?"
  options:
    A: "To make the UI prettier"
    B: "A savepoint maps saved state to operators by UID. Without an explicit UID, Flink derives one from the graph position. This position changes when you edit the job and breaks the state restore"
    C: "It speeds up checkpoints"
    D: "It is required to compile"
  answer: [B]
  explanation: "Stable, explicit UIDs let an upgraded job find its state in the savepoint. Automatic UIDs change with the graph and can orphan state."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/production_ready/"

- id: FLK-12-q4
  type: single
  prompt: "What is the correct sequence of steps to upgrade a running stateful job to a new jar without losing state?"
  options:
    A: "Cancel the job, then start the new jar fresh"
    B: "Stop the job WITH a savepoint, then start the new jar --fromSavepoint <path>"
    C: "Hot-swap the jar in place"
    D: "Delete all checkpoints first, then redeploy"
  answer: [B]
  explanation: "stop-with-savepoint snapshots the state. When you start the new jar from that savepoint, Flink restores the state of each operator by UID."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/upgrading/"

- id: FLK-12-q5
  type: single
  prompt: "You remove a stateful operator from the job. The savepoint still contains its state. How do you start the new job?"
  options:
    A: "It is impossible"
    B: "Start with allowNonRestoredState, so Flink drops the orphaned state deliberately"
    C: "Rename all other operators"
    D: "Delete the savepoint"
  answer: [B]
  explanation: "allowNonRestoredState lets you discard on purpose the state that has no matching operator. Without it, unmatched state is an error."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/state/savepoints/"

- id: FLK-12-q6
  type: single
  prompt: "Why must the rescaling (change of parallelism) of a stateful job go through a savepoint and not a plain restart?"
  options:
    A: "Plain restarts are banned"
    B: "Rescaling redistributes key groups across subtasks. The savepoint carries the keyed state, so Flink can assign it again for the new parallelism"
    C: "Savepoints change the data"
    D: "Parallelism can never change"
  answer: [B]
  explanation: "Flink organizes keyed state in key groups. A savepoint lets Flink redistribute those groups to the new number of subtasks on restore."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/state/savepoints/"

- id: FLK-12-q7
  type: single
  prompt: "In production, which systems do the stop-with-savepoint and start-from-savepoint on each deploy?"
  options:
    A: "Only a human on the CLI"
    B: "The Flink Kubernetes Operator, AWS Managed Service for Apache Flink, or Confluent Cloud Flink"
    C: "The source database"
    D: "Kafka Connect"
  answer: [B]
  explanation: "Managed runtimes (K8s Operator, AWS MSF, Confluent Cloud Flink) automate the savepoint upgrade cycle. The local exercise teaches the same guarantee."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/ops/upgrading/"

- id: FLK-12-q8
  type: single
  prompt: "The read offset of a source must survive a savepoint, so the stream resumes where it stopped. Where should the offset live?"
  options:
    A: "A transient field"
    B: "Operator state (ListState via CheckpointedFunction). The job snapshots it and restores it on isRestored()"
    C: "A static variable"
    D: "A local file only"
  answer: [B]
  explanation: "The offset of a source for each subtask is operator state. Declare it as ListState through CheckpointedFunction. Snapshot it. Reload it when the context isRestored()."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/fault-tolerance/state/"
