<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="shuffle-skew-t">
  <title id="shuffle-skew-t">Shuffle: map partitions send rows to reduce partitions by hash(key) % 3, and the hot-key partition swells into the straggler</title>
