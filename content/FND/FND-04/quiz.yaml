- id: FND-04-q1
  type: single
  prompt: "A watermark of value W asserts what?"
  options:
    A: "The system believes it has seen all events with event time <= W"
    B: "The current wall-clock time is W"
    C: "Exactly W events have been processed"
    D: "All events will arrive before W"
  answer: [A]
  explanation: "A watermark is a completeness claim on event time: all events with event time <= W are assumed to have arrived."
  source: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"
- id: FND-04-q2
  type: single
  prompt: "A late event with a small timestamp arrives. What must a correct watermark do?"
  options:
    A: "Stay the same or move forward — never go backwards"
    B: "Decrease to the late event's timestamp"
    C: "Reset to zero"
    D: "Jump to wall-clock time"
  answer: [A]
  explanation: "Watermarks are monotonic non-decreasing; a late small-timestamp event must not pull the watermark back, or already-closed windows would re-open."
  source: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/event-time/generating_watermarks/"
- id: FND-04-q3
  type: single
  prompt: "Bounded-out-of-orderness watermark with allowedLateness=5s. The max event time seen is 100s. The current watermark is:"
  options:
    A: "95s"
    B: "100s"
    C: "105s"
    D: "wall-clock time"
  answer: [A]
  explanation: "W = maxEventTime - allowedLateness = 100 - 5 = 95. It lags the newest event by the grace period."
  source: "https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/datastream/event-time/generating_watermarks/"
- id: FND-04-q4
  type: single
  prompt: "An event with time t arrives beyond the watermark's grace period. The audit-safe handling is to:"
  options:
    A: "Route it to a side output / dead-letter and reconcile, not silently drop it"
    B: "Silently discard it"
    C: "Rewind the watermark"
    D: "Count it in the next unrelated window"
  answer: [A]
  explanation: "For auditable (e.g. SOX) totals, late events must be captured for reconciliation; silently dropping them breaks completeness."
  source: "https://nightlies.apache.org/flink/flink-docs-stable/docs/concepts/time/"
- id: FND-04-q5
  type: single
  prompt: "A dbt incremental model that reprocesses 'the last 3 days' is the batch equivalent of:"
  options:
    A: "allowedLateness = 3 days"
    B: "a watermark that never advances"
    C: "processing-time windows"
    D: "exactly-once delivery"
  answer: [A]
  explanation: "Reprocessing a trailing window is exactly a coarse watermark with a 3-day lateness grace; the day you stop restating a period is the watermark advancing past it."
  source: "https://research.google/pubs/pub43864/"
- id: FND-04-q6
  type: multi
  prompt: "Why not just set allowedLateness very large 'to be safe'? (select all)"
  options:
    A: "Every open window holds state, so large grace means large/unbounded state"
    B: "Results are delayed until the watermark passes the window end"
    C: "It makes the watermark move backwards"
    D: "It changes event time into processing time"
  answer: [A, B]
  explanation: "Large lateness inflates state and delays results. It does not reverse the watermark (still monotonic) nor change which clock you use."
  source: "https://www.oreilly.com/radar/the-world-beyond-batch-streaming-101/"
