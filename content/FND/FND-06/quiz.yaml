- id: FND-06-q1
  type: single
  prompt: "Why can a columnar format read far fewer bytes than a row format for an analytical query?"
  options:
    A: "It stores each column contiguously, so a query reads only the columns it references"
    B: "It compresses the whole file into one block"
    C: "It stores rows in sorted order always"
    D: "It avoids storing a schema"
  answer: [A]
  explanation: "A columnar layout lets the engine read only the bytes of the columns that the query references (and prune row groups). It does not read every field of every row."
  source: "https://parquet.apache.org/docs/file-format/"
- id: FND-06-q2
  type: single
  prompt: "For WHERE x > 900, which row groups can Parquet skip without reading data pages?"
  options:
    A: "Any row group whose stored max(x) <= 900"
    B: "Any row group whose min(x) > 900"
    C: "Only the first row group"
    D: "None — Parquet always reads all pages"
  answer: [A]
  explanation: "If max(x) <= 900 in a row group, no row in it can satisfy x > 900. So the engine prunes the group with the footer stats alone."
  source: "https://arrow.apache.org/docs/python/parquet.html"
- id: FND-06-q3
  type: single
  prompt: "Row-group pruning is most effective when the filtered column is:"
  options:
    A: "Sorted or clustered, so each group has a tight, non-overlapping [min,max]"
    B: "Randomly ordered"
    C: "A complex nested type with no stats"
    D: "The highest-cardinality column, unsorted"
  answer: [A]
  explanation: "Sorting or clustering makes the range of each group tight and disjoint, so a predicate overlaps few groups. Random order makes the range of every group span the domain. Then nothing is pruned."
  source: "https://iceberg.apache.org/spec/"
- id: FND-06-q4
  type: single
  prompt: "Athena charges by bytes scanned. The biggest single cost lever is usually:"
  options:
    A: "Store Parquet and SELECT only needed columns (column pruning)"
    B: "Increase the Athena workgroup memory"
    C: "Use SELECT * on JSON"
    D: "Disable compression"
  answer: [A]
  explanation: "Columnar storage plus projection of only the needed columns cuts the scanned bytes the most. Partitioning and sort order add row-group and file pruning on top."
  source: "https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html"
- id: FND-06-q5
  type: single
  prompt: "Which format is the better fit for streaming writes of one record at a time (for example Kafka)?"
  options:
    A: "Avro (a compact row format)"
    B: "Parquet"
    C: "ORC"
    D: "CSV with no schema"
  answer: [A]
  explanation: "Avro is a row format with a schema. It suits writes of one record at a time. Columnar formats (Parquet/ORC) are for batched analytical scans."
  source: "https://parquet.apache.org/docs/file-format/"
- id: FND-06-q6
  type: multi
  prompt: "What do the footer statistics of a Parquet column chunk typically include? (select all)"
  options:
    A: "min"
    B: "max"
    C: "null_count"
    D: "The full list of row ids"
  answer: [A, B, C]
  explanation: "The stats of each column chunk include min, max, and null_count (and often distinct_count). They do not store a full row-id list."
  source: "https://parquet.apache.org/docs/file-format/"
- id: FND-06-q7
  type: single
  prompt: "How does Iceberg prune whole files before opening them?"
  options:
    A: "It keeps min/max column metrics for each file in manifests. It skips files whose range cannot match the predicate"
    B: "It scans every file's footer at query time"
    C: "It stores all data in a single file"
    D: "It relies on the OS page cache"
  answer: [A]
  explanation: "Iceberg manifests carry column metrics (min/max/null counts) for each data file. So the planner prunes non-matching files before it reads them. Sort order makes those ranges tighter."
  source: "https://iceberg.apache.org/spec/"
