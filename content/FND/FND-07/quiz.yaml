- id: FND-07-q1
  type: single
  prompt: "A feed runs at 1 event/sec sustained. Roughly how many events per year?"
  options:
    A: "~31.5 million"
    B: "~86 thousand"
    C: "~3.15 billion"
    D: "~1 million"
  answer: [A]
  explanation: "1/sec x ~3.15e7 s/year ~ 31.5M/year (and ~86k/day). You should memorize these constants."
  source: "https://static.googleusercontent.com/media/research.google.com/en//people/jeff/stanford-295-talk.pdf"
- id: FND-07-q2
  type: single
  prompt: "2,000,000 events/sec at 100 bytes/event is what raw throughput?"
  options:
    A: "~200 MB/s"
    B: "~2 MB/s"
    C: "~20 GB/s"
    D: "~2 GB/s"
  answer: [A]
  explanation: "2e6 x 100 = 2e8 B/s = 200 MB/s."
  source: "https://static.googleusercontent.com/media/research.google.com/en//people/jeff/stanford-295-talk.pdf"
- id: FND-07-q3
  type: single
  prompt: "Which assumptions change a 'bytes stored per year' estimate the MOST, and so you must state them?"
  options:
    A: "Compression ratio and replication factor"
    B: "The programming language"
    C: "The color of the dashboard"
    D: "The number of engineers on the team"
  answer: [A]
  explanation: "Stored bytes = raw x (1/compression) x replication. Each of these two factors moves the number by 3-10x. So you must state them."
  source: "https://parquet.apache.org/docs/file-format/"
- id: FND-07-q4
  type: single
  prompt: "What drives the cost of an Athena-style query?"
  options:
    A: "TB scanned, which column and partition pruning reduce"
    B: "Number of columns in the table"
    C: "Rows returned to the client"
    D: "Query length in characters"
  answer: [A]
  explanation: "Serverless engines bill per TB scanned. Pruning (columns, partitions, row groups) directly lowers the bill. The number of rows returned is not the metric."
  source: "https://aws.amazon.com/athena/pricing/"
- id: FND-07-q5
  type: single
  prompt: "A feed stores Y bytes/year. For a 7-year SOX retention estimate, the storage cost is approximately:"
  options:
    A: "Y x 7 x ($/GB-month) x 12 (converting bytes to GB)"
    B: "Y x 7 x ($/TB-scanned)"
    C: "Y / 7"
    D: "Y x 7 (bytes equal dollars)"
  answer: [A]
  explanation: "Storage cost = GB stored x $/GB-month x months. Over 7 years, the number of months is 7x12. Scanned-TB pricing is for queries, not for storage."
  source: "https://aws.amazon.com/s3/pricing/"
- id: FND-07-q6
  type: single
  prompt: "What is the goal of a back-of-envelope estimate?"
  options:
    A: "The right order of magnitude with stated assumptions, fast"
    B: "A number accurate to within 1%"
    C: "To replace load testing permanently"
    D: "To avoid writing down any assumptions"
  answer: [A]
  explanation: "An estimate aims for the correct order of magnitude (~2x) with explicit assumptions that people can challenge. More precision is wasted, because the inputs are rough."
  source: "https://static.googleusercontent.com/media/research.google.com/en//people/jeff/stanford-295-talk.pdf"
- id: FND-07-q7
  type: multi
  prompt: "Why can RAW event bytes mislead a STORAGE estimate? (select all)"
  options:
    A: "Columnar compression typically shrinks stored size 3-10x"
    B: "Replication multiplies stored bytes (e.g. 3x)"
    C: "Raw bytes already include indexes and small-file overhead"
    D: "Raw bytes ignore the compression and replication factors"
  answer: [A, B, D]
  explanation: "Stored size differs from raw size because of compression (down) and replication or overhead (up). Raw bytes do NOT include indexes or overhead, so C is false."
  source: "https://parquet.apache.org/docs/file-format/"
