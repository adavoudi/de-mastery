<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="stream-lazy-pipeline-t">
  <title id="stream-lazy-pipeline-t">A lazy stream pipeline: elements only move once the terminal operation pulls them, one at a time through the whole chain</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}.dg-dot-bad{fill:#b3372b}
  </style>
  <defs><marker id="stream-lazy-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="dg-text dg-b" x="350" y="26" text-anchor="middle">Nothing runs until the terminal op pulls</text>
  <path class="dg-line dg-dash" d="M610 100V62H80V98" marker-end="url(#stream-lazy-pipeline-arrow)"/>
  <text class="dg-muted" x="345" y="54" text-anchor="middle">collect() asks for the next element, one at a time</text>

  <rect class="dg-box" x="20" y="100" width="120" height="75" rx="10"/>
  <text class="dg-text dg-b" x="80" y="124" text-anchor="middle">source</text>
  <rect class="dg-accent" x="200" y="100" width="120" height="75" rx="10"/>
  <text class="dg-text dg-b" x="260" y="124" text-anchor="middle">filter</text>
  <rect class="dg-accent" x="370" y="100" width="120" height="75" rx="10"/>
  <text class="dg-text dg-b" x="430" y="124" text-anchor="middle">map</text>
  <rect class="dg-warn" x="550" y="100" width="130" height="75" rx="10"/>
  <text class="dg-text dg-b" x="615" y="124" text-anchor="middle">collect</text>

  <path class="dg-line" d="M140 158H198" marker-end="url(#stream-lazy-pipeline-arrow)"/>
  <path class="dg-line" d="M320 158H368" marker-end="url(#stream-lazy-pipeline-arrow)"/>
  <path class="dg-line" d="M490 158H548" marker-end="url(#stream-lazy-pipeline-arrow)"/>

  <text class="dg-muted dg-mono" x="80" y="198" text-anchor="middle">stream()</text>
  <text class="dg-muted dg-mono" x="260" y="198" text-anchor="middle">filter(p)</text>
  <text class="dg-muted dg-mono" x="430" y="198" text-anchor="middle">map(f)</text>
  <text class="dg-muted dg-mono" x="615" y="198" text-anchor="middle">collect(...)</text>
  <text class="dg-muted" x="80" y="216" text-anchor="middle">lazy</text>
  <text class="dg-muted" x="260" y="216" text-anchor="middle">lazy: returns a Stream</text>
  <text class="dg-muted" x="430" y="216" text-anchor="middle">lazy: returns a Stream</text>
  <text class="dg-muted" x="615" y="216" text-anchor="middle">terminal: runs it</text>
  <text class="dg-muted" x="260" y="276" text-anchor="middle">fails the filter: dropped here</text>
  <text class="dg-muted" x="540" y="276" text-anchor="middle">passes every stage: reaches the result</text>

  <circle class="dg-dot" r="8" cx="80" cy="158" opacity="0">
    <animate attributeName="cx" values="80;80;260;430;615;615" keyTimes="0;0.28;0.45;0.62;0.8;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.28;0.8;0.85;1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot-bad" r="8" cx="80" cy="158" opacity="0">
    <animate attributeName="cx" values="80;80;260;260" keyTimes="0;0.5;0.66;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="158;158;158;245;245" keyTimes="0;0.5;0.66;0.8;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.8;0.85;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
