- id: JVM-02-q1
  type: single
  prompt: "Which stream pipeline computes SUM(amount) GROUP BY currency as a Map<String,Double>?"
  options:
    A: "orders.stream().map(Order::amount).sum()"
    B: "orders.stream().collect(Collectors.groupingBy(Order::currency, Collectors.summingDouble(Order::amount)))"
    C: "orders.stream().filter(Order::currency).collect(Collectors.toList())"
    D: "orders.stream().reduce(0.0, (a,b) -> a + b.amount())"
  answer: [B]
  explanation: >-
    groupingBy with a summingDouble downstream collector is the stream analogue of GROUP BY currency
    with SUM(amount). Option A does not group. Option D sums everything into one number. Option C is a type error.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Collectors.html"

- id: JVM-02-q2
  type: single
  prompt: "When does a stream pipeline actually execute its intermediate operations (filter, map)?"
  options:
    A: "Immediately as each intermediate op is called."
    B: "Only when a terminal operation (collect, count, reduce, forEach) runs. Intermediate ops are lazy."
    C: "On a background thread automatically."
    D: "Never. You must call .execute()."
  answer: [B]
  explanation: >-
    Intermediate operations are lazy and return a new stream. The pipeline runs only when you call a
    terminal operation. This is the same as Spark's transformation/action split and the laziness of
    a Python generator.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/package-summary.html"

- id: JVM-02-q3
  type: single
  prompt: "What is the difference between map and flatMap on a stream?"
  options:
    A: "No difference."
    B: "map transforms each element 1-to-1. flatMap maps each element to a stream and flattens the streams (1-to-many, like SQL UNNEST)."
    C: "flatMap filters out nulls. map does not."
    D: "map is lazy. flatMap is eager."
  answer: [B]
  explanation: >-
    map is a 1:1 projection. flatMap maps each element to a stream and joins the results. One element
    becomes zero or more elements. This is the UNNEST/explode operation.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Stream.html#flatMap(java.util.function.Function)"

- id: JVM-02-q4
  type: single
  prompt: "Which idiom accumulates a per-key count into a Map<String,Integer> (the defaultdict(int) pattern)?"
  options:
    A: "map.put(key, map.get(key) + 1) without a null check"
    B: "map.merge(key, 1, Integer::sum)"
    C: "map.add(key)"
    D: "map.getOrDefault(key, 0) with no write-back"
  answer: [B]
  explanation: >-
    merge(key, 1, Integer::sum) inserts 1 if the key is absent. Otherwise it applies the remapping
    function to the old and new values. Option A throws NullPointerException on the first
    occurrence. Option D never writes.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Map.html#merge(K,V,java.util.function.BiFunction)"

- id: JVM-02-q5
  type: single
  prompt: "You call List.of(\"a\",\"b\") then try list.add(\"c\"). What happens?"
  options:
    A: "The list becomes [a, b, c]."
    B: "It throws UnsupportedOperationException because List.of returns an immutable list."
    C: "It silently does nothing."
    D: "Compile error."
  answer: [B]
  explanation: >-
    List.of / Map.of / Set.of create immutable collections. If you change them, Java throws
    UnsupportedOperationException. Wrap them in new ArrayList<>(...) when you need to modify them.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/List.html#of()"

- id: JVM-02-q6
  type: single
  prompt: "Why can a non-associative reduce function give a wrong answer on a parallel stream?"
  options:
    A: "Parallel streams drop elements."
    B: "The stream splits the data and combines partial results in an unspecified order. A non-associative combiner then gives order-dependent, wrong results."
    C: "Parallel streams require a database."
    D: "reduce is not allowed on parallel streams."
  answer: [B]
  explanation: >-
    A parallel stream splits the input into partitions and merges the partial results. For a correct
    result, the combiner must be associative. The identity must also be a true identity. This is
    the same associativity rule as parallel aggregation in Spark/MapReduce.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Stream.html#reduce(T,java.util.function.BinaryOperator)"

- id: JVM-02-q7
  type: single
  prompt: "What does `orders.stream().max(Comparator.comparingDouble(Order::amount))` return?"
  options:
    A: "The max amount as a double."
    B: "An Optional<Order> that is empty if the stream has no elements, else the order with the greatest amount."
    C: "A sorted list of orders."
    D: "The first order."
  answer: [B]
  explanation: >-
    max returns Optional<Order> because the stream may be empty. The comparator orders by amount.
    Optional forces the caller to handle the empty case.
  source: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/stream/Stream.html#max(java.util.Comparator)"

- id: JVM-02-q8
  type: single
  prompt: "What is `Order::amount` as used in a stream?"
  options:
    A: "A field access that mutates the order."
    B: "A method reference, a short form of the lambda o -> o.amount()."
    C: "A static import."
    D: "A new Order instance."
  answer: [B]
  explanation: >-
    Order::amount is a method reference. It is equivalent to the lambda o -> o.amount(). You pass it
    where the code expects a functional interface (e.g. Function or ToDoubleFunction).
  source: "https://docs.oracle.com/javase/tutorial/java/javaOO/methodreferences.html"
