<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="jvm-heap-layout-t">
  <title id="jvm-heap-layout-t">JVM memory: heap generations, metaspace and off-heap</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}.dg-dot-ok{fill:#2c7a4b}.dg-dot-bad{fill:#b3372b}
  </style>
  <rect class="dg-box dg-dash" x="10" y="10" width="680" height="270" rx="12"/>
  <text class="dg-muted" x="24" y="30">JVM process memory (what the OS sees as RSS)</text>
  <rect class="dg-accent" x="24" y="44" width="420" height="196" rx="10"/>
  <text class="dg-text dg-b" x="38" y="66">Heap (GC-managed, -Xmx)</text>
  <rect class="dg-box" x="36" y="76" width="250" height="152" rx="8"/>
  <text class="dg-text" x="48" y="96">Young generation</text>
  <rect class="dg-warn" x="46" y="108" width="130" height="108" rx="6"/>
  <text class="dg-text dg-b" x="111" y="158" text-anchor="middle">Eden</text>
  <text class="dg-muted" x="111" y="178" text-anchor="middle">new objects</text>
  <rect class="dg-warn" x="184" y="108" width="46" height="108" rx="6"/>
  <text class="dg-text dg-b" x="207" y="166" text-anchor="middle">S0</text>
  <rect class="dg-warn" x="236" y="108" width="40" height="108" rx="6"/>
  <text class="dg-text dg-b" x="256" y="166" text-anchor="middle">S1</text>
  <rect class="dg-ok" x="300" y="76" width="132" height="152" rx="8"/>
  <text class="dg-text dg-b" x="366" y="140" text-anchor="middle">Old gen</text>
  <text class="dg-muted" x="366" y="160" text-anchor="middle">survivors promoted</text>
  <path class="dg-line" d="M276 190H298" marker-end="url(#jvm-heap-layout-arrow)"/>
  <defs><marker id="jvm-heap-layout-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-box" x="470" y="44" width="206" height="92" rx="10"/>
  <text class="dg-text dg-b" x="573" y="82" text-anchor="middle">Metaspace</text>
  <text class="dg-muted" x="573" y="102" text-anchor="middle">class metadata, off heap</text>
  <rect class="dg-bad" x="470" y="148" width="206" height="92" rx="10"/>
  <text class="dg-text dg-b" x="573" y="186" text-anchor="middle">Off-heap / direct</text>
  <text class="dg-muted" x="573" y="206" text-anchor="middle">Netty, Flink managed, Spark</text>
  <text class="dg-muted" x="24" y="264">Minor GC cleans Young; an off-heap leak will not show in heap-occupancy graphs.</text>
</svg>
