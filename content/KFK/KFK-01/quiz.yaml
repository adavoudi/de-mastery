- id: KFK-01-q1
  type: single
  prompt: "What is a Kafka topic partition, physically?"
  options:
    A: "A mutable table of the latest value per key."
    B: "An append-only, immutable, ordered log of records. Each record has an offset that always increases."
    C: "A queue where reading a message removes it."
    D: "A B-tree index over record keys."
  answer: [B]
  explanation: >-
    A partition is an append-only log. Offsets always increase and never change. Reading does not
    remove records. Compaction (keep the latest record per key) is an optional policy. It is not the
    base model.
  source: "https://kafka.apache.org/documentation/#intro_concepts_and_terms"

- id: KFK-01-q2
  type: single
  prompt: "A consumer must start at the first record on or after 09:00 today. It does not know the offset. What does it use?"
  options:
    A: "get_watermark_offsets to get the high offset and read backwards."
    B: "offsets_for_times, which returns the first offset whose timestamp is >= the requested time."
    C: "seek_to_beginning and filter in the application."
    D: "There is no way. You must store a timestamp->offset map yourself."
  answer: [B]
  explanation: >-
    offsets_for_times maps a timestamp to the first offset at or after it (for each partition).
    Then you seek to that offset and read forward. Reading from the beginning and filtering also
    works. But it rereads retained history that you do not need.
  source: "https://kafka.apache.org/documentation/#intro_consumers"

- id: KFK-01-q3
  type: single
  prompt: "Kafka guarantees the order of records:"
  options:
    A: "Across the whole topic, globally."
    B: "Within a single partition only (records with the same key go to the same partition)."
    C: "Only if there is exactly one consumer."
    D: "Never. Kafka makes no ordering guarantee."
  answer: [B]
  explanation: >-
    Kafka guarantees order within a partition. The default partitioner sends a given key to one
    partition, so per-key order is preserved. There is no cross-partition order, so there is no
    global order.
  source: "https://kafka.apache.org/documentation/#intro_concepts_and_terms"

- id: KFK-01-q4
  type: multi
  prompt: "Which statements about retention and compaction are correct? (choose all)"
  options:
    A: "retention.ms / retention.bytes delete the oldest segments after the limit is passed."
    B: "cleanup.policy=compact keeps only the latest record per key."
    C: "You can replay back to the earliest retained offset, which is not always offset 0."
    D: "Compaction removes records as soon as a consumer reads them."
  answer: [A, B, C]
  explanation: >-
    Time and size retention delete old segments. Compaction keeps the latest value per key. You can
    replay only back to the earliest retained offset. Reading never deletes records, so D is false.
  source: "https://kafka.apache.org/documentation/#compaction"

- id: KFK-01-q5
  type: single
  prompt: "You want the CURRENT state, the 'latest value per key', from a topic. Which is the Kafka-native way to think about it?"
  options:
    A: "Kafka cannot represent state. Copy everything to a database first."
    B: "State is a fold (left-reduce) over the log. A compacted topic materializes 'latest per key'."
    C: "Delete all records except the newest one, by hand, with an admin tool."
    D: "Set acks=all so that only the latest write survives."
  answer: [B]
  explanation: >-
    State is a projection of events. You fold the log to compute it. A compacted topic stores
    exactly the latest record per key. Changelogs and __consumer_offsets work this way. acks is a
    durability setting and is unrelated.
  source: "https://developer.confluent.io/courses/apache-kafka/topics/"

- id: KFK-01-q6
  type: single
  prompt: "Which workload is the WRONG fit for Kafka?"
  options:
    A: "Decoupling an OLTP system from several analytics consumers that may replay history."
    B: "A synchronous request/response API where the caller blocks and waits for an answer."
    C: "A durable event backbone that multiple teams subscribe to independently."
    D: "Buffering a high-throughput stream of data for later batch loads."
  answer: [B]
  explanation: >-
    Kafka decouples producers and consumers in time. Synchronous request/response is the opposite
    pattern. It belongs to a service call or RPC, not to a log.
  source: "https://developer.confluent.io/courses/apache-kafka/"
