- id: KFK-02-q1
  type: single
  prompt: "With acks=1, the producer receives an ack after:"
  options:
    A: "Every in-sync replica has written the record."
    B: "The partition leader has written the record to its log."
    C: "The record is in the producer's send buffer."
    D: "min.insync.replicas brokers have written the record."
  answer: [B]
  explanation: >-
    acks=1 means that the leader has persisted the record. Suppose the leader then crashes before
    any follower replicates the record. Then the record is lost, even though the producer got an
    ack.
  source: "https://kafka.apache.org/documentation/#producerconfigs_acks"

- id: KFK-02-q2
  type: single
  prompt: "A topic has RF=3 and min.insync.replicas=2. Two of the three brokers that hold a partition are down (ISR=1). A producer sends with acks=all. What happens?"
  options:
    A: "The write succeeds. One replica is enough."
    B: "The write is rejected with NOT_ENOUGH_REPLICAS."
    C: "The write succeeds but is marked uncommitted."
    D: "The producer blocks forever."
  answer: [B]
  explanation: >-
    With acks=all, the leader requires at least min.insync.replicas members in the ISR. ISR=1 is
    less than 2. So the leader refuses the write. It does not acknowledge a write that lives on only
    one broker.
  source: "https://kafka.apache.org/documentation/#topicconfigs_min.insync.replicas"

- id: KFK-02-q3
  type: single
  prompt: "Why is RF=3, acks=all, min.insync.replicas=2 the recommended durable configuration?"
  options:
    A: "It gives the lowest possible latency."
    B: "It tolerates one broker failure and still accepts writes. It refuses writes after a second failure, because the data would then be on a single broker."
    C: "It guarantees exactly-once delivery by itself."
    D: "It disables replication to save disk."
  answer: [B]
  explanation: >-
    One broker down means the ISR goes from 3 to 2, which is >= misr. Writes continue on >=2
    brokers. A second broker down means the ISR goes from 2 to 1, which is < misr. Kafka refuses
    writes. So you never ack a write that would survive on only one disk. EOS is a separate topic
    (KFK-05).
  source: "https://kafka.apache.org/documentation/#replication"

- id: KFK-02-q4
  type: single
  prompt: "What does unclean.leader.election.enable=true risk?"
  options:
    A: "Nothing. It only speeds up elections."
    B: "Electing a replica that was NOT in the ISR, which can silently lose acknowledged records."
    C: "Permanently disabling the partition."
    D: "Doubling the replication factor."
  answer: [B]
  explanation: >-
    Unclean election promotes an out-of-sync replica to restore availability when all in-sync
    replicas are gone. The cost is that you lose the records that only the dead in-sync replicas
    had. The default is off. Keep it off for completeness-critical data.
  source: "https://kafka.apache.org/documentation/#brokerconfigs_unclean.leader.election.enable"

- id: KFK-02-q5
  type: multi
  prompt: "Which statements about the ISR are correct? (choose all)"
  options:
    A: "The leader is always a member of its own ISR."
    B: "A follower that falls behind by more than replica.lag.time.max.ms drops out of the ISR. It rejoins when it catches up."
    C: "Under default (clean) election, Kafka elects a new leader from the ISR."
    D: "The ISR is fixed at topic creation and never changes."
  answer: [A, B, C]
  explanation: >-
    The ISR is dynamic. It shrinks when replicas lag or die. It grows when they catch up. The
    leader is always in the ISR. Clean election chooses from the ISR. The ISR is not fixed, so D is
    false.
  source: "https://kafka.apache.org/documentation/#replication"

- id: KFK-02-q6
  type: single
  prompt: "On a single-broker dev cluster, you set a topic to RF=1 and min.insync.replicas=2. You produce with acks=all. What is the result?"
  options:
    A: "Durable writes across restarts."
    B: "Every write is rejected. The ISR can be at most 1, which is < min.insync.replicas=2."
    C: "Writes succeed but are compacted."
    D: "The broker automatically increases the replication factor to 2."
  answer: [B]
  explanation: >-
    misr must be <= RF. With RF=1, the ISR is at most 1. This is below misr=2, so acks=all writes
    always fail. Set min.insync.replicas to match the replication factor (RF=3 -> misr=2).
  source: "https://kafka.apache.org/documentation/#topicconfigs_min.insync.replicas"

- id: KFK-02-q7
  type: single
  prompt: "In Kafka 4.x (KRaft), who performs leader election when a broker fails?"
  options:
    A: "ZooKeeper."
    B: "The KRaft controller quorum, using the replicated metadata log."
    C: "Each producer independently."
    D: "The consumer group coordinator."
  answer: [B]
  explanation: >-
    Kafka 4.x runs KRaft only. The controller quorum keeps cluster metadata (including leadership)
    in a replicated log. ZooKeeper is gone.
  source: "https://kafka.apache.org/documentation/#kraft"
