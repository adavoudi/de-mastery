- id: KFK-03-q1
  type: single
  prompt: "Which single setting makes a producer reject duplicates AND preserve per-partition order across retries?"
  options:
    A: "acks=1"
    B: "enable.idempotence=true"
    C: "compression.type=zstd"
    D: "linger.ms=100"
  answer: [B]
  explanation: >-
    The idempotent producer uses a producer id and per-partition sequence numbers. So the broker
    drops duplicates and out-of-order sequences. The setting also pins acks=all and limits in-flight
    requests.
  source: "https://kafka.apache.org/documentation/#producerconfigs_enable.idempotence"

- id: KFK-03-q2
  type: single
  prompt: "With enable.idempotence=true, what is the maximum value of max.in.flight.requests.per.connection that still preserves ordering under retries?"
  options:
    A: "1"
    B: "5"
    C: "100"
    D: "Unlimited"
  answer: [B]
  explanation: >-
    Idempotence preserves ordering only up to 5 in-flight requests for each connection. Above 5, a
    retried request can arrive in a different order than later successful requests.
  source: "https://kafka.apache.org/documentation/#producerconfigs_max.in.flight.requests.per.connection"

- id: KFK-03-q3
  type: multi
  prompt: "You tune a JSON event producer for THROUGHPUT. You must keep per-key order and have no duplicates. Which settings do you use? (choose all)"
  options:
    A: "A small positive linger.ms (for example 5-20 ms)."
    B: "A larger batch.size."
    C: "compression.type=lz4 or zstd."
    D: "enable.idempotence=true with a key per record."
  answer: [A, B, C, D]
  explanation: >-
    Larger, compressed batches (linger.ms, batch.size, and compression) raise throughput.
    Idempotence and a key for each record keep the order per key. They also prevent duplicates on
    retry. All four settings apply.
  source: "https://developer.confluent.io/courses/architecture/producer-hardware/"

- id: KFK-03-q4
  type: single
  prompt: "A producer has retries enabled, max.in.flight=6, and idempotence off. Sometimes it writes account events out of order within a partition. Why?"
  options:
    A: "Kafka never preserves order."
    B: "A retried request can be sent after a later request that already succeeded. This flips the order, and nothing removes duplicates or re-sequences the records."
    C: "The consumer is misconfigured."
    D: "Compression reorders records."
  answer: [B]
  explanation: >-
    Idempotence is off and there is more than 1 in-flight request. In this case, a retry can arrive
    after a later successful request. Idempotence (and in-flight <= 5) prevents this with sequence
    numbers.
  source: "https://kafka.apache.org/documentation/#semantics"

- id: KFK-03-q5
  type: single
  prompt: "What does the default partitioner do with a record that HAS a key?"
  options:
    A: "It sends the record to the partitions in turn (round-robin)."
    B: "It sends the record to a partition that it chooses by hashing the key. The same key always goes to the same partition."
    C: "It always sends the record to partition 0."
    D: "It chooses the partition with the fewest records."
  answer: [B]
  explanation: >-
    Keyed records are hash-partitioned. So one key always maps to one partition. This is the basis
    of per-key ordering. Records without a key use sticky batching across partitions for
    throughput.
  source: "https://kafka.apache.org/documentation/#producerconfigs"

- id: KFK-03-q6
  type: single
  prompt: "Which of these does enable.idempotence=true implicitly set?"
  options:
    A: "acks=0 and retries=0"
    B: "acks=all, bounded retries (via delivery.timeout.ms), and max.in.flight <= 5"
    C: "compression.type=gzip"
    D: "linger.ms=1000"
  answer: [B]
  explanation: >-
    Idempotence requires the safe defaults and sets them. These are acks=all, retries that are
    effectively infinite but bounded by the delivery timeout, and in-flight <= 5. Compression and
    linger are independent throughput settings that you choose.
  source: "https://kafka.apache.org/documentation/#producerconfigs_enable.idempotence"
