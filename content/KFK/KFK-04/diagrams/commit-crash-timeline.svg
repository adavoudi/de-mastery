<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="commit-crash-timeline-t">
  <title id="commit-crash-timeline-t">Timeline of poll, process, commit and a crash: commit before processing loses records, commit after processing duplicates them</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <text class="dg-text dg-b" x="20" y="48">Commit before processing (at-most-once)</text>
  <rect class="dg-box" x="150" y="60" width="110" height="44" rx="8"/>
  <text class="dg-text" x="205" y="87" text-anchor="middle">poll 5-8</text>
  <rect class="dg-accent" x="270" y="60" width="110" height="44" rx="8"/>
  <text class="dg-text" x="325" y="87" text-anchor="middle">commit: next 9</text>
  <rect class="dg-box" x="390" y="60" width="110" height="44" rx="8"/>
  <text class="dg-text" x="445" y="87" text-anchor="middle">process 5-8</text>
  <rect class="dg-bad" x="510" y="60" width="110" height="44" rx="8"/>
  <text class="dg-text" x="565" y="87" text-anchor="middle">crash</text>
  <path class="dg-line" d="M20 82H146"/>
  <rect class="dg-bad" x="20" y="118" width="680" height="32" rx="8"/>
  <text class="dg-text" x="360" y="139" text-anchor="middle">Restart reads committed offset 9: records 5-8 are never processed = LOST</text>
  <circle class="dg-dot" r="8" cx="30" cy="82">
    <animate attributeName="cx" values="30;205;325;445;565;565" keyTimes="0;0.15;0.4;0.65;0.8;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.15;0.4;0.65;0.8;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text class="dg-text dg-b" x="20" y="178">Commit after processing (at-least-once)</text>
  <rect class="dg-box" x="150" y="190" width="110" height="44" rx="8"/>
  <text class="dg-text" x="205" y="217" text-anchor="middle">poll 5-8</text>
  <rect class="dg-box" x="270" y="190" width="110" height="44" rx="8"/>
  <text class="dg-text" x="325" y="217" text-anchor="middle">process 5-8</text>
  <rect class="dg-bad" x="390" y="190" width="110" height="44" rx="8"/>
  <text class="dg-text" x="445" y="217" text-anchor="middle">crash</text>
  <rect class="dg-accent dg-dash" x="510" y="190" width="110" height="44" rx="8"/>
  <text class="dg-text" x="565" y="217" text-anchor="middle">commit: skipped</text>
  <path class="dg-line" d="M20 212H146"/>
  <rect class="dg-warn" x="20" y="248" width="680" height="32" rx="8"/>
  <text class="dg-text" x="360" y="269" text-anchor="middle">Restart reads committed offset 5: records 5-8 are processed again = DUPLICATED</text>
  <circle class="dg-dot" r="8" cx="30" cy="212">
    <animate attributeName="cx" values="30;205;325;445;565;565" keyTimes="0;0.15;0.4;0.65;0.8;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.15;0.4;0.65;0.8;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
