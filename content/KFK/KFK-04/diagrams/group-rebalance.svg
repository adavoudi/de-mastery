<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="group-rebalance-t">
  <title id="group-rebalance-t">Partitions assigned to consumers in a group, then rebalanced when consumer C2 crashes</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="group-rebalance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="dg-text dg-b" x="20" y="35">Before: 2 consumers</text>
  <text class="dg-text dg-b" x="380" y="35">After C2 crashes: rebalance</text>
  <rect class="dg-accent" x="20" y="70" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="55" y="90" text-anchor="middle">P0</text>
  <rect class="dg-accent" x="20" y="110" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="55" y="130" text-anchor="middle">P1</text>
  <rect class="dg-accent" x="20" y="150" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="55" y="170" text-anchor="middle">P2</text>
  <rect class="dg-accent" x="20" y="190" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="55" y="210" text-anchor="middle">P3</text>
  <rect class="dg-ok" x="230" y="80" width="100" height="60" rx="10"/><text class="dg-text dg-b" x="280" y="115" text-anchor="middle">C1</text>
  <rect class="dg-ok" x="230" y="150" width="100" height="60" rx="10"/><text class="dg-text dg-b" x="280" y="185" text-anchor="middle">C2</text>
  <path class="dg-line" d="M90 85L228 100" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M90 125L228 120" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M90 165L228 170" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M90 205L228 190" marker-end="url(#group-rebalance-arrow)"/>
  <rect class="dg-accent" x="380" y="70" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="415" y="90" text-anchor="middle">P0</text>
  <rect class="dg-accent" x="380" y="110" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="415" y="130" text-anchor="middle">P1</text>
  <rect class="dg-warn" x="380" y="150" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="415" y="170" text-anchor="middle">P2</text>
  <rect class="dg-warn" x="380" y="190" width="70" height="30" rx="6"/>
  <text class="dg-text dg-mono" x="415" y="210" text-anchor="middle">P3</text>
  <rect class="dg-ok" x="590" y="80" width="100" height="130" rx="10"/><text class="dg-text dg-b" x="640" y="150" text-anchor="middle">C1</text>
  <rect class="dg-bad dg-dash" x="590" y="222" width="100" height="36" rx="10"/><text class="dg-text dg-b" x="640" y="245" text-anchor="middle">C2 crashed</text>
  <path class="dg-line" d="M450 85L588 105" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M450 125L588 125" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M450 165L588 160" marker-end="url(#group-rebalance-arrow)"/>
  <path class="dg-line" d="M450 205L588 180" marker-end="url(#group-rebalance-arrow)"/>
  <text class="dg-muted" x="380" y="275">P2, P3 (amber) move to C1.</text>
  <text class="dg-muted" x="20" y="275">Each partition has exactly one reader.</text>
</svg>
