- id: KFK-04-q1
  type: single
  prompt: "You want at-least-once processing (no loss, possible duplicates). What do you do?"
  options:
    A: "Enable auto-commit with a short interval."
    B: "Disable auto-commit and commit the offset AFTER the processing work is durably done."
    C: "Commit the offset before you process each record."
    D: "Never commit. Rely on auto.offset.reset."
  answer: [B]
  explanation: >-
    When you commit after processing, the committed offset moves only past records that you
    handled. So a crash causes reprocessing (at-least-once). Committing before processing risks
    loss (at-most-once).
  source: "https://kafka.apache.org/documentation/#semantics"

- id: KFK-04-q2
  type: single
  prompt: "A consumer uses enable.auto.commit=true. It polls a batch. Auto-commit runs. Then the process crashes before it finishes the batch. After the restart, what happens to those records?"
  options:
    A: "They are reprocessed from the start of the batch."
    B: "They are skipped. The offset was already committed, so the group resumes after them (at-most-once)."
    C: "They are delivered to a dead-letter topic automatically."
    D: "They are delivered to every consumer in the group."
  answer: [B]
  explanation: >-
    Auto-commit moved the offset forward before the work finished. So the resuming consumer starts
    after the unprocessed records, and they are lost. This is the at-most-once trap of auto-commit.
  source: "https://kafka.apache.org/documentation/#consumerconfigs"

- id: KFK-04-q3
  type: single
  prompt: "How does Kafka divide work within a consumer group?"
  options:
    A: "Every consumer reads every partition."
    B: "At any time, each partition is assigned to exactly one consumer in the group."
    C: "The group leader reads everything and forwards it."
    D: "Kafka splits partitions by bytes across consumers."
  answer: [B]
  explanation: >-
    Within a group, one consumer owns each partition. When you add or remove consumers, a rebalance
    reassigns the partitions. This is how groups scale and fail over.
  source: "https://kafka.apache.org/documentation/#semantics"

- id: KFK-04-q4
  type: single
  prompt: "What does KIP-848 (the new consumer group protocol in Kafka 4.x) mainly change?"
  options:
    A: "It removes consumer groups entirely."
    B: "It moves assignment to the broker-side coordinator with incremental reconciliation. This reduces stop-the-world rebalances."
    C: "It makes every consumer read every partition."
    D: "It replaces offsets with timestamps."
  answer: [B]
  explanation: >-
    KIP-848 is a rebalance protocol that the broker drives, and it works incrementally. It shortens
    and reduces the disruptive pauses of the old client-driven protocol. The subscribe, poll, and
    commit API does not change.
  source: "https://cwiki.apache.org/confluence/display/KAFKA/KIP-848%3A+The+Next+Generation+of+the+Consumer+Rebalance+Protocol"

- id: KFK-04-q5
  type: single
  prompt: "How is consumer lag for a partition defined?"
  options:
    A: "The number of consumers in the group."
    B: "log-end-offset minus the committed offset of the group for that partition."
    C: "The time since the last poll."
    D: "The replication factor minus one."
  answer: [B]
  explanation: >-
    Lag measures how far behind a group is. It counts the records that are written but not yet
    committed as consumed. Rising lag means that the consumers cannot keep up. It is the key
    alerting metric.
  source: "https://kafka.apache.org/documentation/#consumerconfigs"

- id: KFK-04-q6
  type: single
  prompt: "At-least-once can produce duplicates. What is the standard way to make the end result correct anyway?"
  options:
    A: "Ignore duplicates. They are harmless."
    B: "Make the downstream write idempotent (for example, an upsert keyed by a business id), or use transactions for exactly-once."
    C: "Commit before processing to avoid them."
    D: "Reduce the replication factor."
  answer: [B]
  explanation: >-
    An idempotent sink (upsert by business key) absorbs the rare reprocessed duplicate. If no
    downstream dedup is possible, use transactional exactly-once (KFK-05).
  source: "https://kafka.apache.org/documentation/#semantics"

- id: KFK-04-q7
  type: single
  prompt: "How do share groups (KIP-932) differ from classic consumer groups?"
  options:
    A: "They guarantee exactly-once by default."
    B: "They allow multiple consumers to share the records of a partition, with per-record acknowledgement (queue-like). Classic groups use one partition for each consumer."
    C: "They remove the need for brokers."
    D: "They work only with transactions."
  answer: [B]
  explanation: >-
    Share groups add SQS-like queue semantics (shared consumption and per-record ack). They are
    early access in this Kafka line. Classic groups keep the rule of one partition for each
    consumer.
  source: "https://cwiki.apache.org/confluence/display/KAFKA/KIP-932%3A+Queues+for+Kafka"
