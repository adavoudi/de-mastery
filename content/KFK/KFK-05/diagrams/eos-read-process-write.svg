<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="eos-read-process-write-t">
  <title id="eos-read-process-write-t">Read-process-write transaction: consume, produce, send offsets, commit marker</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="eos-read-process-write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-box" x="20" y="125" width="140" height="70" rx="10"/>
  <text class="dg-text dg-b" x="90" y="165" text-anchor="middle">Input topic A</text>
  <rect class="dg-accent" x="290" y="125" width="140" height="70" rx="10"/>
  <text class="dg-text dg-b" x="360" y="155" text-anchor="middle">Producer</text>
  <text class="dg-muted dg-mono" x="360" y="175" text-anchor="middle">transactional.id</text>
  <rect class="dg-box" x="560" y="20" width="140" height="60" rx="10"/>
  <text class="dg-text dg-b" x="630" y="55" text-anchor="middle">Output topic B</text>
  <rect class="dg-ok" x="560" y="130" width="140" height="60" rx="10"/>
  <text class="dg-text dg-b" x="630" y="165" text-anchor="middle">Commit marker</text>
  <rect class="dg-box" x="560" y="240" width="140" height="60" rx="10"/>
  <text class="dg-text dg-b" x="630" y="275" text-anchor="middle">Offsets of A</text>
  <path class="dg-line" d="M160 160H288" marker-end="url(#eos-read-process-write-arrow)"/>
  <path class="dg-line" d="M430 145L558 65" marker-end="url(#eos-read-process-write-arrow)"/>
  <path class="dg-line" d="M430 175L558 265" marker-end="url(#eos-read-process-write-arrow)"/>
  <path class="dg-line" d="M430 160H558" marker-end="url(#eos-read-process-write-arrow)"/>
  <path class="dg-line dg-dash" d="M630 130V82" marker-end="url(#eos-read-process-write-arrow)"/>
  <path class="dg-line dg-dash" d="M630 190V238" marker-end="url(#eos-read-process-write-arrow)"/>
  <text class="dg-muted" x="225" y="148" text-anchor="middle">1 consume</text>
  <text class="dg-muted" x="460" y="92" text-anchor="middle">2 produce</text>
  <text class="dg-muted" x="440" y="250" text-anchor="middle">3 send offsets</text>
  <text class="dg-muted" x="494" y="152" text-anchor="middle">4 commit</text>
  <text class="dg-muted" x="620" y="108" text-anchor="end">opens B</text>
  <text class="dg-muted" x="620" y="218" text-anchor="end">commits A</text>
  <text class="dg-muted" x="360" y="320" text-anchor="middle">B's records and A's offsets become visible together, or not at all</text>
  <circle class="dg-dot" r="7" cx="160" cy="160" opacity="0">
    <animate attributeName="cx" values="160;160;288;288" keyTimes="0;0.02;0.2;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;160;160" keyTimes="0;0.02;0.2;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.2;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot" r="7" cx="430" cy="145" opacity="0">
    <animate attributeName="cx" values="430;430;552;552" keyTimes="0;0.22;0.4;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="145;145;68;68" keyTimes="0;0.22;0.4;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot" r="7" cx="430" cy="175" opacity="0">
    <animate attributeName="cx" values="430;430;552;552" keyTimes="0;0.42;0.6;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="175;175;262;262" keyTimes="0;0.42;0.6;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.42;0.6;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot-ok" r="7" cx="430" cy="160" opacity="0">
    <animate attributeName="cx" values="430;430;552;552" keyTimes="0;0.62;0.8;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;160;160;160" keyTimes="0;0.62;0.8;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.62;0.8;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
