<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="eos-zombie-fencing-t">
  <title id="eos-zombie-fencing-t">Zombie fencing: the broker rejects a producer with an older epoch</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="eos-zombie-fencing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-bad" x="20" y="30" width="170" height="70" rx="10"/>
  <text class="dg-text dg-b" x="105" y="62" text-anchor="middle">Old instance (zombie)</text>
  <text class="dg-muted" x="105" y="82" text-anchor="middle">epoch 4</text>
  <rect class="dg-ok" x="20" y="200" width="170" height="70" rx="10"/>
  <text class="dg-text dg-b" x="105" y="232" text-anchor="middle">New instance</text>
  <text class="dg-muted" x="105" y="252" text-anchor="middle">epoch 5</text>
  <rect class="dg-accent" x="290" y="115" width="150" height="70" rx="10"/>
  <text class="dg-text dg-b" x="365" y="145" text-anchor="middle">Coordinator</text>
  <text class="dg-muted dg-mono" x="365" y="165" text-anchor="middle">epoch 4 to 5</text>
  <rect class="dg-box" x="570" y="115" width="130" height="70" rx="10"/>
  <text class="dg-text dg-b" x="635" y="155" text-anchor="middle">Output topic B</text>
  <path class="dg-line" d="M190 235L288 177" marker-end="url(#eos-zombie-fencing-arrow)"/>
  <path class="dg-line dg-dash" d="M190 65L288 123" marker-end="url(#eos-zombie-fencing-arrow)"/>
  <path class="dg-line" d="M440 150H568" marker-end="url(#eos-zombie-fencing-arrow)"/>
  <text class="dg-muted dg-mono" x="200" y="262">1 init_transactions()</text>
  <text class="dg-muted" x="200" y="50">2 commit with epoch 4</text>
  <text class="dg-text dg-b" x="365" y="100" text-anchor="middle">ProducerFenced</text>
  <text class="dg-muted" x="505" y="138" text-anchor="middle">3 epoch 5 ok</text>
  <circle class="dg-dot-ok" r="7" cx="190" cy="235" opacity="0">
    <animate attributeName="cx" values="190;190;282;282" keyTimes="0;0.02;0.22;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="235;235;180;180" keyTimes="0;0.02;0.22;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.22;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot-bad" r="7" cx="190" cy="65" opacity="0">
    <animate attributeName="cx" values="190;190;282;282" keyTimes="0;0.3;0.45;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="65;65;122;122" keyTimes="0;0.3;0.45;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.45;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot-bad" r="7" cx="282" cy="122" opacity="0">
    <animate attributeName="cx" values="282;282;190;190" keyTimes="0;0.5;0.65;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="122;122;65;65" keyTimes="0;0.5;0.65;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.65;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle class="dg-dot-ok" r="7" cx="440" cy="150" opacity="0">
    <animate attributeName="cx" values="440;440;562;562" keyTimes="0;0.72;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;150;150;150" keyTimes="0;0.72;0.9;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.72;0.9;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
