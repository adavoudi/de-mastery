- id: KFK-08-q1
  type: single
  prompt: "What is the key semantic difference between a KStream and a KTable?"
  options:
    A: "A KStream is append-only events. A KTable is the latest value per key (a changelog)."
    B: "A KStream is stored on disk. A KTable is in memory only."
    C: "A KStream can be joined, but a KTable cannot."
    D: "A KTable is append-only. A KStream keeps only the latest value."
  answer: [A]
  explanation: "A KStream models an unbounded sequence of independent facts. Each record stands alone. A KTable models the current value per key. It reads the topic as a changelog, so a new record for an existing key replaces the old value."
  source: "https://kafka.apache.org/documentation/streams/concepts"

- id: KFK-08-q2
  type: single
  prompt: "In a KStream-KTable join, what triggers an output record?"
  options:
    A: "Only a change to the KTable"
    B: "An arriving KStream record (looked up against the current KTable value)"
    C: "Both sides must change at the same time"
    D: "A commit of the consumer offset"
  answer: [B]
  explanation: "The stream drives the join. Each incoming KStream record gets the current KTable value for its key. A KTable update alone produces no output. For this reason, orders (stream) enriched with customers (table) emit on each order."
  source: "https://kafka.apache.org/documentation/streams/developer-guide/dsl-api.html#kstream-ktable-join"

- id: KFK-08-q3
  type: single
  prompt: "What is required for a KStream-KTable join to work correctly?"
  options:
    A: "The two topics must have the same number of partitions and the same key (co-partitioning)"
    B: "The KTable must be a GlobalKTable"
    C: "Both topics must use the same compression codec"
    D: "The stream must be re-keyed to a random value"
  answer: [A]
  explanation: "KStream-KTable joins require co-partitioning. This means the same key and the same partition count, so matching keys land on the same partition and task. A GlobalKTable does not have this requirement, but it replicates the whole table to every instance."
  source: "https://kafka.apache.org/documentation/streams/developer-guide/dsl-api.html#joining"

- id: KFK-08-q4
  type: single
  prompt: "How does a Kafka Streams state store survive an application crash?"
  options:
    A: "A compacted changelog topic in Kafka backs it, and Kafka Streams rebuilds it on restart"
    B: "Kafka Streams flushes it to a relational database at every commit"
    C: "State is never persisted. The application recomputes it from scratch at each start."
    D: "RocksDB replicates to other instances synchronously"
  answer: [A]
  explanation: "A compacted changelog topic backs each state store. After a restart, Kafka Streams restores the local store by replaying the changelog. The same happens on another instance after a rebalance. This makes stateful operations fault-tolerant."
  source: "https://kafka.apache.org/documentation/streams/architecture"

- id: KFK-08-q5
  type: single
  prompt: "Why is TopologyTestDriver the preferred way to unit-test a Streams topology?"
  options:
    A: "It runs the topology in-process with no broker and no RocksDB, deterministically in event time"
    B: "It starts a real 3-broker cluster quickly"
    C: "It tests only serialization, not logic"
    D: "It requires Testcontainers and Docker"
  answer: [A]
  explanation: "TopologyTestDriver runs the full topology in-process, without a broker or RocksDB. You send inputs and read outputs with controlled event time. Tests are fast and deterministic. They need no sleeps and no cluster."
  source: "https://kafka.apache.org/documentation/streams/developer-guide/testing.html"

- id: KFK-08-q6
  type: single
  prompt: "When would you use a GlobalKTable instead of a KTable in a join?"
  options:
    A: "When the stream and table are NOT co-partitioned and you can afford to replicate the table to every instance"
    B: "When the table is extremely large and must be sharded"
    C: "When you need windowed aggregation"
    D: "When exactly-once is required"
  answer: [A]
  explanation: "Kafka Streams fully replicates a GlobalKTable to every instance. A KStream-GlobalKTable join can therefore look up by a key derived from the stream record, and it needs no co-partitioning. The tradeoff is the memory and replication cost. For this reason, it suits smaller reference tables."
  source: "https://kafka.apache.org/documentation/streams/developer-guide/dsl-api.html#kstream-globalktable-join"

- id: KFK-08-q7
  type: single
  prompt: "A windowed aggregation groups events into 1-minute tumbling windows. Which time should it use for correctness when records arrive in a different order?"
  options:
    A: "Event time (a timestamp carried by the record)"
    B: "Processing time (the wall clock when the record is handled)"
    C: "Ingestion time at the broker only"
    D: "The consumer's commit time"
  answer: [A]
  explanation: "Event-time windowing puts each record in a window by its own timestamp. Results are correct even when records arrive out of order or late. With processing time, the results depend on nondeterministic arrival timing."
  source: "https://kafka.apache.org/documentation/streams/core-concepts#streams_time"

- id: KFK-08-q8
  type: single
  prompt: "What does EOS v2 (exactly-once semantics) guarantee in a read-process-write Streams app?"
  options:
    A: "That consume, process, produce and state update commit atomically, so a failure does not double-count"
    B: "That messages are never delayed"
    C: "That each consumer gets its own partition"
    D: "That the changelog topic is disabled"
  answer: [A]
  explanation: "EOS v2 puts the input offset commit, the output produce, and the state-store changelog write in one transaction. When a failure occurs, the whole unit aborts and the application retries it. Each input then affects the output and state exactly once."
  source: "https://kafka.apache.org/documentation/streams/core-concepts#streams_processing_guarantee"
