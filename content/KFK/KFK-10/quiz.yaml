- id: KFK-10-q1
  type: single
  prompt: "How is the lag of a consumer group for a partition defined?"
  options:
    A: "The number of consumers currently in the group."
    B: "end_offset (log end offset / high watermark) minus the committed offset of the group for that partition."
    C: "The time since the last message was produced."
    D: "The in-memory position of the consumer minus the first offset in the log."
  answer: [B]
  explanation: >-
    Lag is the number of records that producers wrote and the group has not yet confirmed as processed.
    It equals end_offset - committed_offset. It uses the committed offset (what survives a crash), not
    the in-memory position.
  source: "https://kafka.apache.org/documentation/#basic_ops_consumer_lag"

- id: KFK-10-q2
  type: single
  prompt: "Why compute lag from the COMMITTED offset and not from the current in-memory position of the consumer?"
  options:
    A: "The in-memory position is always zero."
    B: "The committed offset is where a restarted or rebalanced member resumes, so it shows the durable progress of the group."
    C: "The committed offset is faster to read."
    D: "There is no difference. They are always equal."
  answer: [B]
  explanation: >-
    After a crash or rebalance, processing resumes from the last committed offset. Lag based on the
    committed offset therefore measures the real, durable backlog. The in-memory position can be ahead
    of the offset that the consumer safely committed.
  source: "https://kafka.apache.org/documentation/#consumerconfigs"

- id: KFK-10-q3
  type: single
  prompt: "A nightly batch producer feeds a topic. Every night lag spikes to 50,000 and then drains to 0 within an hour. What is the best alerting rule?"
  options:
    A: "Page whenever lag > 1,000."
    B: "Page when lag is high AND not decreasing over several intervals (stuck). Do not page on the instantaneous spike."
    C: "Never alert on lag for this topic."
    D: "Page on every produced record."
  answer: [B]
  explanation: >-
    A bursty producer makes instantaneous lag spikes normal. The real signal is lag that stays high
    and does not drain. This means the consumer is stuck or too slow. Alert on lag that does not drain,
    or on liveness.
  source: "https://kafka.apache.org/documentation/#basic_ops_consumer_lag"

- id: KFK-10-q4
  type: single
  prompt: "Which layer of the Kafka testing pyramid runs a Kafka Streams topology in-process with NO broker and NO RocksDB?"
  options:
    A: "A Testcontainers integration test."
    B: "TopologyTestDriver."
    C: "An end-to-end test against the production cluster."
    D: "A load test."
  answer: [B]
  explanation: >-
    TopologyTestDriver runs a Streams topology in-process with deterministic event time. It needs no
    external broker or state-store disk. It is the fast, deterministic layer for Streams logic.
  source: "https://kafka.apache.org/documentation/streams/developer-guide/testing.html"

- id: KFK-10-q5
  type: multi
  prompt: "Which of these should live in the FAST unit layer (plain data, no broker) and not in an integration test? (Select all that apply.)"
  options:
    A: "A function that computes lag from committed and end offsets."
    B: "An alert rule that maps lag to ok/warn/page."
    C: "Verifying that the app actually commits offsets to a real broker after processing."
    D: "A record transform / serializer."
  answer: [A, B, D]
  explanation: >-
    Pure logic (lag math, alert rules, transforms, serializers) belongs in the fast unit layer. To prove
    that the app really commits to a broker, you test the wiring. This needs a real (or embedded)
    broker. That is the slow integration layer, which you use sparingly.
  source: "https://kafka.apache.org/documentation/#monitoring"

- id: KFK-10-q6
  type: single
  prompt: "You want to read the committed offsets of a consumer group and the end offsets of the partitions WITHOUT joining the group. Which admin APIs do that?"
  options:
    A: "list_consumer_group_offsets for committed offsets, and list_offsets (latest spec) for end offsets."
    B: "subscribe() and poll() in a loop."
    C: "describe_topics only."
    D: "There is no way without joining the group."
  answer: [A]
  explanation: >-
    AdminClient.list_consumer_group_offsets returns the committed offsets for a group. AdminClient.list_offsets
    with the LATEST spec returns the end offset of each partition. Lag is the difference between them.
    You do not need group membership. kafka-consumer-groups.sh --describe does the same thing.
  source: "https://kafka.apache.org/documentation/#basic_ops_consumer_lag"

- id: KFK-10-q7
  type: single
  prompt: "A consumer group shows a high rebalance rate and growing lag. Which configuration is the most likely cause?"
  options:
    A: "compression.type is set to zstd."
    B: "Processing a batch takes longer than max.poll.interval.ms, so the member is evicted and the group rebalances repeatedly."
    C: "acks=all on the producer."
    D: "The topic has too few partitions."
  answer: [B]
  explanation: >-
    Suppose the processing in a poll loop takes longer than max.poll.interval.ms. Then the broker
    considers the member dead and triggers a rebalance. The repeated rebalances prevent progress, and
    lag grows. To fix this, process faster, poll smaller batches, or raise the interval.
  source: "https://kafka.apache.org/documentation/#consumerconfigs"

- id: KFK-10-q8
  type: single
  prompt: "Why make the alert RULE itself a pure, tested function and not only wire it into a dashboard?"
  options:
    A: "Dashboards cannot display numbers."
    B: "So you can prove with unit tests that it fires exactly when it should and stays quiet otherwise. This is the same practice as the warn/error severity of a dbt test."
    C: "Pure functions use less memory on the broker."
    D: "It lets the broker evaluate the rule."
  answer: [B]
  explanation: >-
    You cannot trust an alert that you cannot test. A pure function lets you unit test the boundaries
    (just under vs just over the threshold, warn vs page). This is like asserting the severity of a dbt
    test.
  source: "https://kafka.apache.org/documentation/#monitoring"
