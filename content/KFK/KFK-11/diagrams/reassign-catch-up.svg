<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="reassign-catch-up-t">
  <title id="reassign-catch-up-t">Reassigning partition P0 from [0,1] to [0,2]: broker 2 copies the data, joins the ISR, then broker 1 is dropped</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="reassign-catch-up-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>

  <text class="dg-text dg-mono" x="30" y="52">P0: [0,1] to [0,2]</text>
  <rect class="dg-accent" x="270" y="30" width="160" height="70" rx="10"/>
  <text class="dg-text dg-b" x="350" y="62" text-anchor="middle">Broker 0</text>
  <text class="dg-muted" x="350" y="82" text-anchor="middle">leader, kept in place</text>

  <rect class="dg-box" x="60" y="170" width="200" height="90" rx="10"/>
  <rect class="dg-bad dg-dash" x="60" y="170" width="200" height="90" rx="10" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.75;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="dg-text dg-b" x="160" y="200" text-anchor="middle">Broker 1</text>
  <text class="dg-muted" x="160" y="226" text-anchor="middle">old follower, in ISR</text>

  <rect class="dg-box" x="440" y="170" width="200" height="90" rx="10"/>
  <rect class="dg-ok" x="440" y="170" width="200" height="90" rx="10" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="dg-text dg-b" x="540" y="196" text-anchor="middle">Broker 2 (new)</text>
  <rect class="dg-box" x="480" y="208" width="120" height="12" rx="3"/>
  <rect class="dg-dot" x="480" y="208" width="0" height="12" rx="3">
    <animate attributeName="width" values="0;0;120;120" keyTimes="0;0.2;0.5;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="dg-muted" x="540" y="246" text-anchor="middle">copies P0 from leader</text>

  <path class="dg-line" d="M300 100L202 168" marker-end="url(#reassign-catch-up-arrow)">
    <animate attributeName="opacity" values="1;1;0.25;0.25" keyTimes="0;0.7;0.75;1" dur="10s" repeatCount="indefinite"/>
  </path>
  <text class="dg-muted" x="236" y="124" text-anchor="end">replicates</text>
  <path class="dg-line dg-dash" d="M400 100L498 168" marker-end="url(#reassign-catch-up-arrow)"/>
  <text class="dg-muted" x="468" y="124">fetches</text>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.5;0.51;1" dur="10s" repeatCount="indefinite"/>
    <circle class="dg-dot" r="6" cx="400" cy="100">
      <animate attributeName="cx" values="400;498" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;168" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle class="dg-dot" r="6" cx="400" cy="100">
      <animate attributeName="cx" values="400;498" begin="0.6s" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;168" begin="0.6s" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect class="dg-accent" x="20" y="288" width="160" height="40" rx="8" opacity="1">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2;0.21;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect class="dg-accent" x="190" y="288" width="160" height="40" rx="8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.5;0.51;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect class="dg-ok" x="360" y="288" width="160" height="40" rx="8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.7;0.71;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect class="dg-bad" x="530" y="288" width="150" height="40" rx="8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7;0.71;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="dg-text" x="100" y="313" text-anchor="middle">1 add replica 2</text>
  <text class="dg-text" x="270" y="313" text-anchor="middle">2 copy data</text>
  <text class="dg-text" x="440" y="313" text-anchor="middle">3 caught up: joins ISR</text>
  <text class="dg-text" x="605" y="313" text-anchor="middle">4 drop broker 1</text>
</svg>
