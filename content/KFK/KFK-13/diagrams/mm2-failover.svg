<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="mm2-failover-t">
  <title id="mm2-failover-t">Active/passive failover with MirrorMaker 2: async mirroring, lag as RPO, offset translation, client cutover as RTO</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="mm2-failover-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-bad dg-dash" x="20" y="20" width="250" height="210" rx="10"/>
  <text class="dg-text dg-b" x="145" y="46" text-anchor="middle">Source cluster (us-east)</text>
  <text class="dg-muted" x="145" y="64" text-anchor="middle">region down</text>
  <rect class="dg-box" x="40" y="80" width="210" height="50" rx="8"/>
  <text class="dg-text dg-mono" x="145" y="110" text-anchor="middle">orders</text>
  <rect class="dg-box" x="40" y="150" width="210" height="50" rx="8"/>
  <text class="dg-text dg-mono" x="145" y="180" text-anchor="middle">group offset = 1000</text>

  <rect class="dg-accent" x="430" y="20" width="250" height="210" rx="10"/>
  <text class="dg-text dg-b" x="555" y="46" text-anchor="middle">Target cluster (us-west)</text>
  <text class="dg-muted" x="555" y="64" text-anchor="middle">warm standby, takes over</text>
  <rect class="dg-box" x="450" y="80" width="210" height="50" rx="8"/>
  <text class="dg-text dg-mono" x="555" y="110" text-anchor="middle">us-east.orders</text>
  <rect class="dg-box" x="450" y="150" width="210" height="50" rx="8"/>
  <text class="dg-text dg-mono" x="555" y="180" text-anchor="middle">checkpoint: 1000 → 940</text>

  <path class="dg-line" d="M250 105H448" marker-end="url(#mm2-failover-arrow)"/>
  <text class="dg-text dg-b" x="349" y="90" text-anchor="middle">MM2, async</text>
  <path class="dg-line dg-dash" d="M250 175H448" marker-end="url(#mm2-failover-arrow)"/>
  <text class="dg-muted" x="349" y="168" text-anchor="middle">offset sync</text>
  <text class="dg-muted" x="349" y="125" text-anchor="middle">lag = RPO</text>

  <rect class="dg-warn" x="20" y="260" width="660" height="100" rx="10"/>
  <text class="dg-text dg-b" x="40" y="286">Failover (cutover time = RTO)</text>
  <text class="dg-text" x="40" y="310">1. Repoint producers and consumers to us-west</text>
  <text class="dg-text" x="40" y="332">2. Translate offsets: group resumes at 940, not 1000 (reprocess, never skip)</text>
  <text class="dg-muted" x="40" y="352">Events not yet mirrored when us-east failed are lost: that is RPO, never 0 with async.</text>
</svg>
