id: KFK-14/01-broken-clusters
title: Six broken-cluster scenarios — diagnose and fix
entry: troubleshoot.py
lab: none
timeout_s: 150
hints:
  - "Each scenario is a diagnose_X + fix_X pair. The diagnose functions READ state (AdminClient metadata/configs, or a props/throttle dict) and return a small structured dict describing the problem. The fix functions apply the smallest change and the test re-checks health."
  - "Live ones: under_replicated -> a partition's ISR shorter than its replicas (fix: start the dead broker); min_isr -> topic min.insync.replicas higher than the number of in-sync replicas (fix: lower it via kafka-configs.sh --alter); retention -> retention.ms below the floor (fix: set it to the floor); lag -> committed behind end (fix: reset the group to the end so lag drains)."
  - "Pure ones (no broker): advertised_listeners -> the advertised host is 0.0.0.0 or not the reachable host (fix: rewrite it to reachable_host:port, keeping the protocol/port); throttle -> leader/follower replication throttled rate below the floor or set to -1/unset (fix: return a config raising it to at least the floor)."
