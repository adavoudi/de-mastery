- id: KFK-14-q1
  type: single
  prompt: "A broker crashes. Several partitions now show an ISR that is shorter than their replica list. What is this condition called, and what is the usual fix?"
  options:
    A: "Over-replication. Delete a replica."
    B: "Under-replicated partitions (URP). Bring the broker back (it syncs again) or reassign the replica to a live broker."
    C: "A rebalance. Restart all consumers."
    D: "Normal. Nothing to do."
  answer: [B]
  explanation: >-
    When a replica goes offline, the partition is under-replicated (ISR < replicas). When you restore
    the broker, the replica catches up and rejoins the ISR, and URP returns to 0. Or you can reassign
    the replica to a healthy broker.
  source: "https://kafka.apache.org/documentation/#monitoring"

- id: KFK-14-q2
  type: single
  prompt: "A topic has min.insync.replicas=3. Two of three brokers are down. What does a producer with acks=all get, and why?"
  options:
    A: "The write succeeds from the single leader."
    B: "NOT_ENOUGH_REPLICAS — the ISR (1) is below min.insync.replicas (3), so the broker rejects the write to protect durability."
    C: "The producer silently drops the record."
    D: "The broker automatically lowers min.insync.replicas."
  answer: [B]
  explanation: >-
    acks=all requires the write to reach all in-sync replicas, and min.insync.replicas sets the floor.
    When the ISR is below that floor, the broker refuses the write (NOT_ENOUGH_REPLICAS). It does not
    risk a commit with too little durability.
  source: "https://kafka.apache.org/documentation/#configuration"

- id: KFK-14-q3
  type: single
  prompt: "The lag of a consumer group rises and never drains. The group is simply at a wrong position. Which is the LEAST risky first fix?"
  options:
    A: "Delete the topic."
    B: "Reset the offsets of the group to the smallest point that unblocks it (not blindly to earliest)."
    C: "Set min.insync.replicas to 1."
    D: "Increase the replication factor."
  answer: [B]
  explanation: >-
    If the group is stuck at a bad position, reset its offsets to a sane point, so it can make
    progress. A blind reset to earliest can reprocess huge volumes. Pick the smallest point that
    unblocks it.
  source: "https://kafka.apache.org/documentation/#basic_ops_consumer_group"

- id: KFK-14-q4
  type: single
  prompt: "Consumers that fall behind suddenly find records missing. The retention.ms of the topic is 1000 (1 second). What happened, and what is the fix?"
  options:
    A: "A broker is down. Restart it."
    B: "Retention is far too low, so Kafka deletes segments almost immediately. Raise retention.ms to a sane value with kafka-configs.sh --alter."
    C: "The producer is too fast. Slow it down."
    D: "min.insync.replicas is wrong."
  answer: [B]
  explanation: >-
    retention.ms=1000 deletes data after one second. Any consumer that is not perfectly caught up loses
    records. The fix is to set retention.ms to a correct (much larger) value.
  source: "https://kafka.apache.org/documentation/#configuration"

- id: KFK-14-q5
  type: single
  prompt: "Clients can fetch metadata from a broker, but then they time out when they connect to the returned endpoint. Which misconfiguration fits?"
  options:
    A: "replication.factor too high."
    B: "advertised.listeners set to an address that clients cannot reach (e.g. an internal hostname or 0.0.0.0)."
    C: "num.partitions too low."
    D: "compression.type unsupported."
  answer: [B]
  explanation: >-
    The broker returns advertised.listeners to clients. If clients cannot reach that address, they get
    metadata but cannot connect. Set advertised.listeners to a host:port that clients can reach.
  source: "https://kafka.apache.org/documentation/#configuration"

- id: KFK-14-q6
  type: single
  prompt: "A partition reassignment has been 'in progress' for hours. The replication throttle rate is very low. What is going on?"
  options:
    A: "The reassignment is complete. Ignore it."
    B: "The low throttle starves the move of bandwidth. Raise or remove the throttle so the move can finish."
    C: "The topic was deleted."
    D: "The controller is down."
  answer: [B]
  explanation: >-
    A throttle that is too low limits the replication bandwidth that the move can use, so the move
    never catches up. Raise the throttle (or remove it). --verify also clears the throttle when the
    move completes.
  source: "https://kafka.apache.org/documentation/#rep-throttle"

- id: KFK-14-q7
  type: single
  prompt: "Why is lowering min.insync.replicas a last-resort fix for a min.insync violation and not the first move?"
  options:
    A: "It is irreversible."
    B: "It trades durability for availability, because the broker accepts writes with too little durability. Restoring the missing replicas is the safer fix."
    C: "It deletes data."
    D: "It only works on compacted topics."
  answer: [B]
  explanation: >-
    A lower floor lets writes through with fewer in-sync replicas. This weakens durability. Prefer to
    restore replicas. Lower min.insync.replicas only as a conscious availability decision, which is
    usually temporary.
  source: "https://kafka.apache.org/documentation/#configuration"

- id: KFK-14-q8
  type: single
  prompt: "How does an operator define a 'fix' in an incident?"
  options:
    A: "Any change that makes the error message disappear from the console."
    B: "A change after which you verify that the relevant health metric (URP, ISR, lag, retention, reachability, reassignment status) is back to healthy."
    C: "Restarting every broker."
    D: "Filing a ticket."
  answer: [B]
  explanation: >-
    A fix is only a fix if health is measurably restored. After the change, you verify the specific
    metric (URP=0, ISR >= min.insync, lag draining, retention >= floor, endpoint reachable,
    reassignment complete).
  source: "https://kafka.apache.org/documentation/#monitoring"
