- id: LKH-01-q1
  type: single
  prompt: >-
    What does the catalog (e.g. Glue) store for an Iceberg table, and what makes a commit atomic?
  options:
    A: "All data file paths; a commit rewrites that list."
    B: "A single pointer to the current metadata.json; a commit atomically swaps that pointer."
    C: "The Parquet files themselves; a commit appends rows to them."
    D: "The manifest list; a commit edits it in place."
  answer: [B]
  explanation: >-
    The catalog holds one atomic pointer per table — the path of the current metadata.json. A
    commit creates a new metadata.json (new snapshot) and atomically swaps the catalog pointer to
    it. Nothing is mutated in place.
  source: "https://iceberg.apache.org/spec/"

- id: LKH-01-q2
  type: single
  prompt: "Order the Iceberg metadata tree from root to leaf."
  options:
    A: "data file -> manifest -> manifest list -> metadata.json"
    B: "metadata.json -> manifest list -> manifest -> data file"
    C: "manifest list -> metadata.json -> data file -> manifest"
    D: "metadata.json -> manifest -> manifest list -> data file"
  answer: [B]
  explanation: >-
    metadata.json names the current snapshot, which points at one manifest list; the manifest list
    points at manifests; each manifest lists data (and delete) files. Two index levels exist so a
    planner can prune cheaply.
  source: "https://iceberg.apache.org/spec/#table-metadata"

- id: LKH-01-q3
  type: single
  prompt: "Where are the per-data-file column statistics (min/max, null counts, record count) stored?"
  options:
    A: "In the metadata.json."
    B: "In the manifest list only."
    C: "In the manifests."
    D: "Only inside the Parquet footers."
  answer: [C]
  explanation: >-
    Each manifest carries per-file stats (record_count, lower_bounds/upper_bounds, null_counts).
    The manifest list carries coarser per-manifest partition ranges. These enable file-level
    pruning during scan planning without opening the data files.
  source: "https://iceberg.apache.org/spec/#manifests"

- id: LKH-01-q4
  type: single
  prompt: >-
    A table has 3 data files (each 2 rows). A manifest exists per append. How many manifests does
    'number of data files = number of manifests' incorrectly assume?
  options:
    A: "Nothing wrong; they are always equal."
    B: "It conflates tree levels: one manifest can list many files, so the counts are unrelated in general."
    C: "There are always more manifests than data files."
    D: "Manifests never contain data files."
  answer: [B]
  explanation: >-
    One manifest lists many data files; after compaction a single manifest can reference thousands
    of files. Equating the two counts is a classic metadata-reading error.
  source: "https://iceberg.apache.org/spec/#manifests"

- id: LKH-01-q5
  type: single
  prompt: >-
    You filter 'WHERE country = \"US\"' on a table whose files are each single-country. Which
    pyiceberg call tells you exactly how many data files a correct engine would read?
  options:
    A: "len(table.snapshots())"
    B: "table.scan().to_arrow().num_rows"
    C: "len(list(table.scan(row_filter=EqualTo('country','US')).plan_files()))"
    D: "table.metadata_location"
  answer: [C]
  explanation: >-
    plan_files() returns one FileScanTask per data file that survives pruning for the given filter.
    Counting them is the measured answer to 'which files does this query read', using the manifests'
    per-file min/max.
  source: "https://py.iceberg.apache.org/api/#scanning"

- id: LKH-01-q6
  type: single
  prompt: "Why does each write create a new snapshot instead of modifying the current one?"
  options:
    A: "To waste storage."
    B: "Immutability enables atomic commits and time travel: old snapshots keep pointing at their own metadata, and only the catalog pointer flips."
    C: "Because Parquet files are editable in place."
    D: "To avoid writing statistics."
  answer: [B]
  explanation: >-
    Writes only add files and metadata; the current snapshot is never mutated. Old snapshots remain
    valid and readable (time travel), and switching the current snapshot is a single atomic pointer
    swap at the catalog.
  source: "https://iceberg.apache.org/spec/#snapshots"

- id: LKH-01-q7
  type: multi
  prompt: "Which statements about scan planning / pruning are TRUE? (select all)"
  options:
    A: "The manifest list lets a planner skip whole manifests by partition range."
    B: "Per-file min/max in a manifest let a planner skip individual data files."
    C: "Pruning may skip a file that actually contains a matching row (it is allowed to be unsound)."
    D: "If a file's min/max cannot exclude the predicate, the file is kept (scanned)."
  answer: [A, B, D]
  explanation: >-
    Pruning is sound: it may keep files that turn out not to match, but it must never drop a file
    that could match. The two index levels (manifest list, then manifests) give coarse-then-fine
    pruning. (C describes an unsound planner, which is a bug.)
  source: "https://iceberg.apache.org/spec/#scan-planning"
