- id: LKH-02-q1
  type: single
  prompt: "What does Iceberg's optimistic concurrency control assume, and how does a commit detect a conflict?"
  options:
    A: "It locks the table for the whole write, so no conflict is possible."
    B: "It assumes the base version will not change. Then it commits with a compare-and-swap that fails if the table moved off the base version."
    C: "It merges all concurrent writes automatically, and a failure is not possible."
    D: "It serializes writers with a queue in the catalog."
  answer: [B]
  explanation: >-
    OCC does the work optimistically against the snapshot that it read. Then it performs an atomic
    compare-and-swap of the catalog pointer. The swap succeeds only if the table is still at the
    base version. If another writer committed first, the swap fails with a conflict.
  source: "https://iceberg.apache.org/spec/#optimistic-concurrency"

- id: LKH-02-q2
  type: single
  prompt: >-
    Two writers both read balance=100. Each writer reads the row and then overwrites it with a new
    balance. The first writer commits 110. The second writer (still based on 100) commits 105. What
    happened?
  options:
    A: "Final balance is 115, the correct serial result."
    B: "A lost update: the +10 of the first writer is erased, and the final balance is 105."
    C: "The catalog rejects both writes."
    D: "The balances are summed to 215."
  answer: [B]
  explanation: >-
    The second writer based its change on a stale read (100). It overwrote the row and erased the
    +10 of the first writer. Refresh-and-reapply prevents exactly this lost update. The correct
    serial result is 100+10+5 = 115.
  source: "https://iceberg.apache.org/spec/#commit-conflict-resolution-and-retry"

- id: LKH-02-q3
  type: single
  prompt: "After a commit raises a conflict (CommitFailedException), what is the correct recovery?"
  options:
    A: "Catch the exception and ignore it."
    B: "Immediately resubmit the exact same precomputed metadata without reloading."
    C: "Refresh the table to the state of the winner, recompute the change on that fresh base, and retry the commit (bounded retries)."
    D: "Delete the table and start over."
  answer: [C]
  explanation: >-
    You must re-apply the failed operation on the NEW current version. Refresh gets the state of
    the winner. When you recompute on that state and retry, the result is equivalent to serial
    execution. If you ignore the error, or if you blind-retry stale metadata, you lose updates.
  source: "https://iceberg.apache.org/spec/#commit-conflict-resolution-and-retry"

- id: LKH-02-q4
  type: single
  prompt: "Which kind of operation can Iceberg most often re-apply automatically after a conflict, without you recomputing?"
  options:
    A: "A read-modify-write overwrite of a row based on a value you read."
    B: "A pure append of new files (it has no requirement on existing files)."
    C: "A delete of specific files that another writer already removed."
    D: "A schema change racing another schema change."
  answer: [B]
  explanation: >-
    Append operations have no requirement on existing files. So Iceberg can re-apply them onto the
    new base. Replace, delete and overwrite operations must validate that the files or rows that
    they depend on are still present. For this reason, read-modify-write conflicts need
    refresh-and-reapply.
  source: "https://iceberg.apache.org/spec/#commit-conflict-resolution-and-retry"

- id: LKH-02-q5
  type: single
  prompt: "Why is blindly catching CommitFailedException and continuing a dangerous anti-pattern?"
  options:
    A: "It makes the code slower."
    B: "It turns a loud, recoverable conflict into a silent lost write. The change of the writer is never applied, but nobody is told."
    C: "It always crashes the JVM."
    D: "It corrupts the Parquet files."
  answer: [B]
  explanation: >-
    When you swallow the conflict, the commit never happened. But the program continues as if it
    did. The change is silently lost. The exception must trigger refresh-and-reapply. Do not
    ignore it.
  source: "https://iceberg.apache.org/spec/#commit-conflict-resolution-and-retry"

- id: LKH-02-q6
  type: single
  prompt: "How does refresh-and-reapply guarantee no lost update across two conflicting read-modify-write operations?"
  options:
    A: "It does not. One update is always lost."
    B: "The retried operation recomputes its change on the committed (fresh) state. So the final result equals running the two operations serially."
    C: "It locks the table during the retry."
    D: "It sums both results."
  answer: [B]
  explanation: >-
    When the second operation recomputes on the fresh base, it sees the effect of the first
    operation. So the combination is equivalent to serial execution (serializability). The test
    asserts this invariant: concurrent-with-retry == serial oracle.
  source: "https://iceberg.apache.org/docs/latest/reliability/#concurrent-write-operations"

- id: LKH-02-q7
  type: single
  prompt: "When is Iceberg OCC a poor fit?"
  options:
    A: "Low-contention batch writes from a few pipelines."
    B: "High-contention, tiny, hot point-updates many times per second (an OLTP/KV workload)."
    C: "Appending hourly files."
    D: "A nightly compaction job."
  answer: [B]
  explanation: >-
    When many writers constantly contend on the same rows, optimism turns into a retry storm. That
    is an OLTP/KV-store workload. It is not a lakehouse table (the "when not to use it" case of
    the track).
  source: "https://iceberg.apache.org/docs/latest/reliability/#concurrent-write-operations"
