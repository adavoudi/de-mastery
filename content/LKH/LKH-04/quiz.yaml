- id: LKH-04-q1
  type: single
  prompt: "Why can't Iceberg update a row by editing the Parquet file in place?"
  options:
    A: "Parquet supports in-place edits. Iceberg just chooses not to."
    B: "Data files are immutable, so a change must either rewrite the file (CoW) or record a delete file (MoR)."
    C: "Because the catalog locks the file."
    D: "Because Parquet has no schema."
  answer: [B]
  explanation: >-
    Iceberg data files are immutable. Iceberg implements row-level change in one of two ways. It
    rewrites the affected files (copy-on-write). Or it writes a separate delete file that logically
    removes rows, and the engine merges it at read time (merge-on-read).
  source: "https://iceberg.apache.org/spec/#row-level-deletes"

- id: LKH-04-q2
  type: single
  prompt: "What is the core trade-off between copy-on-write and merge-on-read?"
  options:
    A: "CoW is cheaper to write. MoR is cheaper to write."
    B: "CoW makes writes expensive (rewrite files) but reads fast. MoR makes writes cheap (delete files) but reads pay to merge."
    C: "They are identical in cost."
    D: "MoR is always better."
  answer: [B]
  explanation: >-
    CoW rewrites whole files on change (write amplification). So reads see only clean data files.
    MoR writes a small delete file instead. So writes are cheap. But every read merges the deletes
    against the data until compaction folds them in.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/"

- id: LKH-04-q3
  type: single
  prompt: >-
    After DELETE FROM t WHERE id=2 on a merge-on-read v2 table, what do you expect in
    SELECT content, count(*) FROM t.files GROUP BY content?
  options:
    A: "Only content=0 rows."
    B: "content=0 (data) AND content=1 (position deletes): a delete file was added, no data rewrite."
    C: "Only content=2 rows."
    D: "The files table is empty."
  answer: [B]
  explanation: >-
    MoR records the delete as a position-delete file (content=1). It leaves the data files
    (content=0) untouched. CoW, in contrast, would rewrite the data file and show only content=0.
  source: "https://iceberg.apache.org/spec/#row-level-deletes"

- id: LKH-04-q4
  type: single
  prompt: "After the same DELETE on a copy-on-write table, how do you detect that the data file was rewritten?"
  options:
    A: "The files table shows a content=1 delete file."
    B: "No delete files appear (only content=0), and the set of data files changes (a new file without the deleted row replaces the old file)."
    C: "The snapshot count stays the same."
    D: "You cannot tell from metadata."
  answer: [B]
  explanation: >-
    CoW produces no delete files. It rewrites the affected data file. So the set of data files
    changes (a new file replaces the old file), and content stays 0 throughout. The tests assert
    this measurable property. They do not assert timing.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/"

- id: LKH-04-q5
  type: single
  prompt: "In SCD2, what happens to the previously-current row when a tracked attribute changes?"
  options:
    A: "It is deleted."
    B: "Its valid_to is set to the batch date and is_current is set to false. A NEW row with the new value is inserted as current."
    C: "Its attribute is overwritten in place."
    D: "Nothing. Only new keys are inserted."
  answer: [B]
  explanation: >-
    SCD2 versions history. Iceberg closes the old row (valid_to is set, is_current=false). Then it
    inserts a new open row (valid_to NULL, is_current=true). If you overwrite the row in place, you
    destroy history. History is the whole purpose of Type 2.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/"

- id: LKH-04-q6
  type: multi
  prompt: "Which of these are classic SCD2 bugs the tests must catch? (select all)"
  options:
    A: "Overwriting the attribute in place instead of versioning (history lost)."
    B: "Leaving valid_to open (NULL) on the superseded row (two current rows for one key)."
    C: "Off-by-one effective dates so the validity ranges of a key overlap or leave a gap."
    D: "Inserting a new version for a key whose attribute genuinely changed."
  answer: [A, B, C]
  explanation: >-
    A, B and C are real SCD2 defects. D is the correct behavior and not a bug. A changed attribute
    should produce a new current version.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/"

- id: LKH-04-q7
  type: single
  prompt: "Why check SCD2 output against a DuckDB oracle instead of a hand-written expected table?"
  options:
    A: "DuckDB is faster."
    B: "Two independent engines compute the same close/insert logic. When they agree, a wrong expected result is very unlikely (gate G6)."
    C: "Because Spark cannot compute SCD2."
    D: "To avoid writing any assertions."
  answer: [B]
  explanation: >-
    The oracle recomputes the SCD2 result independently in DuckDB over the same batches. When two
    engines agree, this guards against a wrong hand-written expectation. This is the G6 validity
    gate.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/"

- id: LKH-04-q8
  type: single
  prompt: "When is merge-on-read the wrong choice?"
  options:
    A: "For high-frequency CDC/upserts into large files."
    B: "For a dimension that you read often and write rarely, where the read-time merge cost and the delete-file build-up are not worth it."
    C: "When writes are the bottleneck."
    D: "When you have many tiny updates."
  answer: [B]
  explanation: >-
    MoR optimizes the write cost at the expense of the read cost. Copy-on-write is better for a
    dimension that you read constantly and write rarely. It keeps every read against clean data
    files.
  source: "https://iceberg.apache.org/docs/latest/configuration/"
