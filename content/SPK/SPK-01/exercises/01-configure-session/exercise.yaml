id: SPK-01/01-configure-session
title: Configure a local Spark session and read its runtime config
entry: solution.py
lab: none
timeout_s: 180
hints:
  - "spark.sparkContext.master is a string like 'local[2]'. The number inside the brackets is the executor-thread (core) count."
  - "Parse the N out of local[N]; handle local[*] by falling back to os.cpu_count(). Do NOT use defaultParallelism — it can be overridden and won't equal N."
  - "shuffle_partitions: spark.conf.get(...) returns a str, so wrap it in int(). peak_parallelism is just min(num_partitions, cores)."
