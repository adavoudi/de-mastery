id: SPK-03/01-clean-customers
title: Validate and deduplicate customers (MDM key)
entry: solution.py
lab: none
timeout_s: 240
hints:
  - "Drop rows whose email is NULL: F.col('email').isNotNull(). Remember NULL comparisons are three-valued, so you must test isNotNull explicitly."
  - "The business key is (company_id, customer_id). customer_id alone COLLIDES across companies (the acquired company reuses ids), so deduping on customer_id merges different people — an MDM bug."
  - "Use dropDuplicates(['company_id','customer_id']) and return exactly company_id, customer_id, email. Row/column order are not checked."
cert_objectives: [spark-assoc:3.1, spark-assoc:3.2]
