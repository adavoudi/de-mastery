<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 290" role="img" aria-labelledby="catalyst-pipeline-t">
  <title id="catalyst-pipeline-t">Catalyst turns a query into parsed, analyzed, optimized logical and physical plans, then picks one physical plan</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>

  <defs><marker id="catalyst-pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-box" x="20" y="20" width="150" height="60" rx="10"/>
  <text class="dg-text dg-b" x="95" y="46" text-anchor="middle">1 Parsed logical</text>
  <text class="dg-muted" x="95" y="66" text-anchor="middle">query as written</text>
  <text class="dg-text" x="95" y="108" text-anchor="middle" font-size="12">table and column</text>
  <text class="dg-text" x="95" y="128" text-anchor="middle" font-size="12">references unbound</text>
  <rect class="dg-box" x="202" y="20" width="150" height="60" rx="10"/>
  <text class="dg-text dg-b" x="277" y="46" text-anchor="middle">2 Analyzed logical</text>
  <text class="dg-muted" x="277" y="66" text-anchor="middle">references resolved</text>
  <text class="dg-text" x="277" y="108" text-anchor="middle" font-size="12">bound to the catalog</text>
  <text class="dg-text" x="277" y="128" text-anchor="middle" font-size="12">types checked</text>
  <rect class="dg-accent" x="384" y="20" width="150" height="60" rx="10"/>
  <text class="dg-text dg-b" x="459" y="46" text-anchor="middle">3 Optimized logical</text>
  <text class="dg-muted" x="459" y="66" text-anchor="middle">rule-based rewrites</text>
  <text class="dg-text" x="459" y="108" text-anchor="middle" font-size="12">predicate pushdown</text>
  <text class="dg-text" x="459" y="128" text-anchor="middle" font-size="12">column pruning</text>
  <text class="dg-text" x="459" y="148" text-anchor="middle" font-size="12">constant folding</text>
  <text class="dg-text" x="459" y="168" text-anchor="middle" font-size="12">filter reordering</text>
  <rect class="dg-accent" x="566" y="20" width="150" height="60" rx="10"/>
  <text class="dg-text dg-b" x="641" y="46" text-anchor="middle">4 Physical plan</text>
  <text class="dg-muted" x="641" y="66" text-anchor="middle">candidate plans</text>
  <text class="dg-text" x="641" y="108" text-anchor="middle" font-size="12">cost model scores</text>
  <text class="dg-text" x="641" y="128" text-anchor="middle" font-size="12">the candidates</text>
  <path class="dg-line" d="M170 50H200" marker-end="url(#catalyst-pipeline-arrow)"/>
  <path class="dg-line" d="M352 50H382" marker-end="url(#catalyst-pipeline-arrow)"/>
  <path class="dg-line" d="M534 50H564" marker-end="url(#catalyst-pipeline-arrow)"/>
  <path class="dg-line" d="M641 160V196" marker-end="url(#catalyst-pipeline-arrow)"/>
  <rect class="dg-ok" x="566" y="198" width="150" height="48" rx="10"/>
  <text class="dg-text dg-b" x="641" y="218" text-anchor="middle">Selected plan</text>
  <text class="dg-muted" x="641" y="236" text-anchor="middle">this is what runs</text>
  <text class="dg-muted" x="20" y="274">explain("extended") shows all four; explain("formatted") prints the physical plan with PushedFilters and ReadSchema</text>
</svg>
