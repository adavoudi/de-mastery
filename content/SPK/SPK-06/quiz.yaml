- id: SPK-06-q1
  type: single
  prompt: >-
    You join a 2 billion-row fact to a 500-row dimension on company_id. Which join strategy is
    ideal and why?
  options:
    A: "Sort-merge join — it always scales best."
    B: "Broadcast hash join — the tiny dimension is shipped to every executor, so the fact streams through with no shuffle."
    C: "Cross join then filter."
    D: "Shuffle hash join on the fact side only."
  answer: [B]
  explanation: >-
    Broadcasting the small side avoids shuffling the huge fact table; each executor hashes the
    dimension in memory and the fact streams through. This is the Spark analogue of Redshift
    DISTSTYLE ALL on a small dimension.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html"

- id: SPK-06-q2
  type: single
  prompt: "What is the cost signature of a SortMergeJoin on the physical plan?"
  options:
    A: "No Exchange; one broadcast."
    B: "Two Exchanges (one shuffle per side) plus sorts on the join key."
    C: "One Exchange only, no sort."
    D: "It never appears in the plan."
  answer: [B]
  explanation: >-
    Sort-merge shuffles both sides on the key (two Exchanges) and sorts each before merging. It is
    the default for two large tables and scales to any size, unlike a broadcast join.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html"

- id: SPK-06-q3
  type: single
  prompt: >-
    A developer wraps the 1-billion-row fact in F.broadcast() to 'speed up' the join. What happens?
  options:
    A: "It is the fastest possible join."
    B: "Spark tries to collect the huge table to the driver and broadcast it, risking a driver OOM and huge network cost."
    C: "Spark silently converts it to a sort-merge join with no downside."
    D: "The result is wrong."
  answer: [B]
  explanation: >-
    Broadcasting requires collecting the side to the driver and shipping it to every executor.
    Doing that with a large table OOMs the driver and floods the network. Broadcast only the small
    side.
  source: "https://spark.apache.org/docs/4.0.0/api/python/reference/pyspark.sql/api/pyspark.sql.functions.broadcast.html"

- id: SPK-06-q4
  type: single
  prompt: >-
    You need a left join of orders to payments, keeping every order even if it has no payment.
    Someone used an inner join. What is the bug?
  options:
    A: "No bug; inner and left are equivalent here."
    B: "Inner join drops orders that have no matching payment, so unpaid orders disappear from the result."
    C: "Left join is slower, so inner is correct."
    D: "Inner join duplicates rows."
  answer: [B]
  explanation: >-
    An inner join keeps only matching rows, dropping orders with no payment. A left join preserves
    all left rows and fills unmatched right columns with NULL. Choosing inner when you need left is
    a classic correctness bug.
  source: "https://spark.apache.org/docs/4.0.0/sql-ref-syntax-qry-select-join.html"

- id: SPK-06-q5
  type: single
  prompt: >-
    One company_id value owns 80% of the fact rows, so one join task runs far longer than the
    others. What is this and which fix does NOT change the result?
  options:
    A: "Spill; raise executor memory."
    B: "Data skew; broadcast the small side, or salt the hot key on both sides and aggregate back, or enable AQE skew-join handling."
    C: "A memory leak; restart the driver."
    D: "Skew; just use an inner join."
  answer: [B]
  explanation: >-
    A dominant key value creates a straggler partition (skew). Broadcasting the small side removes
    the shuffle; salting (applied symmetrically and reversed) spreads the hot key without changing
    results; AQE can split the skewed partition at runtime.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html"

- id: SPK-06-q6
  type: single
  prompt: "When is a broadcast VARIABLE (sc.broadcast) the right tool, as opposed to a broadcast JOIN?"
  options:
    A: "To shuffle two large tables."
    B: "To ship a read-only lookup object (dict/model) to every executor once, e.g. for use inside mapPartitions or a UDF."
    C: "To count bad rows."
    D: "To force a sort-merge join."
  answer: [B]
  explanation: >-
    A broadcast variable distributes a read-only value to executors once instead of serialising it
    into every task. A broadcast join uses the same mechanism for the small join side; the variable
    is the general-purpose primitive. Counting is what an accumulator does.
  source: "https://spark.apache.org/docs/4.0.0/rdd-programming-guide.html#shared-variables"

- id: SPK-06-q7
  type: single
  prompt: "Why should an accumulator not be used as business logic (e.g. to compute a final total that must be exact)?"
  options:
    A: "Accumulators are too slow."
    B: "In transformations that can be re-executed (speculation, retries), accumulator updates can be applied more than once, so the value is only reliable inside actions and is best treated as approximate monitoring."
    C: "Accumulators cannot hold integers."
    D: "They are write-only on the driver."
  answer: [B]
  explanation: >-
    Spark guarantees accumulator values only for updates inside actions; transformation retries can
    double-count. Use accumulators for monitoring/metrics, not for values that must be exact.
  source: "https://spark.apache.org/docs/4.0.0/rdd-programming-guide.html#accumulators"

- id: SPK-06-q8
  type: single
  prompt: >-
    In this multi-company dataset order_id is unique within a company but can repeat across
    companies. You join orders to order_items on order_id alone. What can go wrong?
  options:
    A: "Nothing; order_id is globally unique."
    B: "Line items can match the wrong company's order, inflating or misattributing rows — an intercompany double-count. Join on the full business key (company_id, order_id)."
    C: "The join becomes a broadcast join."
    D: "Spark raises an error."
  answer: [B]
  explanation: >-
    Joining on a partial key lets rows from different companies collide, the Spark equivalent of an
    intercompany double-count. Always join on the full business key when surrogate/natural keys can
    repeat across entities.
  source: "https://spark.apache.org/docs/4.0.0/sql-ref-syntax-qry-select-join.html"
