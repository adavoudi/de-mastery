- id: SPK-07-q1
  type: single
  prompt: "What is the key difference between repartition(n) and coalesce(n)?"
  options:
    A: "They are identical."
    B: "repartition(n) does a full shuffle to produce n balanced partitions (and can increase the count); coalesce(n) merges existing partitions with no shuffle and can only reduce the count."
    C: "coalesce always shuffles; repartition never does."
    D: "coalesce can only increase the partition count."
  answer: [B]
  explanation: >-
    repartition is a wide transformation (adds an Exchange) giving n balanced partitions and can
    grow or shrink. coalesce is narrow (no Exchange), only reduces, and may leave uneven partitions
    because it just concatenates existing ones.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html"
  objectives: [spark-assoc:1.5]

- id: SPK-07-q2
  type: single
  prompt: >-
    After a selective filter leaves a small result spread over 200 partitions, you want ~4 output
    files cheaply. Which is best?
  options:
    A: "repartition(4) — needs a full shuffle"
    B: "coalesce(4) — merges partitions with no shuffle"
    C: "coalesce(1) — always best"
    D: "partitionBy('customer_id')"
  answer: [B]
  explanation: >-
    coalesce(4) reduces the file count without a shuffle, which is the cheap way to merge files
    after a filter. repartition(4) would needlessly shuffle; coalesce(1) would funnel everything
    through one task.
  source: "https://spark.apache.org/docs/4.0.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.coalesce.html"
  objectives: [spark-assoc:1.5, spark-assoc:4.1]

- id: SPK-07-q3
  type: single
  prompt: "What determines the (approximate) number of output files a single write produces?"
  options:
    A: "The number of columns."
    B: "The number of in-memory partitions at write time, times the number of on-disk partition folders from partitionBy."
    C: "Always one file per row."
    D: "spark.sql.shuffle.partitions, always, regardless of the DataFrame."
  answer: [B]
  explanation: >-
    Each in-memory partition writes (up to) one file per on-disk partition folder. So controlling
    the partition count (repartition/coalesce) and partitionBy together controls the file count.
  source: "https://spark.apache.org/docs/4.0.0/sql-data-sources-load-save-functions.html"
  objectives: [spark-assoc:4.1]

- id: SPK-07-q4
  type: single
  prompt: "Why is partitionBy('customer_id') on a high-cardinality column usually a mistake?"
  options:
    A: "Spark forbids it."
    B: "It creates one directory per customer — potentially millions of tiny files/dirs, the worst form of the small-file problem."
    C: "It makes the data unqueryable."
    D: "It forces a broadcast join."
  answer: [B]
  explanation: >-
    partitionBy on a high-cardinality column explodes into a huge number of small directories and
    files, crushing listing and metadata performance. Partition on low-cardinality, frequently
    filtered columns (date, company).
  source: "https://spark.apache.org/docs/4.0.0/sql-data-sources-load-save-functions.html"
  objectives: [spark-assoc:4.1]

- id: SPK-07-q5
  type: single
  prompt: "How does bucketing let two tables join without a shuffle at read time?"
  options:
    A: "It caches both tables."
    B: "bucketBy pre-shuffles each table on the key into a fixed number of buckets at write time, so matching keys are already colocated when the tables are later joined on that key."
    C: "It broadcasts both tables."
    D: "It sorts the rows alphabetically."
  answer: [B]
  explanation: >-
    Bucketing writes each table already partitioned by hash of the key into the same number of
    buckets. A later join on the bucket key finds matching keys colocated, so no shuffle is needed —
    the analogue of a Redshift DISTKEY making joins local.
  source: "https://spark.apache.org/docs/4.0.0/sql-data-sources-load-save-functions.html#bucketing-sorting-and-partitioning"
  objectives: [spark-assoc:2.3, spark-assoc:4.1]

- id: SPK-07-q6
  type: single
  prompt: "Why is coalesce(1) on a very large DataFrame dangerous?"
  options:
    A: "It raises an error."
    B: "It forces all data through a single task/partition, removing parallelism and risking OOM/slowness; the file count should be derived from data size instead."
    C: "It shuffles twice."
    D: "It produces corrupted files."
  answer: [B]
  explanation: >-
    coalesce(1) means one output partition, so one task must process everything — no parallelism,
    high memory pressure. Target a file size and derive the partition count; don't hard-code 1 for
    big data.
  source: "https://spark.apache.org/docs/4.0.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.coalesce.html"
  objectives: [spark-assoc:4.1]

- id: SPK-07-q7
  type: single
  prompt: >-
    repartition(n) vs partitionBy(col) — what is the correct distinction?
  options:
    A: "They are the same operation."
    B: "repartition sets the in-memory task/partition layout during computation; partitionBy sets the on-disk directory layout of the written output. They meet at write time."
    C: "partitionBy shuffles in memory; repartition writes directories."
    D: "Both only affect reads."
  answer: [B]
  explanation: >-
    repartition/coalesce control how many in-memory partitions (tasks) exist; partitionBy controls
    the col=value/ directory structure on disk. Confusing them is a common error.
  source: "https://spark.apache.org/docs/4.0.0/sql-data-sources-load-save-functions.html"
  objectives: [spark-assoc:1.5, spark-assoc:2.3]
