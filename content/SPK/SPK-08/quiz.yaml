- id: SPK-08-q1
  type: single
  prompt: >-
    A job dies with `java.lang.OutOfMemoryError: Java heap space`. The stack trace points at a
    collect()/toPandas() call. Where did it OOM and what is the fix?
  options:
    A: "An executor OOMed. Add more executors."
    B: "The driver OOMed when it pulled the whole dataset to itself. Do not collect the full data. Reduce/aggregate first or write to storage."
    C: "The shuffle spilled. Raise shuffle.partitions."
    D: "Storage memory was full. Call unpersist."
  answer: [B]
  explanation: >-
    collect()/toPandas() moves all rows to the driver. On a large dataset, this causes an OOM on the
    DRIVER, not on an executor. The fix is to not collect the full result. Aggregate/limit first, or
    write to disk.
  source: "https://spark.apache.org/docs/4.0.0/tuning.html"

- id: SPK-08-q2
  type: single
  prompt: >-
    How do execution memory and storage memory relate in Spark's unified model?
  options:
    A: "They are fixed, separate pools that never interact."
    B: "They share a unified region and can borrow from each other. Spark may evict cached blocks to make room for execution, and the reverse is also true."
    C: "Storage memory is only on disk."
    D: "Execution memory is only for the driver."
  answer: [B]
  explanation: >-
    Spark's unified memory lets execution and storage borrow from a shared region. Under pressure,
    Spark can evict cached (storage) blocks for execution needs. Execution can also use free storage
    space.
  source: "https://spark.apache.org/docs/4.0.0/tuning.html"

- id: SPK-08-q3
  type: single
  prompt: "What does df.cache() do, and when is it worth it?"
  options:
    A: "It writes the DataFrame to disk immediately. It is always worth it."
    B: "It marks the DataFrame to be persisted (MEMORY_AND_DISK) on the next action. It is worth it only when you reuse the DataFrame across multiple actions."
    C: "It caches only the schema."
    D: "It forces a broadcast join."
  answer: [B]
  explanation: >-
    cache() is lazy and equals persist(MEMORY_AND_DISK). Spark stores the data on the first action.
    Caching pays off only when you reuse the DataFrame across 2 or more actions. If you cache a
    frame that you use once, it only wastes storage memory.
  source: "https://spark.apache.org/docs/4.0.0/rdd-programming-guide.html#rdd-persistence"

- id: SPK-08-q4
  type: multi
  prompt: "Which are genuine Adaptive Query Execution (AQE) optimizations that you can see in the final plan? (select all)"
  options:
    A: "Coalescing many small post-shuffle partitions into fewer partitions of the right size."
    B: "Runtime skew-join handling that splits an oversized shuffle partition."
    C: "Dynamically switching a sort-merge join to a broadcast join when a side turns out small."
    D: "Pushing filters into the Parquet scan."
  answer: [A, B, C]
  explanation: >-
    AQE coalesces shuffle partitions, handles skew joins, and can switch join strategies at runtime
    using real statistics. Predicate pushdown is a static Catalyst rewrite (SPK-05), not AQE.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html#adaptive-query-execution"

- id: SPK-08-q5
  type: single
  prompt: >-
    Why must you look at the FINAL executed plan (after an action) to see AQE's effects? Why is the
    plan from explain() before the run not enough?
  options:
    A: "explain() is broken with AQE."
    B: "AQE re-optimizes at runtime using actual shuffle statistics. Its changes (coalesced partitions, skew handling, join switch) appear only in the final plan, after the first stage runs."
    C: "AQE only affects reads."
    D: "The initial plan already shows AQE results."
  answer: [B]
  explanation: >-
    AQE adapts the plan after it observes real shuffle sizes. The plan before the run shows an
    AdaptiveSparkPlan placeholder. The coalescing/skew/join-switch effects appear only in the final
    plan (isFinalPlan=true) after execution.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html#adaptive-query-execution"

- id: SPK-08-q6
  type: single
  prompt: >-
    What do repeated log lines `Spilling in-memory map ... to disk` during an aggregation indicate?
  options:
    A: "A driver OOM."
    B: "Execution-memory pressure. The aggregation does not fit in memory and spills to disk (correct but slow). Fix it with more partitions/memory or a narrower aggregation."
    C: "Caching succeeded."
    D: "The job failed."
  answer: [B]
  explanation: >-
    Spill messages mean that execution memory was exceeded and Spark wrote intermediate data to disk.
    This is correct but slow. Relieve it with more shuffle partitions, more memory, or by reducing the
    footprint of the aggregation. Spill is not a failure.
  source: "https://spark.apache.org/docs/4.0.0/tuning.html"

- id: SPK-08-q7
  type: single
  prompt: "You cache a DataFrame, but you see no speedup and higher memory use. What likely happened?"
  options:
    A: "Caching always speeds things up. The measurement is wrong."
    B: "The DataFrame is used only once (no reuse). Caching only uses storage memory with no benefit, and it may force eviction/spill elsewhere."
    C: "cache() requires DISK_ONLY to work."
    D: "You must call collect() twice for cache to apply."
  answer: [B]
  explanation: >-
    Caching helps only when you reuse the DataFrame across multiple actions. A cache that you use once
    adds storage-memory pressure (possibly causing eviction/spill) and gives no benefit from reuse.
  source: "https://spark.apache.org/docs/4.0.0/api/python/reference/pyspark.sql/api/pyspark.sql.DataFrame.persist.html"

- id: SPK-08-q8
  type: single
  prompt: >-
    An executor OOMs during a shuffle. One task processed 50x more data than the others. Which fix
    targets the actual cause?
  options:
    A: "Collect less data to the driver."
    B: "This is skew. Salt the hot key (SPK-06), add partitions, or enable AQE skew-join handling so that Spark splits the oversized partition."
    C: "Cache the DataFrame."
    D: "Switch to DISK_ONLY storage."
  answer: [B]
  explanation: >-
    One task that is much larger than the rest means data skew. The fixes are to salt the hot key,
    increase the partitions, or use AQE skew-join handling (runtime partition split). Caching or
    changing the storage level does not fix skew.
  source: "https://spark.apache.org/docs/4.0.0/sql-performance-tuning.html#adaptive-query-execution"
