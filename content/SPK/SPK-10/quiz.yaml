- id: SPK-10-q1
  type: single
  prompt: "In the micro-batch model, when does Spark commit the new source offsets to the checkpoint?"
  options:
    A: "Before the micro-batch runs, so the offsets reserve the work."
    B: "After the sink write for that batch succeeds, so a crash either redoes the batch or starts cleanly."
    C: "Only when the query is stopped gracefully."
    D: "Never. Offsets live only in memory."
  answer: [B]
  explanation: >-
    Spark commits offsets durably after the write. A crash before the commit redoes the batch
    from the same offsets. A crash after the commit starts the next batch cleanly. This order is what
    makes recovery exactly-once with an idempotent/transactional sink.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#recovering-from-failures-with-checkpointing"

- id: SPK-10-q2
  type: single
  prompt: "You restart a streaming job, but you point it at a BRAND NEW checkpoint directory in each run. What happens?"
  options:
    A: "Nothing changes. Checkpoints are interchangeable."
    B: "The query has no memory of earlier progress, so it reprocesses from the start and duplicates data."
    C: "It resumes exactly where it stopped."
    D: "Spark refuses to start without the old directory."
  answer: [B]
  explanation: >-
    The checkpoint stores committed offsets. A fresh directory looks like a query that never ran, so
    the query ingests everything again. This is the most common cause of duplicates on restart. Reuse
    the same checkpoint.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#recovering-from-failures-with-checkpointing"

- id: SPK-10-q3
  type: single
  prompt: "Which output mode is valid for a streaming query that has NO aggregation (each input row -> one output row)?"
  options:
    A: "complete"
    B: "append"
    C: "complete or update only"
    D: "None. You cannot write non-aggregating streams."
  answer: [B]
  explanation: >-
    append emits each new result row once. It is the natural mode for a map-like (non-aggregating)
    stream. complete is valid only for aggregations (it rewrites the whole result in each batch).
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#output-modes"

- id: SPK-10-q4
  type: single
  prompt: "Why does Spark reject append output mode on a running (unwatermarked) streaming aggregation?"
  options:
    A: "append is deprecated."
    B: "Aggregate rows keep changing as new data arrives, so there is nothing 'final' to append until a watermark lets a group close."
    C: "Aggregations always require complete mode forever."
    D: "append works without an error but counts rows twice."
  answer: [B]
  explanation: >-
    Without a watermark, any group may still receive more input. So its result is never final and
    Spark cannot append it. The modes complete and update work. A watermark (SPK-11) lets windows
    finalize, and then append becomes valid.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#output-modes"

- id: SPK-10-q5
  type: single
  prompt: "What does trigger(availableNow=True) do?"
  options:
    A: "It runs forever at a fixed interval."
    B: "It processes all data that is available right now (in one or more batches), then stops. It is useful for deterministic/incremental-batch runs."
    C: "It processes exactly one row."
    D: "It disables checkpointing."
  answer: [B]
  explanation: >-
    availableNow processes everything that is currently available and then stops. It still honors the
    checkpoint. It is good for tests (no waiting for wall-clock time) and for incremental batch jobs.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#triggers"

- id: SPK-10-q6
  type: single
  prompt: >-
    A sink appends rows. It collects the micro-batch to the driver and inserts the rows, with no
    dedup and no transactional offset tracking. After a crash, Spark redoes a batch. What is the result?
  options:
    A: "Exactly-once. Spark protects every sink automatically."
    B: "At-most-once."
    C: "Duplicates, because the non-idempotent sink inserts the rows of the redone batch again."
    D: "Data loss only."
  answer: [C]
  explanation: >-
    Exactly-once needs the sink to be idempotent or transactional. A plain append on a redo
    writes twice. The file and Iceberg table sinks track committed batches to avoid this.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#recovering-from-failures-with-checkpointing"

- id: SPK-10-q7
  type: single
  prompt: "In what way is the dbt incremental-model 'high-water mark' most like Structured Streaming?"
  options:
    A: "Both need you to pick an updated_at column by hand, and the engine then forgets it."
    B: "Both track where processing stopped, so the next run handles only new data. Streaming stores source offsets in the checkpoint automatically."
    C: "Neither can recover from a failed run."
    D: "Both reprocess the full table in every run."
  answer: [B]
  explanation: >-
    The watermark of the incremental model and the committed offsets of the stream both answer 'what
    is new since last time'. Streaming manages the offsets for you in the checkpoint. It does not
    rely on a column predicate that you maintain.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#basic-concepts"
