- id: SPK-11-q1
  type: single
  prompt: "What does a watermark on an event-time column do?"
  options:
    A: "It speeds up the stream by skipping old data on read."
    B: "It sets a moving threshold below which late data is dropped. This bounds state and lets windows finalize."
    C: "It converts processing time to event time."
    D: "It guarantees that no data is ever dropped."
  answer: [B]
  explanation: >-
    The watermark trails the maximum observed event time by a fixed delay. When it passes the end of a
    window, the window finalizes (Spark can append its result) and Spark frees its state. Spark treats
    data older than the watermark as late and drops it. This is a trade-off between completeness and
    latency. It is not a guarantee of no loss.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#handling-late-data-and-watermarking"

- id: SPK-11-q2
  type: single
  prompt: "Why must windowed streaming aggregations use event time rather than processing time?"
  options:
    A: "Processing time is always wrong."
    B: "Only event time is stable under reordering, delay and replay, so the results are reproducible. Processing-time results depend on when the job ran."
    C: "Event time is faster to compute."
    D: "Spark cannot read processing time."
  answer: [B]
  explanation: >-
    Event time is a property of the data. The same events give the same windows, no matter when or
    how Spark processes them. Processing-time windows change with scheduling. This breaks
    reproducibility (and auditability).
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#window-operations-on-event-time"

- id: SPK-11-q3
  type: single
  prompt: "A windowed count is written in append output mode. What makes that legal?"
  options:
    A: "Append is always legal."
    B: "A watermark lets each window finalize exactly once, so there is a final row to append."
    C: "The memory sink makes a special exception for it."
    D: "It is not legal under any condition."
  answer: [B]
  explanation: >-
    Without a watermark, the groups of an aggregation never finalize, so Spark rejects append. With a
    watermark, a window becomes final when event time passes its end + delay. Spark appends that final
    row once.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#output-modes"

- id: SPK-11-q4
  type: single
  prompt: "What is the advantage of dropDuplicatesWithinWatermark over dropDuplicates(['id'])?"
  options:
    A: "It removes more duplicates, forever."
    B: "It bounds state. It remembers only the ids within the watermark horizon, instead of every id forever."
    C: "It does not need a key."
    D: "It is faster but less correct in all cases."
  answer: [B]
  explanation: >-
    Plain dropDuplicates keeps all seen keys without a time limit (unbounded state). The watermarked
    form forgets keys older than the horizon. This bounds the state. The cost is that it does not
    recognize a duplicate that arrives after the horizon. This is consistent with the watermark
    contract.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#streaming-deduplication"

- id: SPK-11-q5
  type: single
  prompt: "In a streaming SCD2 upsert via foreachBatch + MERGE INTO, how many open (valid_to IS NULL) rows should exist per natural key?"
  options:
    A: "Zero."
    B: "Exactly one."
    C: "One per micro-batch."
    D: "As many as there have been changes."
  answer: [B]
  explanation: >-
    SCD2 keeps exactly one current/open version per natural key. It closes earlier versions with a
    non-null valid_to. If you leave several rows open (you forget to close the old one), you have a
    classic SCD2 bug.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/#merge-into"

- id: SPK-11-q6
  type: single
  prompt: "Why is foreachBatch the right tool for a streaming MERGE INTO an Iceberg dimension?"
  options:
    A: "It is the only sink that supports append."
    B: "It gives you each micro-batch as a normal batch DataFrame, so you can run any batch SQL/DML such as MERGE INTO."
    C: "It disables checkpointing."
    D: "It guarantees millisecond latency."
  answer: [B]
  explanation: >-
    foreachBatch gives you the micro-batch as a batch DataFrame and a batch_id, so any batch
    operation (including Iceberg MERGE INTO) works. The streaming sinks cannot express a
    merge.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#foreachbatch"

- id: SPK-11-q7
  type: single
  prompt: "An SCD2 upsert overwrites the dimension row in place on each change. What have you actually built?"
  options:
    A: "A correct SCD2."
    B: "SCD1. You keep only the latest value and lose history. valid_from/valid_to have no meaning."
    C: "A watermarked dedup."
    D: "An append-only fact table."
  answer: [B]
  explanation: >-
    Overwriting in place is SCD type 1: no versioning, no history. SCD2 must close the old version
    and insert a new one, so that you can still query the earlier states.
  source: "https://iceberg.apache.org/docs/latest/spark-writes/#merge-into"

- id: SPK-11-q8
  type: single
  prompt: >-
    A 5-minute window [00:00, 00:05) uses a 10-minute watermark on event_ts. Which arriving event
    FINALIZES that window?
  options:
    A: "The first event with event_ts >= 00:05."
    B: "The first event with event_ts >= 00:15 (window end + 10-minute delay)."
    C: "Any event at processing time 00:05."
    D: "It never finalizes."
  answer: [B]
  explanation: >-
    The watermark trails the maximum event time by 10 minutes. So it passes the window end (00:05) only
    when Spark sees an event with event_ts >= 00:15. After that, Spark emits the window, and later
    events for it are late.
  source: "https://spark.apache.org/docs/4.0.0/structured-streaming-programming-guide.html#handling-late-data-and-watermarking"
