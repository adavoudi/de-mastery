<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" role="img" aria-labelledby="pk-merge-engines-t">
  <title id="pk-merge-engines-t">Two writers send rows with the same customer_id; deduplicate, partial-update and aggregation merge them differently</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}.dg-dot-ok{fill:#2c7a4b}.dg-dot-bad{fill:#b3372b}
  </style>
  <text class="dg-muted" x="20" y="22">Input rows, same key (arrival order: CRM, then billing)</text>
  <text class="dg-text dg-b dg-mono" x="215" y="46" text-anchor="middle">customer_id</text>
  <text class="dg-text dg-b dg-mono" x="320" y="46" text-anchor="middle">name</text>
  <text class="dg-text dg-b dg-mono" x="430" y="46" text-anchor="middle">email</text>
  <text class="dg-text dg-b dg-mono" x="560" y="46" text-anchor="middle">points</text>
  <rect class="dg-box" x="20" y="54" width="660" height="40" rx="8"/>
  <text class="dg-text dg-b" x="32" y="79">CRM</text>
  <text class="dg-text dg-mono" x="215" y="79" text-anchor="middle">c1</text>
  <text class="dg-text dg-mono" x="320" y="79" text-anchor="middle">Ana</text>
  <text class="dg-muted dg-mono" x="430" y="79" text-anchor="middle">NULL</text>
  <text class="dg-text dg-mono" x="560" y="79" text-anchor="middle">10</text>
  <rect class="dg-box" x="20" y="100" width="660" height="40" rx="8"/>
  <text class="dg-text dg-b" x="32" y="125">billing</text>
  <text class="dg-text dg-mono" x="215" y="125" text-anchor="middle">c1</text>
  <text class="dg-muted dg-mono" x="320" y="125" text-anchor="middle">NULL</text>
  <text class="dg-text dg-mono" x="430" y="125" text-anchor="middle">ana@x.com</text>
  <text class="dg-text dg-mono" x="560" y="125" text-anchor="middle">5</text>
  <path class="dg-line" d="M350 146V166" marker-end="url(#pk-merge-engines-arrow)"/>
  <defs><marker id="pk-merge-engines-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="dg-muted" x="365" y="161">merged by merge-engine</text>
  <rect class="dg-bad" x="20" y="176" width="660" height="40" rx="8"/>
  <text class="dg-text dg-b" x="32" y="201">deduplicate</text>
  <text class="dg-text dg-mono" x="215" y="201" text-anchor="middle">c1</text>
  <text class="dg-muted dg-mono" x="320" y="201" text-anchor="middle">NULL</text>
  <text class="dg-text dg-mono" x="430" y="201" text-anchor="middle">ana@x.com</text>
  <text class="dg-text dg-mono" x="560" y="201" text-anchor="middle">5</text>
  <text class="dg-muted" x="32" y="232">Last record wins wholesale: the CRM name is wiped out (data loss).</text>
  <rect class="dg-ok" x="20" y="244" width="660" height="40" rx="8"/>
  <text class="dg-text dg-b" x="32" y="269">partial-update</text>
  <text class="dg-text dg-mono" x="215" y="269" text-anchor="middle">c1</text>
  <text class="dg-text dg-mono" x="320" y="269" text-anchor="middle">Ana</text>
  <text class="dg-text dg-mono" x="430" y="269" text-anchor="middle">ana@x.com</text>
  <text class="dg-text dg-mono" x="560" y="269" text-anchor="middle">5</text>
  <text class="dg-muted" x="32" y="300">Latest non-null per column: one complete golden record.</text>
  <rect class="dg-accent" x="20" y="312" width="660" height="40" rx="8"/>
  <text class="dg-text dg-b" x="32" y="337">aggregation</text>
  <text class="dg-text dg-mono" x="215" y="337" text-anchor="middle">c1</text>
  <text class="dg-text dg-mono" x="320" y="337" text-anchor="middle">Ana</text>
  <text class="dg-text dg-mono" x="430" y="337" text-anchor="middle">ana@x.com</text>
  <text class="dg-text dg-mono" x="560" y="337" text-anchor="middle">15</text>
  <text class="dg-muted" x="32" y="368">Per-column function: points = sum(10, 5); other columns keep the latest non-null.</text>
</svg>
