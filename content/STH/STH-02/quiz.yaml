- id: STH-02-q1
  type: single
  prompt: "Apache Paimon adds a storage structure on top of the lake to support primary-key (upsertable) tables. What is this structure?"
  options:
    A: "A B-tree index per column"
    B: "An LSM tree (log-structured merge tree) with periodic compaction"
    C: "A write-ahead log only, with no compaction"
    D: "A bitmap index"
  answer: [B]
  explanation: "Paimon stores PK-table data in an LSM tree. This is a set of small sorted files that the system compacts from time to time, like the storage engine of a streaming database. This makes cheap in-place upserts and a streaming changelog possible on object storage."
  source: "https://paimon.apache.org/docs/master/concepts/overview/"

- id: STH-02-q2
  type: single
  prompt: "Three source systems each write a customer row keyed by customer_id. Each system fills only its own column (the rest are NULL). Which merge engine assembles the rows into one complete golden record?"
  options:
    A: "deduplicate"
    B: "partial-update"
    C: "first-row"
    D: "aggregation"
  answer: [B]
  explanation: "partial-update keeps the latest non-null value per column. So partial rows from different writers combine into one complete row. This is exactly an MDM golden record."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q3
  type: single
  prompt: "You build the golden record with the DEFAULT merge engine (deduplicate) and not with partial-update. What goes wrong?"
  options:
    A: "Nothing. deduplicate also merges per column"
    B: "The last write keeps only its own non-null column and overwrites the columns of the other systems with NULLs, so data is lost"
    C: "The table cannot be created"
    D: "Reads become non-deterministic"
  answer: [B]
  explanation: "deduplicate keeps the last whole record (last-writer-wins). Each source sends NULLs for the columns it does not own. So the final row loses the attributes of the other systems. This is a classic MDM data-loss bug."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q4
  type: single
  prompt: "Under partial-update, a later writer sends NULL for a column that an earlier writer already filled. What is the result for that column?"
  options:
    A: "The column is set back to NULL"
    B: "The earlier non-null value is kept (NULL does not overwrite)"
    C: "The whole row is deleted"
    D: "An error is raised"
  answer: [B]
  explanation: "partial-update keeps the latest NON-NULL value per column. So it ignores a later NULL for that column. To erase a value on a retract, you need sequence.field + partial-update.remove-record-on-delete. You must turn this behaviour on."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q5
  type: single
  prompt: "Why do you pin 'bucket'='1' on a small primary-key table in a test or reference setting?"
  options:
    A: "It makes writes faster at any scale"
    B: "It fixes the bucket count so the physical layout is deterministic and reproducible"
    C: "It enables the aggregation merge engine"
    D: "It is required for every Paimon table"
  answer: [B]
  explanation: "A fixed bucket count gives a deterministic, reproducible layout. This is important for small tables and tests. With dynamic bucketing, the layout (and the merge timing) is not reproducible from one run to the next."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q6
  type: single
  prompt: "Which declaration is REQUIRED for a Paimon primary-key (mergeable) table?"
  options:
    A: "PRIMARY KEY(...) NOT ENFORCED"
    B: "A secondary index on every column"
    C: "PARTITIONED BY on a timestamp"
    D: "format-version = 2"
  answer: [A]
  explanation: "You define a PK table with PRIMARY KEY(...) NOT ENFORCED. The merge engine merges rows that share that key. Partitioning and indexes are optional. format-version is an Iceberg concept."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q7
  type: multi
  prompt: "Which statements about Paimon merge engines are correct? (choose all)"
  options:
    A: "deduplicate keeps the last whole record for a key"
    B: "partial-update keeps the latest non-null value per column"
    C: "aggregation combines columns with per-column aggregate functions (for example sum)"
    D: "first-row keeps the LAST record and discards earlier ones"
  answer: [A, B, C]
  explanation: "deduplicate = last whole record. partial-update = latest non-null value per column. aggregation = per-column aggregates. first-row keeps the FIRST record for a key and ignores later ones, so D is false."
  source: "https://paimon.apache.org/docs/master/concepts/primary-key-table/merge-engine/"

- id: STH-02-q8
  type: single
  prompt: "When is a plain Iceberg/Delta table a BETTER choice than a Paimon partial-update PK table?"
  options:
    A: "When you assemble a golden record from partial source rows"
    B: "For immutable, append-only facts that you never update in place"
    C: "When you need a streaming changelog of per-key updates"
    D: "When you need last-writer-wins per column"
  answer: [B]
  explanation: "For immutable append-only facts, the LSM, PK merges and compaction give you no benefit. A plain columnar lake table is simpler and cheaper. The merge engines matter only when rows update in place."
  source: "https://paimon.apache.org/docs/master/concepts/overview/"
