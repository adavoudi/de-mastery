- id: STH-03-q1
  type: single
  prompt: "Apache Fluss is designed to fill a gap between Kafka and a lakehouse. What is this gap?"
  options:
    A: "It replaces object storage with a relational database"
    B: "It is a columnar, low-latency streaming store. Its recent data is hot (sub-second) and its history tiers to the lake, so it serves both latencies from one copy"
    C: "It is a faster batch scheduler"
    D: "It is a drop-in replacement for dbt"
  answer: [B]
  explanation: "A Kafka log is cheap and has low latency. But it is poor for keyed latest-value lookups or OLAP. A lakehouse is cheap OLAP, but with batch latency. Fluss stores recent data hot and tiers history to the lake as one logical table. It serves both latencies."
  source: "https://fluss.apache.org/docs/intro/"

- id: STH-03-q2
  type: single
  prompt: "What is the difference between a Fluss log table and a Fluss PK table?"
  options:
    A: "Log tables are columnar. PK tables are row-oriented"
    B: "A log table is append-only (read as a stream). A PK table is upsertable and serves the latest value per key"
    C: "PK tables cannot be tiered to the lake"
    D: "Log tables require a primary key"
  answer: [B]
  explanation: "A log table is append-only, like a columnar Kafka topic. A PK table (PRIMARY KEY NOT ENFORCED) is upsertable. It serves the latest value per key. You can read it as a changelog or as a point-in-time snapshot."
  source: "https://fluss.apache.org/docs/intro/"

- id: STH-03-q3
  type: single
  prompt: "Which table property turns on lake tiering for a Fluss table?"
  options:
    A: "'merge-engine'='partial-update'"
    B: "'table.datalake.enabled'='true'"
    C: "'format-version'='2'"
    D: "'changelog-producer'='input'"
  answer: [B]
  explanation: "You opt in to lake tiering for each table with 'table.datalake.enabled'='true'. Then a Flink tiering service continuously moves committed data from the hot store of Fluss into the configured lake format."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q4
  type: single
  prompt: "Tiering is enabled. How do you read ONLY the data that has landed in the lake tier (readable in batch, even from pure Python)?"
  options:
    A: "Read the table name directly"
    B: "Read the `table$lake` system table"
    C: "Read `table$audit_log`"
    D: "You cannot read the lake tier separately"
  answer: [B]
  explanation: "If you read the table name, you get the real-time view (hot + tiered). If you read the `table$lake` system table, you get only the tiered Paimon data. You can read it in batch with Flink, or with pypaimon and no Flink at all."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q5
  type: single
  prompt: "What is the read-consistency invariant for a tiered Fluss table?"
  options:
    A: "The streaming read always returns MORE rows than the batch read"
    B: "After tiering quiesces, a streaming read and a batch read of the lake tier return the same set of rows"
    C: "The batch read is always stale and never matches"
    D: "Only the hot tier is ever consistent"
  answer: [B]
  explanation: "The streamhouse promise is one copy, two latencies, the same answer. Tiering has caught up. Then the streaming view and the batch lake-tier view must agree on the set of rows. This is the G6 streaming-vs-batch oracle applied to tiered storage."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q6
  type: single
  prompt: "Why must a batch read of the `$lake` tier be bounded with a wall-clock deadline?"
  options:
    A: "To rate-limit the output"
    B: "Tiering is asynchronous and the source can be unbounded. Without a deadline the read could hang. A bounded read returns when the tiered data has landed"
    C: "Because Fluss forbids batch reads"
    D: "To force exactly-once semantics"
  answer: [B]
  explanation: "Tiering lands asynchronously (~30-40 s), and an unbounded read would never return. You read with a wall-clock deadline and a bounded scan. Then the job finishes when the data is present. It does not block on a live stream."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q7
  type: multi
  prompt: "Which conditions must be true for a Fluss table to tier to Paimon and to be read as `$lake`? (choose all)"
  options:
    A: "'table.datalake.enabled'='true' is set on the table"
    B: "The server knows the lake format and warehouse (datalake.format=paimon, datalake.paimon.warehouse)"
    C: "paimon-flink is on the classpath for the `$lake` read path"
    D: "The table must be a log table with no primary key"
  answer: [A, B, C]
  explanation: "Tiering needs the opt-in for each table, a server-side lake format and warehouse, and paimon-flink on the classpath for the `$lake` read. A PK table (not a log table) gives each key a well-defined latest value to tier. So D is false."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q8
  type: single
  prompt: "When is Fluss + lake tiering NOT worth its operational cost?"
  options:
    A: "One copy must serve both a sub-second lookup and a historical scan at scale"
    B: "You only ever need batch/OLAP and nothing reads a hot tier, so you write straight to Paimon/Iceberg instead"
    C: "Freshness SLAs are strict"
    D: "The fast store and the warehouse must stay consistent automatically"
  answer: [B]
  explanation: "If nothing reads the hot tier, Fluss and the tiering job are only overhead. Writing directly to Paimon/Iceberg is simpler. Fluss is worth its cost only when one copy must serve both latencies at scale or under strict freshness SLAs."
  source: "https://fluss.apache.org/docs/intro/"
