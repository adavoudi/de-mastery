- id: STH-03-q1
  type: single
  prompt: "What gap between Kafka and a lakehouse is Apache Fluss designed to fill?"
  options:
    A: "It replaces object storage with a relational database"
    B: "It is a columnar, low-latency streaming store whose recent data is hot (sub-second) and whose history tiers to the lake, serving both latencies from one copy"
    C: "It is a faster batch scheduler"
    D: "It is a drop-in replacement for dbt"
  answer: [B]
  explanation: "A Kafka log is cheap and low-latency but poor for keyed latest-value lookups or OLAP; a lakehouse is cheap OLAP but batch-latency. Fluss stores recent data hot and tiers history to the lake as one logical table, serving both latencies."
  source: "https://fluss.apache.org/docs/intro/"

- id: STH-03-q2
  type: single
  prompt: "What is the difference between a Fluss log table and a Fluss PK table?"
  options:
    A: "Log tables are columnar; PK tables are row-oriented"
    B: "A log table is append-only (read as a stream); a PK table is upsertable and serves the latest value per key"
    C: "PK tables cannot be tiered to the lake"
    D: "Log tables require a primary key"
  answer: [B]
  explanation: "A log table is append-only, like a columnar Kafka topic. A PK table (PRIMARY KEY NOT ENFORCED) is upsertable: it serves the latest value per key and can be read as a changelog or a point-in-time snapshot."
  source: "https://fluss.apache.org/docs/intro/"

- id: STH-03-q3
  type: single
  prompt: "Which table property turns on lake tiering for a Fluss table?"
  options:
    A: "'merge-engine'='partial-update'"
    B: "'table.datalake.enabled'='true'"
    C: "'format-version'='2'"
    D: "'changelog-producer'='input'"
  answer: [B]
  explanation: "Lake tiering is opt-in per table via 'table.datalake.enabled'='true'; a Flink tiering service then continuously moves committed data from Fluss's hot store into the configured lake format."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q4
  type: single
  prompt: "After tiering is enabled, how do you read ONLY the data that has landed in the lake tier (batch-readable, even from pure Python)?"
  options:
    A: "Read the table name directly"
    B: "Read the `table$lake` system table"
    C: "Read `table$audit_log`"
    D: "You cannot read the lake tier separately"
  answer: [B]
  explanation: "Reading the table name gives the real-time view (hot + tiered). Reading the `table$lake` system table gives just the tiered Paimon data, readable in batch by Flink or by pypaimon with no Flink at all."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q5
  type: single
  prompt: "What is the read-consistency invariant for a tiered Fluss table?"
  options:
    A: "The streaming read always returns MORE rows than the batch read"
    B: "After tiering quiesces, a streaming read and a batch read of the lake tier return the same set of rows"
    C: "The batch read is always stale and never matches"
    D: "Only the hot tier is ever consistent"
  answer: [B]
  explanation: "The streamhouse promise is one copy, two latencies, the same answer. Once tiering has caught up, the streaming view and the batch lake-tier view must agree on the set of rows — the G6 streaming-vs-batch oracle applied to tiered storage."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q6
  type: single
  prompt: "Why must a batch read of the `$lake` tier be bounded with a wall-clock deadline?"
  options:
    A: "To rate-limit the output"
    B: "Because tiering is asynchronous and the source can be unbounded, so without a deadline the read could hang; a bounded read returns once the tiered data has landed"
    C: "Because Fluss forbids batch reads"
    D: "To force exactly-once semantics"
  answer: [B]
  explanation: "Tiering lands asynchronously (~30-40 s) and an unbounded read would never return. Reading with a wall-clock deadline and a bounded scan lets the job finish once the data is present instead of blocking on a live stream."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q7
  type: multi
  prompt: "Which conditions are needed for a Fluss table to tier to Paimon and be read as `$lake`? (choose all)"
  options:
    A: "'table.datalake.enabled'='true' on the table"
    B: "The server knows the lake format and warehouse (datalake.format=paimon, datalake.paimon.warehouse)"
    C: "paimon-flink on the classpath for the `$lake` read path"
    D: "The table must be a log table with no primary key"
  answer: [A, B, C]
  explanation: "Tiering needs the per-table opt-in, a server-side lake format + warehouse, and paimon-flink on the classpath for the `$lake` read. A PK table (not a log table) is what gives a well-defined latest value per key to tier, so D is false."
  source: "https://fluss.apache.org/docs/maintenance/tiered-storage/lakehouse-storage/"

- id: STH-03-q8
  type: single
  prompt: "When is Fluss + lake tiering NOT worth its operational cost?"
  options:
    A: "When one copy must serve both a sub-second lookup and a historical scan at scale"
    B: "When you only ever need batch/OLAP and nothing reads a hot tier — write straight to Paimon/Iceberg instead"
    C: "When freshness SLAs are strict"
    D: "When the fast store and the warehouse must stay consistent automatically"
  answer: [B]
  explanation: "If nothing reads the hot tier, Fluss and the tiering job are pure overhead; writing directly to Paimon/Iceberg is simpler. Fluss earns its cost only when one copy must serve both latencies at scale or under strict freshness SLAs."
  source: "https://fluss.apache.org/docs/intro/"
