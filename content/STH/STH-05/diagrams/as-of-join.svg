<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-labelledby="as-of-join-t">
  <title id="as-of-join-t">As-of join: each order lands on the Alice version valid at its order_ts</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}.dg-dot-ok{fill:#2c7a4b}.dg-dot-bad{fill:#b3372b}
  </style>
  <defs><marker id="as-of-join-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="dg-muted" x="40" y="22">fct_orders (event time order_ts)</text>
  <g>
    <text class="dg-text dg-b dg-mono" x="150" y="52" text-anchor="middle">order t=30</text>
    <circle class="dg-dot" cx="150" cy="68" r="6"/>
    <path class="dg-line" d="M150 74V128" marker-end="url(#as-of-join-arrow)"/>
    <text class="dg-text dg-b dg-mono" x="360" y="52" text-anchor="middle">order t=100</text>
    <circle class="dg-dot" cx="360" cy="68" r="6"/>
    <path class="dg-line" d="M360 74V128" marker-end="url(#as-of-join-arrow)"/>
    <text class="dg-text dg-b dg-mono" x="500" y="52" text-anchor="middle">order t=140</text>
    <circle class="dg-dot" cx="500" cy="68" r="6"/>
    <path class="dg-line" d="M500 74V128" marker-end="url(#as-of-join-arrow)"/>
  </g>
  <text class="dg-muted" x="40" y="116">dim_customer, Alice</text>
  <rect class="dg-box" x="60" y="130" width="300" height="50" rx="6"/>
  <text class="dg-text dg-b" x="210" y="160" text-anchor="middle">std</text>
  <rect class="dg-accent" x="360" y="130" width="300" height="50" rx="6"/>
  <text class="dg-text dg-b" x="510" y="160" text-anchor="middle">gold (is_current)</text>
  <path class="dg-line dg-dash" d="M660 155H690"/>
  <path class="dg-line" d="M60 205H680"/>
  <path class="dg-line" d="M60 199V211M360 199V211"/>
  <text class="dg-text dg-mono" x="60" y="228" text-anchor="middle">0</text>
  <text class="dg-text dg-mono" x="360" y="228" text-anchor="middle">100</text>
  <text class="dg-muted" x="210" y="228" text-anchor="middle">valid_from 0 to valid_to 100</text>
  <text class="dg-muted" x="540" y="228" text-anchor="middle">valid_from 100, valid_to open</text>
  <rect class="dg-box" x="100" y="248" width="100" height="32" rx="6"/>
  <text class="dg-text dg-mono" x="150" y="269" text-anchor="middle">tier = std</text>
  <rect class="dg-ok" x="310" y="248" width="100" height="32" rx="6"/>
  <text class="dg-text dg-mono" x="360" y="269" text-anchor="middle">tier = gold</text>
  <rect class="dg-ok" x="450" y="248" width="100" height="32" rx="6"/>
  <text class="dg-text dg-mono" x="500" y="269" text-anchor="middle">tier = gold</text>
  <text class="dg-muted" x="360" y="304" text-anchor="middle">valid_from &lt;= ts &lt; valid_to</text>
</svg>
