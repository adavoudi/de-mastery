- id: STH-05-q1
  type: single
  prompt: "You build an SCD2 dim_customer from a CDC changelog. How do you derive the `valid_to` of each version?"
  options:
    A: "It is always NULL"
    B: "valid_to = LEAD(effective_from) over the versions of the key, ordered by effective time. The valid_to of the newest version stays open"
    C: "valid_to = the processing time when the row arrived"
    D: "valid_to = effective_from + 1 day, fixed"
  answer: [B]
  explanation: "The effective time of the next version closes a version: valid_to = LEAD(effective_from) PARTITION BY key ORDER BY effective_from. The last version per key has no successor. So its valid_to stays open (a sentinel) and is_current = true."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/over-agg/"

- id: STH-05-q2
  type: single
  prompt: "An order placed at t=30 belongs to customer Alice. She was 'std' until t=100 and 'gold' after. The pipeline reprocesses the order next week. Which tier should fct_orders record?"
  options:
    A: "gold — her current tier"
    B: "std — the tier effective at the event time of the order (t=30)"
    C: "Whatever tier is current when the pipeline reprocesses the order"
    D: "Both, as two rows"
  answer: [B]
  explanation: "The as-of rule values a fact with the dimension version that was effective at the event time of the fact. The order at t=30 falls in the std interval [0,100) of Alice. So you must stamp it std, no matter when you reprocess it. If you record gold, you silently restate history."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: STH-05-q3
  type: single
  prompt: "Which join condition expresses a point-in-time (as-of) match between an order and an SCD2 dimension version?"
  options:
    A: "o.cid = d.cid AND d.is_current = true"
    B: "o.cid = d.cid AND o.order_ts >= d.valid_from AND o.order_ts < d.valid_to"
    C: "o.cid = d.cid (any version)"
    D: "o.order_ts = d.valid_from"
  answer: [B]
  explanation: "The as-of match selects the single version whose validity interval [valid_from, valid_to) contains the event time of the fact. A join on is_current gives the latest version (wrong for history). A join on the key alone matches every version (fan-out)."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/joins/"

- id: STH-05-q4
  type: single
  prompt: "You order CDC change events to build SCD2 validity intervals. Which timestamp should you order by?"
  options:
    A: "The processing time when the event arrived"
    B: "The business effective time of the change"
    C: "A random tiebreaker"
    D: "The commit time of the Flink checkpoint"
  answer: [B]
  explanation: "Validity intervals depend on business/event time. So a late-arriving change still goes into the correct interval. If you order by processing/arrival time, a late change goes after events that are really later in business time. This corrupts the intervals."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: STH-05-q5
  type: single
  prompt: "What makes a streaming dimensional model trustworthy (TESTING.md G6)?"
  options:
    A: "It runs without errors"
    B: "Its result equals an independent batch rebuild (for example a DuckDB AS-OF join) over the same events"
    C: "It uses the newest Flink version"
    D: "It has more than one TaskManager"
  answer: [B]
  explanation: "The streaming invariant: all input has arrived, and then the streaming result equals the batch answer over the same events. You reconcile the dim/fct against the as-of join of an independent engine. This is the acceptance gate. It is the streaming version of a dbt reconciliation test."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/joins/"

- id: STH-05-q6
  type: single
  prompt: "Why is it unsafe to join a fact to the dimension row where is_current = true (instead of the as-of version)?"
  options:
    A: "It is always safe"
    B: "It stamps every fact, including historical and reprocessed facts, with the latest attributes. This restates history"
    C: "It produces duplicate rows"
    D: "It drops NULL keys"
  answer: [B]
  explanation: "is_current = true selects the latest version. So a reprocessed historical order gets today's attributes, not the version that was effective then. This is the 'latest, not as-of' bug. It is a point-in-time accuracy defect."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"

- id: STH-05-q7
  type: multi
  prompt: "Which statements about an SCD2 dimension built from CDC are correct? (choose all)"
  options:
    A: "Each change event becomes a new version row"
    B: "The newest version per key has an open valid_to and is_current = true"
    C: "A fact matches exactly one version via its validity interval"
    D: "Every version must have is_current = true"
  answer: [A, B, C]
  explanation: "A changelog event = a version. The latest version per key is open and current. The event time of a fact falls in exactly one [valid_from, valid_to) interval. Only one version per key can be current, so D is false."
  source: "https://paimon.apache.org/docs/master/primary-key-table/overview/"

- id: STH-05-q8
  type: single
  prompt: "In Flink SQL, you use a temporal join `FOR SYSTEM_TIME AS OF o.order_ts`. What must the versioned (dimension) table have?"
  options:
    A: "No key"
    B: "A PRIMARY KEY and an event-time attribute, so versions are ordered per key"
    C: "Exactly one row per key"
    D: "A processing-time attribute only"
  answer: [B]
  explanation: "A versioned table needs a primary key (the identity of the version). It also needs an event-time attribute/watermark. Then the planner can order versions per key and answer FOR SYSTEM_TIME AS OF. This is the engine form of the explicit SCD2 validity-interval join."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/concepts/versioned_tables/"
