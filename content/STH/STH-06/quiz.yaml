- id: STH-06-q1
  type: single
  prompt: "In a streaming data-quality stage, what is the key difference between filtering with a WHERE clause and using a quarantine/DLQ?"
  options:
    A: "There is no difference"
    B: "A WHERE filter silently drops failing records. A quarantine routes them to a side table with the reason they failed"
    C: "A quarantine is slower and always worse"
    D: "WHERE keeps bad records in the mart"
  answer: [B]
  explanation: "Filtering discards failing records and leaves no trace. So the mart is quietly incomplete. A quarantine/DLQ routes each failing record (with a reason). Then the mart values every input or the quarantine explains it. You can triage and replay the records."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/side_output/"

- id: STH-06-q2
  type: single
  prompt: "Which invariant catches a silent-drop bug in a DQ stage?"
  options:
    A: "count(mart) > 0"
    B: "count(mart) + count(quarantine) == count(input), with the two sets disjoint"
    C: "The job runs without exceptions"
    D: "count(quarantine) == 0"
  answer: [B]
  explanation: "Completeness: every input record must land in exactly one place, the mart or the quarantine. Suppose a record leaves the input and lands in neither. Then the counts no longer reconcile. This is the streaming form of 'the load balanced'."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/side_output/"

- id: STH-06-q3
  type: single
  prompt: "Why must the 'good' and 'quarantine' predicates be exact logical complements?"
  options:
    A: "So the job compiles"
    B: "So the job routes no record to both tables and no record to neither (this preserves completeness)"
    C: "To make the query faster"
    D: "To avoid using a CASE expression"
  answer: [B]
  explanation: "Suppose the predicates overlap. Then the system counts a record twice. Suppose they leave a gap. Then the system silently loses a record. Exact complements guarantee that each input goes to exactly one destination. This makes the completeness invariant hold."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/overview/"

- id: STH-06-q4
  type: single
  prompt: "A record violates two DQ rules at once (null customer AND non-positive amount). How does the pipeline handle it?"
  options:
    A: "Two quarantine rows, one per rule"
    B: "One quarantine row with a single reason (the first matching rule in the CASE)"
    C: "It is dropped because it is 'too broken'"
    D: "It is sent to the mart with a warning"
  answer: [B]
  explanation: "Membership in the quarantine does not depend on the order of the rules. Only the reason label depends on the CASE priority. The record appears exactly once, with the first matching reason. If the pipeline counted it twice, completeness would break."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/overview/"

- id: STH-06-q5
  type: single
  prompt: "Which dbt test corresponds to the DQ rule 'the customer id of the order must reference a real customer'?"
  options:
    A: "not_null"
    B: "accepted_values"
    C: "relationships (a foreign-key / referential test)"
    D: "unique"
  answer: [C]
  explanation: "A referential check that a value exists in a parent table is the relationships test of dbt. In-flight, it becomes a left-join miss → quarantine with reason 'unknown_customer'. not_null maps to the null-customer rule. accepted_values maps to the amount rule."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/table/sql/queries/overview/"

- id: STH-06-q6
  type: single
  prompt: "What distinguishes a healthy DLQ from 'a silent drop with extra steps'?"
  options:
    A: "Its name"
    B: "It is monitored, triaged and replayable. Someone acts on the quarantined records and their reasons"
    C: "It is stored in Iceberg rather than Paimon"
    D: "It is never read"
  answer: [B]
  explanation: "A DLQ adds value only if people watch it and work on it: alert on its size and reasons, fix the source, and replay. A quarantine that nobody reads loses data just as a WHERE filter does. The routing is necessary but not sufficient."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/side_output/"

- id: STH-06-q7
  type: multi
  prompt: "Which statements about in-flight DQ with a quarantine are correct? (choose all)"
  options:
    A: "Every input record ends up in the mart or the quarantine, never in neither"
    B: "A quarantine row carries the reason the record failed"
    C: "Silently filtering bad rows preserves completeness"
    D: "The good and quarantine sets are disjoint"
  answer: [A, B, D]
  explanation: "Completeness requires each input in exactly one destination (A, D). The reason enables triage and replay (B). Silent filtering breaks completeness, so C is false. This is the anti-pattern that this module exists to kill."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/side_output/"

- id: STH-06-q8
  type: single
  prompt: "Why does streaming data quality route each record instead of failing the run like a dbt test?"
  options:
    A: "Streaming engines cannot raise errors"
    B: "A stream has no post-load gate. Data flows to consumers continuously, so the pipeline must decide quality for each record and keep the mart flowing"
    C: "dbt tests are not allowed in streaming"
    D: "Failing the run is impossible in SQL"
  answer: [B]
  explanation: "In batch, a failing test blocks the run before anyone reads the data. A stream has no such boundary, because consumers read immediately. So you decide the fitness of each event and quarantine the records that are not fit. You do not halt the whole pipeline."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/docs/dev/datastream/side_output/"
