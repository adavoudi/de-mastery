- id: STH-07-q1
  type: single
  prompt: "A dashboard tile on a streaming revenue mart must answer in about a second. What is the standard serving-layer design?"
  options:
    A: "Scan the raw primary-key fact table on every tile load and add more CPU"
    B: "Read a small pre-aggregated rollup table and prune it with the dashboard's predicate"
    C: "Iterate the table's changelog stream until it ends"
    D: "Cache the entire fact table in the browser"
  answer: [B]
  explanation: "The raw fact is laid out for ingestion (small files, LSM levels, delete files). Serving reads a small pre-aggregated rollup and prunes it, exactly like a BI rollup / materialized view in a batch warehouse."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-07-q2
  type: single
  prompt: "To serve the current state of a Paimon partial-update primary-key table, which read do you use?"
  options:
    A: "A streaming read of the changelog, summing every record"
    B: "A batch snapshot read, which applies the merge engine and returns the latest value per key"
    C: "A read of the audit_log system table only"
    D: "A raw file listing of the newest data files"
  answer: [B]
  explanation: "A batch snapshot read applies the merge (dedup / partial-update / aggregation) and returns the merged latest-per-key state. Iterating the changelog is for downstream pipelines and would double-count superseded versions."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-07-q3
  type: single
  prompt: "Why is a query plan (EXPLAIN) a better proof of serving performance than wall-clock time?"
  options:
    A: "Wall-clock time is always slower than the plan predicts"
    B: "The plan shows the query reads the rollup and prunes with the predicate; timing is flaky because of cache state and machine load"
    C: "EXPLAIN runs the query faster"
    D: "Plans are required by SOX; timing is not"
  answer: [B]
  explanation: "The durable proof is structural: the plan shows the rollup table is read and the predicate prunes it. Wall-clock is only a generous guardrail (warm cache, median of N) because it depends on cache state, GC and a possibly loaded machine."
  source: "https://iceberg.apache.org/docs/latest/"

- id: STH-07-q4
  type: single
  prompt: "A streaming dashboard shows roughly 50% more revenue than a nightly batch rebuild of the same events. What is the most likely cause?"
  options:
    A: "The batch job is simply wrong; trust the stream"
    B: "The serving read is summing the changelog / un-merged versions, double-counting superseded rows instead of reading the merged snapshot"
    C: "DuckDB cannot add integers correctly"
    D: "The dashboard is caching too aggressively"
  answer: [B]
  explanation: "Reading the changelog or un-merged versions double-counts superseded rows. Serving must read the merged snapshot (latest per key). The G6 invariant: the OLAP answer over the merged snapshot equals a batch rebuild of the same events."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-07-q5
  type: single
  prompt: "DuckDB's iceberg_scan cannot open an Iceberg table written by Flink's hadoop catalog. What is the recommended workaround in this stack?"
  options:
    A: "Rewrite every manifest path by hand"
    B: "Read the table with pyiceberg to an Arrow table, register it in DuckDB, then run SQL"
    C: "Give up and use the changelog"
    D: "Convert the table to CSV first"
  answer: [B]
  explanation: "The Flink hadoop catalog stores manifest paths with a file: scheme DuckDB's iceberg extension rejects. Read via pyiceberg (StaticTable.from_metadata -> scan().to_arrow()), register the Arrow table in DuckDB, then query."
  source: "https://iceberg.apache.org/docs/latest/"

- id: STH-07-q6
  type: multi
  prompt: "Which situations argue AGAINST building a pre-aggregated serving rollup? (select all)"
  options:
    A: "The dashboard needs drill-to-detail on a single primary key (a point lookup)"
    B: "A dashboard aggregates millions of rows into a few dozen tiles"
    C: "The consumer is another streaming pipeline, which should read the changelog instead"
    D: "The merged table is already tiny, so a direct scan is simpler than maintaining a rollup"
  answer: [A, C, D]
  explanation: "Rollups help interactive aggregate reads over large facts (B). A single-key drill-down is a point lookup (A); a downstream pipeline should read the changelog, not an OLAP snapshot (C); and a tiny merged table doesn't need the extra rollup to maintain (D)."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-07-q7
  type: single
  prompt: "What does pruning (predicate pushdown) buy a serving query over a columnar rollup?"
  options:
    A: "It rewrites the SQL to use fewer joins"
    B: "The engine skips row groups and columns the predicate and projection don't need, reading far less data"
    C: "It guarantees exactly-once semantics"
    D: "It compacts the small files automatically"
  answer: [B]
  explanation: "A predicate (one company, a date range) plus column projection lets a columnar engine skip row groups and unneeded columns, reading only what the tile requires — the core of interactive serving latency."
  source: "https://iceberg.apache.org/docs/latest/"
