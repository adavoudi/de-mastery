- id: STH-08-q1
  type: single
  prompt: "Moving a mart from an hourly tier to a seconds tier changes the bill. Which cost bucket typically grows the MOST steeply?"
  options:
    A: "Storage — more bytes are retained"
    B: "Compute — from a few scheduled job-minutes to a 24/7 always-on cluster"
    C: "Network egress to the dashboard"
    D: "The cost of the dashboard tool licence"
  answer: [B]
  explanation: "Batch pays compute only while a scheduled job runs; the seconds tier is a fully provisioned always-on cluster, which is the dominant and steepest-growing cost at low latency."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/"

- id: STH-08-q2
  type: single
  prompt: "The seconds tier stores roughly the same retained data as the hours tier. Why does its STORAGE cost still rise (mildly)?"
  options:
    A: "Streaming data is encrypted and encryption doubles size"
    B: "Frequent commits write many small files (and old snapshots), adding small-file overhead until compaction/expiry"
    C: "Object stores charge more per GB for fresh data"
    D: "Storage does not rise at all; the premise is false"
  answer: [B]
  explanation: "Frequent checkpoints/commits produce many small files and extra snapshots, adding overhead until compaction and snapshot expiry reclaim it. The retained bytes are similar, so storage rises mildly compared with always-on compute."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-08-q3
  type: multi
  prompt: "Which cost buckets should a freshness-tier cost model include? (select all)"
  options:
    A: "Compute (job / cluster time, including compaction)"
    B: "Storage (retained bytes plus small-file overhead)"
    C: "Operations / people (monitoring, on-call)"
    D: "The colour of the dashboard theme"
  answer: [A, B, C]
  explanation: "A tier changes compute, storage and operations/people at once. A model that omits any of the three understates the real cost of lower latency."
  source: "https://fluss.apache.org/"

- id: STH-08-q4
  type: single
  prompt: "Two engineers model the same workload and tiers independently. What makes their totals land within ±20% of each other?"
  options:
    A: "They copy each other's spreadsheet"
    B: "A deterministic, formula-driven model: fixed inputs (volume, retention, per-unit prices) and explicit per-component formulas; the tier only changes a few multipliers"
    C: "They both round everything up to the nearest thousand"
    D: "They each guess a round number"
  answer: [B]
  explanation: "Determinism comes from explicit formulas over the same inputs; the tier changes only a few multipliers (always-on fraction, file-count multiplier, on-call hours). Independent implementations then agree within rounding, well inside ±20%."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/"

- id: STH-08-q5
  type: single
  prompt: "A mart's SLA is 'fresh by 9 a.m.' The business asks for second-level freshness anyway. What is the right engineering recommendation?"
  options:
    A: "Always choose the freshest tier; freshness is free"
    B: "Price all three tiers and recommend the cheapest tier that meets the SLA; seconds buys nothing here but costs several times more"
    C: "Refuse to model cost and let the business decide blindly"
    D: "Move every other mart to seconds too, for consistency"
  answer: [B]
  explanation: "Freshness is a cost lever. If hourly meets the SLA, the seconds tier adds always-on compute, compaction and on-call for no benefit. Tier per mart by its actual SLA."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-08-q6
  type: single
  prompt: "In the cost model, where does continuous COMPACTION work belong?"
  options:
    A: "In storage, because it rewrites files"
    B: "In compute, because it is cluster time spent merging small files"
    C: "In operations, because an engineer triggers it"
    D: "It is free and belongs nowhere"
  answer: [B]
  explanation: "Compaction consumes cluster/job time to merge small files, so it is compute. Storage captures the retained bytes plus the transient small-file overhead; the work of compacting is compute."
  source: "https://paimon.apache.org/docs/2.0/"

- id: STH-08-q7
  type: single
  prompt: "A cost model shows the HOURS tier costing more than the SECONDS tier for the same mart. What is the most likely modelling error?"
  options:
    A: "The model correctly reflects reality"
    B: "The tier multipliers are inverted (e.g. always-on compute or on-call applied to batch, not to streaming)"
    C: "The storage price is too low"
    D: "The dashboard query is too fast"
  answer: [B]
  explanation: "Seconds > minutes > hours is the expected ordering because compute and on-call grow as latency shrinks. Hours > seconds signals inverted multipliers — applying always-on/on-call costs to the batch tier instead of the streaming tier."
  source: "https://nightlies.apache.org/flink/flink-docs-release-2.2/"
