<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="tpl-t">
  <title id="tpl-t">Template: a producer sends a record to a broker</title>
  <style>
    /* Standalone fallback only: the site drops this block and styles the dg-* classes itself. Keep in sync with static/style.css. */
    svg{font-family:system-ui,sans-serif;font-size:14px}
    .dg-box{fill:#fff;stroke:#4b463c;stroke-width:1.5}.dg-accent{fill:#e3eeee;stroke:#1d5c63;stroke-width:1.5}
    .dg-ok{fill:#e1f0e6;stroke:#2c7a4b;stroke-width:1.5}.dg-bad{fill:#f8e4e0;stroke:#b3372b;stroke-width:1.5}
    .dg-warn{fill:#f7edd2;stroke:#b8860b;stroke-width:1.5}
    .dg-text{fill:#26231d}.dg-muted{fill:#7b7467;font-size:12px}.dg-mono{font-family:ui-monospace,monospace}.dg-b{font-weight:600}
    .dg-line{fill:none;stroke:#4b463c;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-head{fill:#4b463c}
    .dg-dot{fill:#1d5c63}
  </style>
  <defs><marker id="tpl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-head" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="dg-accent" x="30" y="70" width="150" height="70" rx="10"/>
  <text class="dg-text dg-b" x="105" y="110" text-anchor="middle">Producer</text>
  <rect class="dg-box" x="460" y="70" width="150" height="70" rx="10"/>
  <text class="dg-text dg-b" x="535" y="110" text-anchor="middle">Broker</text>
  <path class="dg-line" d="M180 105H458" marker-end="url(#tpl-arrow)"/>
  <circle class="dg-dot" r="8" cx="180" cy="105">
    <animate attributeName="cx" values="180;450;450" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.6;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text class="dg-muted" x="320" y="92" text-anchor="middle">record</text>
</svg>
