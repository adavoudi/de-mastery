# Spark defaults for the `core` lab. Mounted read-only at
# /opt/spark/conf/spark-defaults.conf. Used by BOTH the Spark Connect server
# and any `spark-sql` / `pyspark` run inside the container (e.g. the smoke test).
#
# Credentials come from the container environment (AWS_ACCESS_KEY_ID etc.),
# which compose injects from labs/.env — they are intentionally NOT in this file.

# --- Driver runs in local mode on the single Spark container ---------------
spark.master                               local[*]
spark.driver.memory                        2g
spark.sql.shuffle.partitions               8
spark.ui.port                              4040

# --- Iceberg SQL extensions + REST catalog named `demo` --------------------
spark.sql.extensions                       org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.demo                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type                rest
spark.sql.catalog.demo.uri                 http://iceberg-rest:8181
spark.sql.catalog.demo.io-impl             org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.demo.warehouse           s3://warehouse/
spark.sql.catalog.demo.s3.endpoint         http://silo:9000
spark.sql.catalog.demo.s3.path-style-access true
spark.sql.defaultCatalog                   demo
