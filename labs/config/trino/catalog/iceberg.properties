# Trino catalog: Iceberg tables via the shared REST catalog, data in silo (S3).
# Mounted read-only at /etc/trino/catalog/iceberg.properties.
# ${ENV:VAR} is expanded by Trino from the container environment (set in compose).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://${ENV:WAREHOUSE_BUCKET}/

# S3 access to silo (MinIO-compatible). Trino's native S3 file system.
fs.native-s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=${ENV:AWS_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
