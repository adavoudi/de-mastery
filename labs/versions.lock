        also runs with NO Docker on the native dist above.

phase4_notes:
  ports: >
    flink host ports are deliberately non-standard (8086 JobManager REST, 8087
    SQL Gateway) and bind 127.0.0.1 only, so they never collide with the user's
    local_pgdb (5432) or pgadmin4_container (8888), nor the core (8080/8181/
    9000/9001/15002/4040/8889) or streaming (19092/8081/8083/5433/8085) profiles.
  memory: >
    Native fixture cluster: JobManager -Xmx~1024m, TaskManager ~1280m (small
    heaps), on OS-assigned free ports. Docker `flink` profile limits:
    jobmanager 1500m + taskmanager 2000m + sql-gateway 1024m ~= 4.5 GB. On a
    32 GB host, run ONE lab profile at a time; the native (no-Docker) path is
    much lighter and is what the graded tests use.
  verification: >
    labs/smoke_flink.sh passed end to end on 2026-10-04 (Docker 29.8.2): JM
    healthy, 1 TaskManager registered (2 slots), the bundled WordCount example
    jar submitted via `flink run` and FINISHED, and the SQL Gateway REST returned
    {"productName":"Apache Flink","version":"2.2.1"}. Teardown removed ONLY the
    flink containers. `uv run pytest cli/tests -q` -> 68 passed (incl. the Flink
    self-test gates G1-G5, the embedded SQL changelog/RowKind runner, the native
    local cluster submit+kill-TM-recovery, and the PyFlink runner).

