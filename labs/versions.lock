# --- Iceberg-on-Flink version note (IMPORTANT for FLK-10 authors) -----------
iceberg_flink_decision:
  decision: >
    Iceberg 1.10.0 (the Spark-side pin, phase2_jars) has NO Flink 2.2 runtime —
    iceberg-flink-runtime-2.2 is published ONLY as 1.12.0 (1.10.0 exists only for
    Flink 2.0). We pin iceberg-flink-runtime-2.2:1.12.0 for the Flink Iceberg
    sink/source. The on-disk Iceberg table FORMAT is forward/backward compatible
    across these engine-runtime patch lines (both write Iceberg v2 tables), so a
    table written by Flink (Iceberg 1.12.0 runtime) is readable by Spark
    (Iceberg 1.10.0 runtime) and vice-versa. FLK-10's no-Docker graded path uses
    a LOCAL hadoop catalog (file:// warehouse) via the hadoop-client jars above.

# --- PyFlink (FLK-08 Python side) -------------------------------------------
pyflink_decision:
  version: "2.2.1"
  python: "3.12"                 # apache_flink-2.2.1-cp312 manylinux wheel exists
  venv: labs/.flink/.pyflink-venv
  decision: >
    apache-flink==2.2.1 requires apache-beam<=2.61.0, which hard-caps
    pyarrow/numpy/protobuf BELOW the main project's pins (pyarrow 18.1.0,
    pandas 2.2.3). Adding it to pyproject.toml would force a resolver cascade and
    break the lock. So PyFlink is NOT in pyproject.toml; labs/fetch_flink.sh
    builds a DEDICATED, gitignored venv (labs/.flink/.pyflink-venv) with
    `uv venv --python 3.12` + `uv pip install apache-flink==2.2.1`, and the
    de_testkit `pyflink_runner` fixture shells out to that interpreter with
    JAVA_HOME=labs/.jdk. Verified: a PyFlink Table API batch job runs on JDK 21
    and returns correct GROUP BY SUM results. SKIPs cleanly if the venv is absent.

