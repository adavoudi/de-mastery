# --- Schema Registry decision -----------------------------------------------
schema_registry:
  decision: >
    KFK-06 grades WITHOUT any Schema Registry process: the no-Docker path is a
    fastavro schema-resolution compatibility checker (de_testkit.check_compatibility
    / the check_avro_compatibility fixture), which decides BACKWARD/FORWARD/FULL
    by actually round-tripping records through writer->reader schemas — the same
    mechanism a consumer hits at runtime. A LIVE registry is an optional extra
    layer: either the native Confluent Community Schema Registry (vendored by
    labs/fetch_schema_registry.sh -> labs/.schema-registry, run on the vendored
    JDK against the native broker; `schema_registry` fixture, SKIPs when absent)
    or the `streaming` lab's confluentinc/cp-schema-registry (lab_schema_registry
    fixture). Karapace/Apicurio were considered; the fastavro fallback was chosen
    as the guaranteed-available graded path so KFK-06 never depends on a running
    service, and cp-schema-registry (Confluent Community License, fine for local
    learning) covers the live-registry demonstration in the lab.

