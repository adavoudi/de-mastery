        image: trinodb/trino
        tag: "476"
        digest: sha256:00125e40d063bc4816d165482f6044872b18b56026fb959d3b28ce1f96ffbbee
        role: SQL engine with Iceberg catalog over the REST catalog (:8080)

# --- Component / framework versions -----------------------------------------
components:
  spark: 4.0.0
  spark_scala: "2.13"
  spark_jdk_in_container: "17"      # host JDK (24) is NOT used; Spark runs in-container
  pyspark: 4.0.0                    # Jupyter client; matches the Spark server
  iceberg: 1.10.0
  trino: "476"
  object_store_api: s3              # silo speaks the S3 API; MINIO_* env vars preserved

# --- Iceberg runtime jar coordinates (baked into the Spark image) -----------
# Two jars, always together: the runtime (engine integration) and the aws-bundle
# (S3FileIO + bundled AWS SDK, required to talk to silo/S3). Fetched from Maven
# Central at image build time; see images/spark/Dockerfile.
iceberg_jars:
  - group: org.apache.iceberg
    artifact: iceberg-spark-runtime-4.0_2.13
    version: 1.10.0
    coordinate: "org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0"
  - group: org.apache.iceberg
    artifact: iceberg-aws-bundle
    version: 1.10.0
    coordinate: "org.apache.iceberg:iceberg-aws-bundle:1.10.0"
# spark-connect_2.13:4.0.0 is already bundled in apache/spark:4.0.0-python3
# (/opt/spark/jars), so it is NOT fetched separately.

# --- Notes / rationale ------------------------------------------------------
notes:
  object_store: >
    Upstream MinIO ended community distribution in 2025-2026: the minio/minio
    and minio/mc Docker Hub repos were deleted, and the quay.io/minio mirror is
    now gated behind authentication (anonymous pulls return 401). A plain
    `minio/minio` pin is therefore no longer usable in CI or a fresh laptop.
    pgsty/silo is an actively maintained community fork that preserves the S3
    API, the MINIO_* environment variables, x-minio-* headers and the web
    console, so it is behaviourally MinIO for a learning lab. If upstream MinIO
    (or another S3 store) becomes freely pullable again, only this image pin and
    the healthcheck binary name need to change.
  spark_topology: >
    Single Spark container in local[*] mode exposing a Spark Connect server,
    chosen over a standalone master + 2 workers for reliability and memory on a
    32 GB laptop. The local scheduler still produces real jobs/stages/tasks/
    shuffles and a Spark UI, and Spark Connect is itself on the SPK-01 syllabus.
  memory: >
    Observed peak during smoke_core.sh (light workload): trino ~1.0 GiB,
    spark ~0.95 GiB, iceberg-rest ~0.15 GiB, jupyter ~0.1 GiB, silo ~0.08 GiB;
    simultaneous total ~2.3 GiB. Compose memory LIMITS sum to 9.5 GiB
    (silo 1.5 + rest 1.0 + spark 3.5 + jupyter 1.5 + trino 2.0), keeping the
    profile bounded under ~10 GB even under real Spark jobs.

