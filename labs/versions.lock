# Phase 5 additions (agent: platform_fetch) — Apache Paimon + Apache Fluss (STH
# streamhouse track) + the `streamhouse` lab profile scaffolding. Verified on
# 2026-10-04, linux, vendored Temurin JDK 21 + the Phase 4 Flink 2.2.1 dist.
# ALL graded paths run with NO Docker: Paimon/Iceberg Flink jobs on the embedded
# MiniCluster (batch reads), a native Fluss local cluster (ZK + coordinator +
# tablet server on free ports), the Fluss->Paimon tiering service on a native
# Flink local cluster, and pure-Python pypaimon / pyiceberg serving reads.
# =============================================================================

# --- Apache Paimon (STH-02 lake format; labs/.jars/streamhouse, sha256) -----
# Paimon 2.0.0 pairs with Flink 2.2.1 on JDK 21. Three jars:
#   paimon-flink-2.2   = the Flink 2.2 connector + catalog (CREATE CATALOG
#                        'type'='paimon'); carries FlinkFileIOLoader needed to
#                        read Fluss `$lake` Paimon tables from a Flink job.
#   paimon-bundle      = the lake format core (LSM, manifests, merge engines);
#                        bundled standalone for actions / server plugins.
#   paimon-flink-action= compact / CDC / rewrite batch actions (STH-02/-04).
# Paimon's local file:// warehouse needs org.apache.hadoop.conf.Configuration +
# LocalFileSystem -> reuse hadoop-client-api/runtime 3.4.2 from labs/.jars/flink.
phase5_paimon:
  version: "2.0.0"
  jars:
    - file: paimon-flink-2.2-2.0.0.jar
      coordinate: org.apache.paimon:paimon-flink-2.2:2.0.0
      sha256: bf344b7c619dcce3fcae8b5cfd5130dd3a9592ce232057d6ce7363111a987d76
    - file: paimon-bundle-2.0.0.jar
      coordinate: org.apache.paimon:paimon-bundle:2.0.0
      sha256: 7a755b7b11b500147cd113802565d19d0f84947b6444bc8dabad85005c930561
    - file: paimon-flink-action-2.0.0.jar
      coordinate: org.apache.paimon:paimon-flink-action:2.0.0
      sha256: cd435d1136fbf18b627f895d2f5ac04de14a2a2fa1c7ff3a7bcd662933f7381f
  needs_hadoop: hadoop-client-api/runtime 3.4.2 (labs/.jars/flink; local file:// FS)

# --- Apache Fluss (STH-03 streaming storage; server + Flink connector) ------
# Fluss 1.0.0 is the latest stable (GA 2026-09-21; first release after TLP
# graduation). The server tarball bundles ZooKeeper + the paimon/iceberg/hudi
# lake plugins (plugins/paimon/ ships paimon-bundle-2.0.0 + fluss-lake-paimon +
# flink-shaded-hadoop-2-uber). `bin/local-cluster.sh start` runs ZK +
# coordinator + 1 tablet server on one host (tablet server picks a random port).
# IMPORTANT: fluss-flink-2.2 IS published for 1.0.0. The search.maven.org index
# is stale (shows only 0.9.x); the authoritative Maven repo metadata.xml
# (repo1.maven.org/.../fluss-flink-2.2/maven-metadata.xml) lists 1.0.0. The
# Flink 2.2 connector pairs with the vendored Flink 2.2.1. (Fluss 1.0 also added
# a Flink 2.3 connector; we stay on 2.2 to match the pinned dist.)
phase5_fluss:
  version: "1.0.0"
  released: "2026-09-21"
  server_tarball: fluss-1.0.0-bin.tgz
  server_sha512: 4cc134d1c5e7b9b07754b4d38903b9c6e4075d66aa7cf04eb3b053fa5095266f1d141e147417d292b3e93b642b24ea06630709de85562c3a829b640ccb7d52ca
  source_primary: https://downloads.apache.org/fluss/fluss-1.0.0/fluss-1.0.0-bin.tgz
  source_archive: https://archive.apache.org/dist/fluss/fluss-1.0.0/fluss-1.0.0-bin.tgz
  jars:
    - file: fluss-flink-2.2-1.0.0.jar          # Flink 2.2 connector + 'fluss' catalog
      coordinate: org.apache.fluss:fluss-flink-2.2:1.0.0
      sha256: 8cad6d1342b7e2deaf3db7fe7fbc1911c05823a538517b58da32cc0e8601ed8e
    - file: fluss-flink-tiering-1.0.0.jar      # Fluss->lake tiering service job
      coordinate: org.apache.fluss:fluss-flink-tiering:1.0.0
      sha256: f0b85db9b6cfdad8658406e31ce3a2aae6ffa0cdff81ce22fffc919e4032160e
  flink_connector_decision: >
    fluss-flink-2.2:1.0.0 chosen over fluss-flink-2.3 (would require Flink 2.3,
    which has no released flink-connector-kafka and is not the pinned dist) and
    over the 0.9.x line (incubating; older server protocol). The Flink 2.2
    connector + 1.0.0 server protocol are matched.

# --- Fluss -> Paimon lake tiering (STH-03) ----------------------------------
# Enabled WITHOUT Minio/S3/Docker by pointing Paimon at a LOCAL filesystem
# warehouse. Server config: datalake.format=paimon, datalake.paimon.metastore=
# filesystem, datalake.paimon.warehouse=file://<tmp>. The tiering service runs
# as a detached Flink job (fluss-flink-tiering jar) submitted to a native Flink
# local cluster; its classpath needs, in Flink lib/: fluss-flink-2.2 +
# paimon-flink-2.2 + fluss-lake-paimon-1.0.0 (from the Fluss paimon plugin) +
# flink-shaded-hadoop-2-uber-2.8.3-10.0 (from the Fluss paimon plugin). A Fluss
# table created WITH ('table.datalake.enabled'='true','table.datalake.freshness'
# ='5s') is tiered in ~30-40 s; read it via Flink `t$lake` or pure-Python
# pypaimon. VERIFIED end-to-end.
phase5_streamhouse_tiering:
  server_config:
    datalake.format: paimon
    datalake.paimon.metastore: filesystem
    datalake.paimon.warehouse: "file://<tmp warehouse> (per-test; NO Minio/S3)"
  flink_job_classpath_extra:
    - fluss-flink-2.2-1.0.0.jar
    - paimon-flink-2.2-2.0.0.jar
    - fluss-lake-paimon-1.0.0.jar            # from Fluss plugins/paimon/
    - flink-shaded-hadoop-2-uber-2.8.3-10.0.jar  # from Fluss plugins/paimon/

# --- Iceberg as streaming storage (STH-04) ----------------------------------
# Reuses iceberg-flink-runtime-2.2:1.12.0 (phase4_flink_jars) + the hadoop-client
# jars. Flink Iceberg sink commits on checkpoint; a BOUNDED source (filesystem/
# debezium-json/csv) makes the streaming job finish and fire the final commit.
# (datagen/VALUES streaming sources do NOT reliably trigger the committer — see
# probes.md "dead ends".) Read back in BATCH mode. Fluss 1.0 can also tier to
# Iceberg (plugins/iceberg/fluss-lake-iceberg-1.0.0.jar); Paimon tiering is the
# pinned/verified path.
phase5_iceberg_streaming:
  runtime: iceberg-flink-runtime-2.2-1.12.0.jar  # labs/.jars/flink (phase 4)
  commit: on checkpoint; bounded source => final commit on job finish

# --- Serving layer (STH-07; pure-Python, no Docker) -------------------------
# DuckDB's native iceberg_scan FAILS on Flink hadoop-catalog tables (metadata
# stores manifest paths with a 'file:' scheme DuckDB cannot open) -> do NOT use
# it directly. Instead:
#   * Paimon  : pypaimon==2.0.0 reads PK/partial-update tables with merge applied
#               (CatalogFactory.create({'warehouse': wh}) -> get_table ->
#               new_read_builder). Kept in a DEDICATED venv (apache-beam-free),
#               built by the de_testkit streamhouse fixture, NOT in pyproject.
#   * Iceberg : pyiceberg (main venv, 0.9.1) StaticTable.from_metadata(...).scan()
#               .to_arrow() -> register in DuckDB -> SQL. CAVEAT: pyiceberg 0.9.1
#               does NOT apply Iceberg v2 equality/positional deletes, so for
#               MOR/upsert tables read the MERGED state via a Flink batch job (or
#               collapse in DuckDB SQL); append-only / COW tables read directly.
# Optional Docker-only serving (StarRocks / Trino) is an EXTRA layer only.
phase5_serving:
  paimon_reader: pypaimon==2.0.0 (dedicated venv)
  iceberg_reader: pyiceberg==0.9.1 (main venv) -> Arrow -> DuckDB 1.1.3
  duckdb_iceberg_ext: AVOID (file:-scheme manifest paths from Flink hadoop catalog)

# --- `streamhouse` profile image note (optional extra layer) ----------------
phase5_notes:
  no_docker: >
    Every STH graded path runs with NO Docker. Fluss local cluster = 3 JVMs
    (ZK + coordinator + tablet), ~0.5 GB total RSS, coordinator up in ~2 s. The
    Fluss->Paimon tiering adds a native Flink local cluster (JM ~1024m +
    TM ~1536m). At most ONE Fluss cluster + ONE Flink cluster per agent at a
    time (32 GB host). Isolate parallel runs with per-test tmp dirs AND
    OS-assigned free ports for: ZK clientPort, Fluss bind.listeners, Flink
    rest.port. ALWAYS stop both clusters in a trap/finally and `pkill -f <probe
    dir>`; the tiering service is a long-running job — submit detached, read with
    a wall-clock deadline, never iterate an unbounded result.
  ports: >
    No fixed ports — all OS-assigned free (127.0.0.1). Never bind 5432/8888
    (user's local_pgdb/pgadmin) nor the core/streaming/flink profile ports.
  verification: >
    All five Phase-5 probes passed on 2026-10-04:
    (1) Paimon partial-update merge [1,Alice,a@x.com,555-1] (6 s, embedded batch);
    (2) Paimon changelog via acct$audit_log (7 s); (3) Fluss PK write+batch read
    [1,175]/[2,50] (10 s) AND full Fluss->Paimon tiering, t_user$lake + pypaimon
    both read {id:[1,2],name:[Alice,Bob]} (~36 s); (4) Iceberg Flink sink from a
    debezium-json CDC changelog, v2 snapshot committed, batch read count=1 sum=175
    (6 s); (5) serving: pypaimon + pyiceberg->DuckDB. fetch_streamhouse.sh is
    idempotent (2nd run 0 downloads) and checksum-verified.
