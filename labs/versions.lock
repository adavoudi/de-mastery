# =============================================================================
# labs/versions.lock  —  pinned versions for the lab stack.
#
# Phase 1 pins ONLY the `core` profile. Every image is pinned to an exact tag
# (no `latest`) and the digest observed when this lock was written is recorded
# so a changed upstream tag is detectable. Update this file deliberately, not
# incidentally.
#
# Verified on: 2026-10-03, linux/amd64, Docker 28.3.3, Compose v2.39.1.
# smoke_core.sh passed end to end (Spark 4.0.0 + Trino 476 on one Iceberg table).
# =============================================================================

profiles:
  core:
    images:
      object_store:
        # pgsty/silo: a maintained drop-in fork of MinIO. See `notes.object_store`.
        image: pgsty/silo
        tag: RELEASE.2026-09-03T13-18-01Z
        digest: sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3
        role: S3-compatible object storage (S3 API :9000, console :9001)

      object_store_client:
        # Used only by the one-shot bucket-creation job. Client binary is `mc`
        # (NOT `mcli`, which exists only in the silo server image).
        image: pgsty/mc
        tag: RELEASE.2026-09-16T00-00-00Z
        digest: sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
        role: creates the `warehouse` bucket, then exits

      iceberg_rest_catalog:
        # Apache-maintained reference REST catalog (preferred over the
        # unmaintained community tabulario/iceberg-rest).
        image: apache/iceberg-rest-fixture
        tag: "1.10.0"
        digest: sha256:df2e9dd421928b7aab01557678ce8e2bb73064d0e253baebd72adad3439ffc2e
        role: Iceberg REST catalog, data + metadata in silo/S3 (:8181)

      spark_base:
        # Base image. The `core` Spark service is BUILT from this with the two
        # Iceberg jars baked in (images/spark/Dockerfile) -> de-core/spark:...
        image: apache/spark
