<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DE Mastery{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<header>
  <h1><a href="/" style="color:inherit;text-decoration:none">DE Mastery</a></h1>
  {% if user %}
  <div class="who">
    {% if user["avatar_url"] %}<img src="{{ user['avatar_url'] }}" alt="">{% endif %}
    <span>{{ user["login"] }}</span>
    <form class="inline" method="post" action="/auth/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn" type="submit">Sign out</button>
    </form>
  </div>
  {% endif %}
</header>
{% block body %}{% endblock %}
</main>
</body>
</html>
